name: Release (stable)

# 0004 Phase 3 — the release gesture is a version tag: bump
# packages/desktop/package.json's version, tag vX.Y.Z, push the tag. This
# builds the self-contained NSIS installer and publishes it + latest.yml
# (electron-updater's feed) to a GitHub Release; every always-on packaged app
# then shows "Update available" and updates only on an explicit click.
#
# This is the stable counterpart to release-staging.yml — same
# build-channel-config.mjs pipeline, "stable" channel: same appId/productName
# the app has always shipped under, draft release (a human click is still the
# gate), latest.yml as the update feed.
#
# THE TAG NAME IS NOT THE VERSION. electron-updater compares the installed
# app's version against the version inside latest.yml, which comes from
# packages/desktop/package.json — not from the tag. Tagging v0.2.0 while that
# file still says 0.1.0 publishes a feed advertising 0.1.0, which every client
# reads as "already up to date". The release then looks successful and ships
# nothing. Bump the file and tag the commit that contains the bump.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the release + upload installer assets

jobs:
  # A tag trigger cannot be filtered by branch — `on.push.tags` fires for a v*
  # tag pushed anywhere, including staging or a feature branch. CLAUDE.md's
  # contract is "CI ships on MAIN tags", so the branch check has to happen here.
  # Cheap, and it fails the release before any build work.
  guard:
    name: tag must be on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need main's history to test ancestry
      - name: Verify the tagged commit is on main
        shell: bash
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on origin/main."
            echo "Releases ship from main only. Promote staging -> main first, then tag that commit."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} is on main."

  release:
    name: build & publish installer
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 — SHA-pinned (third-party); reads packageManager (pnpm@11.6.0) from package.json
      - uses: actions/setup-node@v4
        with:
          # Must match the native prebuilds' ABI: prepare-resources.mjs ships
          # THIS runner's node as the packaged runtime.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @sparstrow/memory-mcp build
      - run: pnpm --filter @sparstrow/memory-cli build
      # dist:stable = tsc → prepare-resources (channel=stable) →
      # build-channel-config → electron-builder --publish always (draft;
      # release.yml's own generate-notes step below fills it, a human still
      # clicks publish).
      - run: pnpm --filter @sparstrow/desktop dist:stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder leaves the release as an empty-bodied DRAFT. Fill the
      # notes from the merged PRs since the previous tag; the draft stays a
      # draft — publishing it (a human click) is the release gate, and
      # electron-updater only sees the update once it's published.
      - name: Generate release notes
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > notes.md
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name==\"${GITHUB_REF_NAME}\") | .id" | head -1)
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F body=@notes.md > /dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
