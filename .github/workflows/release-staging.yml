name: Release (staging)

# Desktop channel infra — the staging counterpart to release.yml. Every push
# to `staging` (i.e. every development -> staging PR merge) builds and
# publishes a new "Sparstrowgen Staging" installer immediately, non-draft, no
# manual click. That's a deliberate difference from release.yml's tag + draft
# + human-publish flow: the review checkpoint for this branch already exists
# one level up (nothing reaches `staging` without a PR, and nothing reaches
# `main` without the owner's explicit approval on staging.sparstrow.com per
# AGENTS.md §2 rule 8), so a second manual click here would be pure friction
# with no matching safety benefit.
#
# Stable and staging are otherwise the same pipeline running the same
# electron-builder config (see build-channel-config.mjs) with two fields
# different: appId/productName (so the two installers coexist on one machine)
# and the version's prerelease suffix, which is what makes electron-builder
# publish a separate staging.yml update feed alongside stable's latest.yml.
#
# electron-builder itself always creates the release as a DRAFT here, same as
# stable — GitHub's release-creation endpoint started rejecting a direct
# `draft: false` create call 2026-08-30 (T-DR-05: "Published releases must
# have a valid tag", since the tag genuinely doesn't exist until the release
# is created). The "Publish the staging draft release" step below does what a
# human click does for stable, immediately and automatically instead.

on:
  push:
    branches: [staging]

permissions:
  contents: write # create the release + upload installer assets

jobs:
  release:
    name: build & publish staging installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 — SHA-pinned (third-party); reads packageManager (pnpm@11.6.0) from package.json
      - uses: actions/setup-node@v4
        with:
          # Must match the native prebuilds' ABI: prepare-resources.mjs ships
          # THIS runner's node as the packaged runtime.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @sparstrow/memory-mcp build
      - run: pnpm --filter @sparstrow/memory-cli build
      # dist:staging = tsc -> prepare-resources (channel=staging) ->
      # build-channel-config (appId/productName override + version suffix) ->
      # electron-builder --publish always, draft (same as stable — see the
      # comment above).
      - run: pnpm --filter @sparstrow/desktop dist:staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARSTROW_BUILD_NUMBER: ${{ github.run_number }}
      # Publishing the draft is what makes the tag + release real and visible
      # to electron-updater clients. Looked up by tag_name rather than
      # "get release by tag" (that endpoint only resolves an existing git
      # tag, which a draft deliberately doesn't have yet).
      - name: Publish the staging draft release
        shell: bash
        working-directory: packages/desktop
        run: |
          VERSION=$(node -p "require('./electron-builder.staging.generated.json').extraMetadata.version")
          TAG="v${VERSION}"
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name==\"${TAG}\" and .draft==true) | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No draft release found for tag ${TAG} — dist:staging must not have created it."
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f draft=false > /dev/null
          echo "Published release ${RELEASE_ID} (${TAG})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
