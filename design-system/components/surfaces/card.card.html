<!doctype html>
<html class="dark"><head><meta charset="utf-8">
<title>Card</title>
<meta name="description" content="Card — the flat-by-default surface: 1px border, no drop shadow">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);
       font-family:var(--font-sans);font-size:14px}
  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;
       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:0}
  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}
  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}
  .note{font-size:12px;color:var(--muted-foreground)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-3);width:100%}
  .sw{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
  .sw .chip{height:56px}
  .sw .meta{padding:8px 10px;font-size:11px;line-height:1.45}
  .sw .name{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px;color:var(--muted-foreground)}
  .sw .val{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}
  .c{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
     border-radius:var(--radius-lg);padding:var(--space-5);min-width:230px}
  .c h4{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .c p{margin:0;font-size:13px;color:var(--muted-foreground);line-height:1.5}
  .onbg{background:var(--background);padding:var(--space-4);border-radius:var(--radius-lg);width:100%}
</style></head><body>
<div class="row"><div class="lbl">Default</div><div class="sp">
  <div class="c"><h4>Runs</h4><p>12 completed in the last hour across 3 machines.</p></div>
  <div class="c"><h4>Memory</h4><p>1,204 notes indexed locally.</p></div>
</div></div>
<div class="row"><div class="lbl">On canvas</div><div class="onbg">
  <div class="c" style="max-width:320px"><h4>Elevation comes from the border</h4>
  <p>The card sits one lightness step above the page background. No drop shadow &mdash;
     depth is the 1px line plus the surface step.</p></div>
</div></div>
</body></html>
