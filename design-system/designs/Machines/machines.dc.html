<!doctype html>
<html class="dark"><head><meta charset="utf-8">
<title>Machines</title>
<meta name="description" content="Machines list + per-machine profile (tab strip + side sub-nav, DD-003/DD-008) with provider logos, DESIGN.md §9/§13">
<link rel="stylesheet" href="../../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:14px}
  .page{max-width:1180px;margin:0 auto;padding:24px 20px 80px}

  /* prototype-only reviewer control — not real product UI, see handoff */
  .devbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
          padding:10px;background:color-mix(in oklab, var(--background) 90%, transparent);
          backdrop-filter:blur(6px);border-bottom:1px dashed var(--border);margin-bottom:24px}
  .devbar button{font:inherit;font-size:11px;padding:4px 10px;border-radius:var(--radius-sm);
          border:1px solid var(--border);background:transparent;color:var(--muted-foreground);cursor:pointer}
  .devbar button.active{background:var(--secondary);color:var(--secondary-foreground);border-color:transparent}
  .devbar .tag{font-size:10px;color:var(--muted-foreground);align-self:center;margin-right:6px;
          text-transform:uppercase;letter-spacing:.05em}
  .devbar .sep{width:1px;align-self:stretch;background:var(--border);margin:0 4px}

  /* ═══ app frame — the new outer tab strip + inner side sub-nav (DESIGN.md §9) ═══ */
  .frame{border:1px solid var(--border);border-radius:var(--radius-xl);background:var(--background);
         overflow:hidden;display:flex;flex-direction:column;height:720px;box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05)}

  .tabstrip{display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--border);
            height:38px;flex:none;overflow-x:auto}
  .ts-home{display:flex;align-items:center;padding:0 12px;color:var(--muted-foreground);border-right:1px solid var(--border);flex:none}
  .ts-tab{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12.5px;color:var(--muted-foreground);
          border-right:1px solid var(--border);max-width:190px;position:relative;cursor:pointer;flex:none;
          transition:color 140ms ease,background-color 140ms ease}
  .ts-tab:hover{background:var(--accent)}
  .ts-tab.on{background:var(--background);color:var(--foreground);font-weight:600}
  .ts-tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand,var(--foreground))}
  .ts-tab .dot{width:6px;height:6px;border-radius:999px;flex:none}
  .ts-tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ts-tab .x{opacity:0;margin-left:2px;color:var(--muted-foreground);border-radius:3px;padding:1px;flex:none}
  .ts-tab:hover .x, .ts-tab.on .x{opacity:.7}
  .ts-tab .x:hover{opacity:1 !important;background:var(--secondary)}

  .fbody{display:grid;grid-template-columns:1fr;flex:1;min-height:0}
  .fcontent{padding:20px;overflow:auto;min-width:0}

  /* ═══ list view ═══ */
  .crumb{font-size:12px;color:var(--muted-foreground);margin-bottom:6px}
  .header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:2px}
  .header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
         padding:0 6px;border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);
         font-size:11px;font-weight:600}
  .subtitle{margin:4px 0 20px;font-size:13px;color:var(--muted-foreground);max-width:60ch}
  .cli-chip{border:1px solid var(--border);background:color-mix(in oklab, var(--muted) 55%, transparent);
            border-radius:var(--radius-md);padding:6px 12px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;font-size:12.5px;flex:none}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}

  /* just-paired panel */
  .justpaired{display:flex;align-items:flex-start;gap:10px;border-radius:var(--radius-lg);
             background:color-mix(in oklab, var(--muted) 40%, transparent);padding:16px 20px;
             margin-bottom:20px}
  .justpaired .ok-badge{flex:none;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;
             justify-content:center;background:color-mix(in oklab, var(--success) 15%, transparent);color:var(--success)}
  .justpaired p{margin:0;font-size:13px}
  .justpaired .sub{color:var(--muted-foreground);margin-top:2px}
  .justpaired .dismiss{margin-left:auto}

  /* empty state */
  .empty{border:1px dashed var(--border);border-radius:var(--radius-lg);padding:44px 24px;text-align:center}
  .empty svg{opacity:.5;margin-bottom:10px}
  .empty h3{margin:0 0 4px;font-size:14px;font-weight:600}
  .empty p{margin:0 auto;max-width:420px;font-size:13px;color:var(--muted-foreground);line-height:1.55}
  .empty code{display:block;margin:14px auto 0;max-width:260px;background:var(--background);border:1px solid var(--border);
             border-radius:var(--radius-md);padding:8px 10px;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;font-size:12.5px}
  .empty .hint{margin-top:8px;font-size:11.5px}
  .empty .note{margin-top:14px;font-size:11px;color:var(--muted-foreground);max-width:440px}

  /* skeleton / loading */
  @keyframes sgPulse{0%,100%{opacity:1}50%{opacity:.45}}
  .sk{border-radius:var(--radius-md);background:var(--muted);animation:sgPulse 1.4s ease infinite}
  .sk-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
  .sk-row:last-child{border-bottom:0}

  /* error state */
  .err-box{border:1px solid color-mix(in oklab, var(--destructive) 45%, var(--border));
           background:color-mix(in oklab, var(--destructive) 10%, var(--card));
           border-radius:var(--radius-lg);padding:16px 20px;
           display:flex;align-items:flex-start;gap:12px}
  .err-box svg{flex-shrink:0;color:var(--destructive);margin-top:1px}
  .err-title{font-size:13px;font-weight:600;margin:0 0 2px}
  .err-detail{font-size:12.5px;color:var(--muted-foreground);margin:0;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace}
  .err-retry{margin-top:10px}

  /* buttons + badges */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
       border-radius:var(--radius-md);font-size:13px;font-weight:500;border:0;cursor:pointer;
       height:32px;padding:0 12px;font-family:inherit;transition:background-color 140ms ease}
  .btn-outline{background:var(--background);color:var(--foreground);border:1px solid var(--border)}
  .btn-outline:hover{background:var(--accent)}
  .btn-ghost{background:transparent;color:var(--muted-foreground);height:28px;width:28px;padding:0}
  .btn-ghost:hover{background:var(--accent);color:var(--foreground)}
  .btn-ghost-danger{color:var(--destructive)}
  .btn-ghost-danger:hover{background:color-mix(in oklab, var(--destructive) 12%, transparent);color:var(--destructive)}
  .btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
  .btn-sm{height:26px;padding:0 9px;font-size:12px}
  .btn:disabled{opacity:.5;pointer-events:none}

  .bdg{display:inline-flex;align-items:center;gap:5px;border-radius:var(--radius-sm);
       padding:3px 8px 3px 5px;font-size:11px;font-weight:500}
  .bdg-secondary{background:var(--secondary);color:var(--secondary-foreground)}
  .bdg-outline{color:var(--muted-foreground);border:1px solid var(--border);padding:3px 8px}
  .bdg svg{flex:none}

  /* provider-logo chip — fixed light background so a brand's real hex (some of
     which are near-black, e.g. Anthropic/Ollama) always has somewhere to sit
     with contrast, regardless of the app's own dark/light mode. */
  .pmark{display:inline-flex;align-items:center;justify-content:center;flex:none;
        width:18px;height:18px;border-radius:5px;background:#fff;padding:2px}
  .pmark.pmark-lg{width:30px;height:30px;border-radius:8px;padding:5px}
  .pmark svg{display:block;width:100%;height:100%}
  .pmark-neutral{background:var(--accent);padding:3px}
  .pmark-neutral svg{color:var(--muted-foreground)}
  .pmark-neutral.pmark-lg{padding:6px}

  /* ═══ entity tile — DESIGN.md §6, the single most important visual pattern ═══ */
  .tile{position:relative;flex:none;display:flex;align-items:center;justify-content:center;
        width:32px;height:32px;border-radius:var(--radius-md);background:var(--accent);color:var(--muted-foreground)}
  .tile .stdot{position:absolute;left:-2px;bottom:-2px;width:9px;height:9px;border-radius:999px;
              ring:2px;box-shadow:0 0 0 2px var(--card)}
  .tile.lg{width:40px;height:40px;border-radius:var(--radius-lg)}
  .tile.lg .stdot{width:10px;height:10px}
  .dot-active{background:var(--success)}
  .dot-draining{background:var(--warning)}
  .dot-inactive{background:color-mix(in oklab, var(--muted-foreground) 45%, transparent)}

  /* machine rows */
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
       cursor:pointer;transition:background-color 140ms ease}
  .row:hover{background:var(--accent)}
  .row:last-child{border-bottom:0}
  .rinfo{min-width:0;flex:1}
  .rname-row{display:flex;align-items:center;gap:6px}
  .rname-btn{background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:600;color:var(--foreground);
             cursor:pointer;display:flex;align-items:center;gap:6px}
  .rname-btn .pencil{opacity:0;transition:opacity 140ms ease}
  .rname-btn:hover .pencil{opacity:.6}
  .rname-input{height:26px;font:inherit;font-size:13px;background:var(--background);border:1px solid var(--ring);
              border-radius:var(--radius-sm);padding:0 8px;color:var(--foreground);box-shadow:0 0 0 2px var(--ring)}
  .rmeta{margin:2px 0 0;font-size:12px;color:var(--muted-foreground)}
  .osmeta{display:inline-flex;align-items:center;gap:4px;vertical-align:-2px}
  .osmeta svg{flex:none}
  .rmeta .active{color:var(--success);font-weight:500}
  .rmeta .draining{color:var(--warning);font-weight:500}
  .rcaps{display:flex;flex-wrap:wrap;align-items:center;gap:5px;max-width:280px}
  .rcaps .overflow{color:var(--muted-foreground);font-size:11px;padding:3px 6px}
  .ractions{display:flex;align-items:center;gap:2px}
  .chev{color:var(--muted-foreground);flex:none}

  /* ═══ profile view ═══ */
  .profile{display:flex;gap:20px;height:100%}
  .subnav{width:150px;flex:none;display:flex;flex-direction:column;gap:1px}
  .subnav-h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);
           font-weight:700;padding:0 8px;margin:0 0 6px}
  .sn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius-sm);
     color:var(--muted-foreground);font-size:12.5px;cursor:pointer;transition:background-color 140ms ease}
  .sn:hover{background:var(--accent)}
  .sn.on{background:color-mix(in oklab, var(--accent) 70%, transparent);color:var(--foreground);font-weight:600}
  .pmain{flex:1;min-width:0;overflow:auto}
  .phd{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;
      border-bottom:1px solid var(--border)}
  .phd h2{margin:0;font-size:16px;font-weight:700}
  .phd .pm{font-size:12px;color:var(--muted-foreground);margin-top:2px}
  .phd-actions{margin-left:auto;display:flex;gap:6px}

  .sect-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-foreground);
         font-weight:700;margin:0 0 10px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:10px 0;font-size:12.5px;max-width:520px}
  .kv .k{color:var(--muted-foreground)}
  .kv .v{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;font-size:12px}
  .kv .v.status-active{color:var(--success);font-family:inherit;font-weight:600}
  .kv .v.status-draining{color:var(--warning);font-family:inherit;font-weight:600}
  .kv .v.status-inactive{color:var(--muted-foreground);font-family:inherit;font-weight:600}

  .provrow{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border)}
  .provrow:last-child{border-bottom:0}
  .provrow .pname{font-size:13px;font-weight:600}
  .provrow .pid{font-size:11px;color:var(--muted-foreground);font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace}
  .provrow .pill{margin-left:auto;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:500}
  .pill-available{background:color-mix(in oklab, var(--success) 15%, transparent);color:var(--success)}
  .prov-empty{border:1px dashed var(--border);border-radius:var(--radius-lg);padding:28px 20px;text-align:center;
             color:var(--muted-foreground);font-size:12.5px}

  .settings-block{border-bottom:1px solid var(--border);padding:16px 0}
  .settings-block:first-child{padding-top:0}
  .settings-block:last-child{border-bottom:0}
  .settings-block .row-flex{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  .settings-block .lbl{font-size:12.5px;font-weight:600}
  .settings-block .desc{font-size:11.5px;color:var(--muted-foreground);margin-top:2px;max-width:52ch}
  .settings-block.danger .lbl{color:var(--destructive)}
  .switch{position:relative;width:32px;height:18px;border-radius:999px;background:var(--secondary);
         border:0;cursor:pointer;flex:none;transition:background-color 140ms ease}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:999px;
                background:var(--foreground);transition:transform 140ms ease}
  .switch.on{background:var(--success)}
  .switch.on::after{transform:translateX(14px);background:var(--background)}
  .switch:disabled{opacity:.5;cursor:not-allowed}

  .act-list{font-size:12.5px;color:var(--muted-foreground);line-height:1.7}
  .act-list b{color:var(--foreground)}

  /* confirm dialog */
  .overlay{position:fixed;inset:0;background:rgb(0 0 0 / .5);display:flex;align-items:center;justify-content:center;
           z-index:50;opacity:0;pointer-events:none;transition:opacity 140ms ease}
  .overlay.open{opacity:1;pointer-events:auto}
  .dialog{width:420px;max-width:calc(100vw - 32px);background:var(--popover);color:var(--popover-foreground);
          border:1px solid var(--border);border-radius:var(--radius-xl);padding:20px;
          box-shadow:0 18px 44px -14px rgb(0 0 0 / .65);transform:translateY(6px);transition:transform 140ms ease}
  .overlay.open .dialog{transform:none}
  .dialog h3{margin:0 0 8px;font-size:15px;font-weight:600}
  .dialog p{margin:0 0 16px;font-size:13px;color:var(--muted-foreground);line-height:1.55}
  .dialog .actions{display:flex;justify-content:flex-end;gap:8px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
         background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);
         padding:8px 14px;font-size:12.5px;display:flex;align-items:center;gap:8px;
         box-shadow:0 1px 2px 0 rgb(0 0 0 / 0.05);opacity:0;transition:opacity 140ms ease;z-index:60}
  .toast.show{opacity:1}

  @media (prefers-reduced-motion: reduce){ *{transition-duration:1ms !important;animation-duration:1ms !important} }
</style></head>
<body>

<div class="devbar" role="toolbar" aria-label="Prototype state switcher — not real product UI">
  <span class="tag">List state</span>
  <button data-state="populated" class="active">Populated</button>
  <button data-state="empty">Empty</button>
  <button data-state="loading">Loading</button>
  <button data-state="error">Error</button>
  <span class="sep"></span>
  <button id="simulate-pair-btn">Simulate: machine just paired</button>
  <button id="reset-btn">Reset</button>
</div>

<div class="page">
  <div class="frame" id="frame">
    <div class="tabstrip" id="tabstrip"></div>
    <div class="fbody">
      <div class="fcontent" id="content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="confirm-overlay">
  <div class="dialog">
    <h3 id="confirm-title"></h3>
    <p id="confirm-desc"></p>
    <div class="actions">
      <button class="btn btn-outline" id="confirm-cancel">Cancel</button>
      <button class="btn btn-destructive" id="confirm-ok"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { runtimes as SEED_RUNTIMES, runtimeIsActive, PROVIDER_ICONS } from "../../lib/sparstrowgen-data.js";

let runtimes = SEED_RUNTIMES.map((r) => ({ ...r, reportedSettings: { ...r.reportedSettings } }));
let listState = "populated";      // populated | empty | loading | error
let justPaired = null;            // machine name string | null
let confirmTarget = null;         // { id, kind: "revoke" | "remove" }
let tabs = [{ kind: "list" }];
let activeTab = 0;

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

function relativeTime(iso) {
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60_000) return "just now";
  const minutes = Math.floor(ms / 60_000);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

/** active | draining | inactive — mirrors machineState() in packages/shared. */
function machineState(r) {
  if (r.status === "draining") return "draining";
  return runtimeIsActive(r) ? "active" : "inactive";
}

// Real brand hex, not currentColor — a mark's own colour is part of what makes
// it recognizable at a glance. Rendered on a fixed light chip (.pmark) rather
// than the app's own --accent/--secondary surface, because several of these
// (anthropic-api, ollama) are near-black and would vanish on a dark tile;
// a light chip guarantees contrast for every hex without hand-tuning each one.
function iconSvg(icon, size = 14) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="#${icon.hex}" aria-hidden="true"><path d="${icon.path}"/></svg>`;
}

/** ProviderLogo — single source of truth for provider iconography. See handoff
 *  §"Provider logos": sourced from the CC0-licensed simple-icons project, not
 *  copied from any competitor. Falls back to a neutral placeholder mark for
 *  providers with no safe icon to source (antigravity) or no seed match. */
function providerBadge(capability, { withLabel = true } = {}) {
  const icon = PROVIDER_ICONS[capability];
  const label = icon ? icon.label : capability;
  const mark = icon
    ? `<span class="pmark">${iconSvg(icon, 12)}</span>`
    : `<span class="pmark pmark-neutral"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>`;
  return `<span class="bdg bdg-secondary" title="${label}">${mark}${withLabel ? `<span>${label}</span>` : ""}</span>`;
}

/* ═══════════════════════════ tab strip ═══════════════════════════ */

function renderTabstrip() {
  const el = $("#tabstrip");
  el.innerHTML =
    `<div class="ts-home" title="Machines">${monitorIconSvg(15)}</div>` +
    tabs.map((t, i) => {
      if (t.kind === "list") {
        return `<div class="ts-tab ${i === activeTab ? "on" : ""}" data-i="${i}"><span class="nm">Machines</span></div>`;
      }
      const m = runtimes.find((x) => x.id === t.id);
      if (!m) return "";
      const state = machineState(m);
      const dotClass = state === "active" ? "dot-active" : state === "draining" ? "dot-draining" : "dot-inactive";
      return `<div class="ts-tab ${i === activeTab ? "on" : ""}" data-i="${i}" title="${m.name}">
        <span class="dot ${dotClass}"></span><span class="nm">${m.name}</span>
        <span class="x" data-close="${i}" title="Close tab" aria-label="Close ${m.name} tab">${xIconSvg(10)}</span>
      </div>`;
    }).join("");

  $$(".ts-tab", el).forEach((n) => n.addEventListener("click", (e) => {
    if (e.target.closest("[data-close]")) return;
    activeTab = Number(n.dataset.i);
    render();
  }));
  $$("[data-close]", el).forEach((n) => n.addEventListener("click", (e) => {
    e.stopPropagation();
    const i = Number(n.dataset.close);
    tabs.splice(i, 1);
    if (activeTab >= tabs.length) activeTab = tabs.length - 1;
    if (activeTab < 0 || tabs.length === 0) { tabs = [{ kind: "list" }]; activeTab = 0; }
    render();
  }));
}

/** §9.1's "one tab per open entity" rule — reused rows focus, never duplicate. */
function openMachine(id) {
  const existing = tabs.findIndex((t) => t.kind === "machine" && t.id === id);
  if (existing >= 0) { activeTab = existing; }
  else { tabs.push({ kind: "machine", id, sub: "overview" }); activeTab = tabs.length - 1; }
  render();
}

/* ═══════════════════════════ list view ═══════════════════════════ */

function renderList() {
  const machines = listState === "empty" ? [] : runtimes;
  const showCount = listState === "populated" || listState === "empty";

  $("#content").innerHTML = `
    <div class="crumb">Workspace</div>
    <div class="header">
      <h1>Machines ${showCount ? `<span class="count">${machines.length}</span>` : ""}</h1>
      ${listState === "populated" ? `<code class="cli-chip">sparstrow pair</code>` : ""}
    </div>
    <p class="subtitle">Machines running Sparstrow core that this workspace can reach. Agents run on these, not in the browser.</p>

    ${justPaired && (listState === "populated") ? `
      <div class="justpaired" role="status">
        <span class="ok-badge">${checkIconSvg(14)}</span>
        <div>
          <p><b>${justPaired}</b> is paired</p>
          <p class="sub">Restart core on that machine if it was already running.</p>
        </div>
        <button class="btn btn-ghost dismiss" id="dismiss-justpaired" aria-label="Dismiss">${xIconSvg(14)}</button>
      </div>` : ""}

    <div id="list-body"></div>`;

  $("#dismiss-justpaired")?.addEventListener("click", () => { justPaired = null; renderList(); });

  const body = $("#list-body");
  if (listState === "error") {
    body.innerHTML = `
      <div class="err-box" role="alert">
        ${alertIconSvg(18)}
        <div>
          <p class="err-title">Couldn't load machines</p>
          <p class="err-detail">GET /api/v1/runtimes → 503 control plane unreachable</p>
          <button class="btn btn-outline err-retry" id="error-retry-btn">Retry</button>
        </div>
      </div>`;
    $("#error-retry-btn").addEventListener("click", () => { listState = "loading"; renderList(); setTimeout(() => { listState = "populated"; renderList(); }, 700); });
    return;
  }

  if (listState === "loading") {
    body.innerHTML = `<div class="panel">${Array.from({ length: 3 }).map(() => `
      <div class="sk-row">
        <div class="sk" style="width:32px;height:32px;border-radius:8px"></div>
        <div style="flex:1"><div class="sk" style="width:160px;height:14px;margin-bottom:6px"></div><div class="sk" style="width:260px;height:11px"></div></div>
        <div class="sk" style="width:80px;height:20px;border-radius:999px"></div>
      </div>`).join("")}</div>`;
    return;
  }

  if (listState === "empty") {
    body.innerHTML = `
      <div class="empty">
        ${monitorIconSvg(28)}
        <h3>No machines paired yet</h3>
        <p>A machine is a computer running Sparstrow core. Pairing links it to this workspace so agents have somewhere to actually run — nothing runs in the browser.</p>
        <p class="hint" style="color:var(--muted-foreground)">On the machine you want to pair, run:</p>
        <code>sparstrow pair</code>
        <p class="hint">It opens your browser to confirm — nothing to copy or type here.</p>
        <p class="note">sparstrow isn't published yet — the machine needs a checkout of this repository to run it. Packaged installers are coming.</p>
      </div>`;
    return;
  }

  // populated
  body.innerHTML = `<div class="panel">${runtimes.map((r) => rowHtml(r)).join("")}</div>`;
  wireListRows();
}

function rowHtml(r) {
  const state = machineState(r);
  const dotClass = state === "active" ? "dot-active" : state === "draining" ? "dot-draining" : "dot-inactive";
  const metaWord = state === "active"
    ? `<span class="active">online</span>`
    : state === "draining"
      ? `<span class="draining">shutting down</span>`
      : `last seen ${relativeTime(r.lastHeartbeat)}`;

  const MAX_SHOWN = 4;
  const shown = r.capabilities.slice(0, MAX_SHOWN);
  const overflow = r.capabilities.length - shown.length;
  const caps = r.capabilities.length === 0
    ? `<span class="bdg bdg-outline" title="This machine reported no usable providers">no providers</span>`
    : shown.map((c) => providerBadge(c, { withLabel: false })).join("") +
      (overflow > 0 ? `<span class="overflow">+${overflow}</span>` : "");

  return `
    <div class="row" data-id="${r.id}" data-open>
      <span class="tile"><span aria-hidden="true">${monitorIconSvg(15)}</span><span class="stdot ${dotClass}"></span></span>
      <div class="rinfo">
        <div class="rname-row">
          <button type="button" class="rname-btn" data-rename aria-label="Rename ${r.name}" title="Rename this machine">
            <span data-name>${r.name}</span>
            <span class="pencil" aria-hidden="true">${pencilIconSvg(12)}</span>
          </button>
        </div>
        <p class="rmeta">${metaWord} · <span class="osmeta">${osIconSvg(r.os, 12)}${r.os}</span> · ${r.hostname}${r.coreVersion ? ` · core ${r.coreVersion}` : ""}</p>
      </div>
      <div class="rcaps">${caps}</div>
      <div class="ractions">
        <button class="btn btn-ghost" title="Revoke this machine's pairing" data-revoke aria-label="Revoke ${r.name}">${unplugIconSvg(15)}</button>
        <button class="btn btn-ghost btn-ghost-danger" title="Remove this machine from the workspace" data-remove aria-label="Remove ${r.name}">${trashIconSvg(15)}</button>
      </div>
      <span class="chev" aria-hidden="true">${chevronIconSvg(15)}</span>
    </div>`;
}

function wireListRows() {
  const body = $("#list-body");

  // Row click (anywhere except rename/actions) opens the profile as a tab.
  $$(".row[data-open]", body).forEach((row) => {
    row.addEventListener("click", (e) => {
      if (e.target.closest("[data-rename], [data-revoke], [data-remove], .rname-input")) return;
      openMachine(row.dataset.id);
    });
    row.setAttribute("tabindex", "0");
    row.setAttribute("role", "button");
    row.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && !e.target.closest("[data-rename]")) {
        e.preventDefault();
        openMachine(row.dataset.id);
      }
    });
  });

  // Inline rename — same commit/cancel shape as the real RuntimeRow (Enter/Escape called directly, not via blur-only).
  $$("[data-rename]", body).forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const row = btn.closest(".row");
    const id = row.dataset.id;
    const runtime = runtimes.find((r) => r.id === id);
    const container = btn.parentElement;
    container.innerHTML = `<input class="rname-input" value="${runtime.name}" data-name-input>`;
    const input = container.querySelector("input");
    input.focus();
    input.select();
    input.addEventListener("click", (ev) => ev.stopPropagation());
    let committed = false;
    const commit = () => {
      if (committed) return;
      committed = true;
      const next = input.value.trim();
      if (next) runtime.name = next;
      renderList();
    };
    const cancel = () => { if (committed) return; committed = true; renderList(); };
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (ke) => {
      // stopPropagation is load-bearing: without it, the SAME keydown also
      // bubbles to the row's own "Enter/Space opens the profile" handler
      // (wired for keyboard accessibility). By the time it bubbles up,
      // commit()/cancel() has already replaced this input back with the
      // button via renderList(), so the row handler's `.closest("[data-rename]")`
      // guard no longer finds this now-detached input and treats the Enter as
      // "open profile" too — reproduced live: renaming via Enter opened a
      // profile tab for the very row just renamed.
      if (ke.key === "Enter") { ke.stopPropagation(); commit(); }
      if (ke.key === "Escape") { ke.stopPropagation(); cancel(); }
    });
  }));

  $$("[data-revoke]", body).forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    openConfirm(btn.closest(".row").dataset.id, "revoke");
  }));
  $$("[data-remove]", body).forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    openConfirm(btn.closest(".row").dataset.id, "remove");
  }));
}

/* ═══════════════════════════ profile view ═══════════════════════════ */

const SUBNAV = [
  { k: "overview", nm: "Overview", ic: monitorIconSvg },
  { k: "providers", nm: "Providers", ic: botIconSvg },
  { k: "activity", nm: "Activity", ic: activityIconSvg },
  { k: "settings", nm: "Settings", ic: gearIconSvg },
];

function renderProfile(tab) {
  const m = runtimes.find((x) => x.id === tab.id);
  if (!m) { tabs.splice(tabs.indexOf(tab), 1); activeTab = 0; render(); return; }
  const state = machineState(m);
  const dotClass = state === "active" ? "dot-active" : state === "draining" ? "dot-draining" : "dot-inactive";

  $("#content").innerHTML = `
    <div class="profile">
      <div class="subnav">
        <div class="subnav-h">Machine</div>
        ${SUBNAV.map((s) => `<div class="sn ${tab.sub === s.k ? "on" : ""}" data-sub="${s.k}">${s.ic(14)}${s.nm}</div>`).join("")}
      </div>
      <div class="pmain">
        <div class="phd">
          <span class="tile lg"><span aria-hidden="true">${monitorIconSvg(18)}</span><span class="stdot ${dotClass}"></span></span>
          <div>
            <h2>${m.name}</h2>
            <div class="pm">${m.hostname}</div>
          </div>
        </div>
        <div id="profile-body"></div>
      </div>
    </div>`;

  renderProfileSection(m, tab);

  $$("[data-sub]", $("#content")).forEach((n) => n.addEventListener("click", () => {
    tab.sub = n.dataset.sub;
    render();
  }));
}

function renderProfileSection(m, tab) {
  const el = $("#profile-body");
  const state = machineState(m);

  if (tab.sub === "overview") {
    el.innerHTML = `
      <p class="sect-h">Diagnostics</p>
      <div class="kv">
        <span class="k">Status</span><span class="v status-${state}">${state === "active" ? "Online" : state === "draining" ? "Shutting down" : `Unreachable — last seen ${relativeTime(m.lastHeartbeat)}`}</span>
        <span class="k">Runtime ID</span><span class="v">${m.id}</span>
        <span class="k">Hostname</span><span class="v">${m.hostname}</span>
        <span class="k">Operating system</span><span class="v"><span class="osmeta">${osIconSvg(m.os, 13)}${m.os}</span>${m.isElectron ? " · desktop app" : " · headless daemon"}</span>
        <span class="k">Core version</span><span class="v">${m.coreVersion ?? "—"}</span>
        <span class="k">Providers detected</span><span class="v">${m.capabilities.length}</span>
      </div>`;
    return;
  }

  if (tab.sub === "providers") {
    el.innerHTML = `
      <p class="sect-h">AI providers on this machine</p>
      ${m.capabilities.length === 0 ? `
        <div class="prov-empty">This machine hasn't reported any usable providers yet.</div>` : `
        <div class="panel" style="border-radius:var(--radius-lg)">
          ${m.capabilities.map((c) => {
            const icon = PROVIDER_ICONS[c];
            const label = icon ? icon.label : c;
            const mark = icon
              ? `<span class="pmark pmark-lg">${iconSvg(icon, 18)}</span>`
              : `<span class="pmark pmark-lg pmark-neutral"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>`;
            return `<div class="provrow">
              ${mark}
              <div><div class="pname">${label}</div><div class="pid">${c}</div></div>
              <span class="pill pill-available">available</span>
            </div>`;
          }).join("")}
        </div>`}`;
    return;
  }

  if (tab.sub === "activity") {
    el.innerHTML = `
      <p class="sect-h">Recent activity</p>
      <p class="act-list">
        ${state === "active" ? `<b>3</b> runs in the last 24h · last activity <b>${relativeTime(m.lastHeartbeat)}</b>` : `No recent activity — this machine is unreachable.`}
      </p>
      <p class="act-list" style="margin-top:6px;color:var(--muted-foreground)">A full run-history table for this machine is future work — see handoff.</p>`;
    return;
  }

  // settings
  const reported = m.reportedSettings || {};
  const snapshotOn = reported.wipSnapshot !== "off";
  const terminalOn = reported.terminalAccess === "on";
  el.innerHTML = `
    <p class="sect-h">Settings</p>
    <div class="settings-block">
      <div class="row-flex">
        <div><div class="lbl">Snapshot uncommitted work</div>
          <div class="desc">${state === "active" ? "Keeps the last 5 runs' working trees on this machine, under a private git ref." : "This machine is unreachable — its settings can be changed when it reconnects."}</div></div>
        <button class="switch ${snapshotOn ? "on" : ""}" data-toggle="wipSnapshot" ${state !== "active" ? "disabled" : ""} role="switch" aria-checked="${snapshotOn}" aria-label="Snapshot uncommitted work on ${m.name}"></button>
      </div>
    </div>
    <div class="settings-block">
      <div class="row-flex">
        <div><div class="lbl">Browser terminals</div>
          <div class="desc">${state === "active" ? "Lets a signed-in browser open a shell on this machine. Turning it off ends any open sessions." : "This machine is unreachable — its settings can be changed when it reconnects."}</div></div>
        <button class="switch ${terminalOn ? "on" : ""}" data-toggle="terminalAccess" ${state !== "active" ? "disabled" : ""} role="switch" aria-checked="${terminalOn}" aria-label="Browser terminals on ${m.name}"></button>
      </div>
    </div>
    <div class="settings-block danger">
      <div class="row-flex">
        <div><div class="lbl">Revoke pairing</div>
          <div class="desc">Stops this machine reaching the workspace on its next request. It stays in the list — pair it again to restore access.</div></div>
        <button class="btn btn-outline btn-sm" data-profile-revoke>Revoke</button>
      </div>
    </div>
    <div class="settings-block danger">
      <div class="row-flex">
        <div><div class="lbl">Remove machine</div>
          <div class="desc">Deletes this machine and its pairing from the workspace. The machine itself keeps its local data — pair it again to reconnect.</div></div>
        <button class="btn btn-destructive btn-sm" data-profile-remove>Remove</button>
      </div>
    </div>`;

  $$("[data-toggle]", el).forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.dataset.toggle;
    const cur = m.reportedSettings[key];
    m.reportedSettings[key] = (key === "wipSnapshot" ? (cur === "off" ? "on" : "off") : (cur === "on" ? "off" : "on"));
    renderProfileSection(m, tab);
  }));
  $("[data-profile-revoke]", el)?.addEventListener("click", () => openConfirm(m.id, "revoke"));
  $("[data-profile-remove]", el)?.addEventListener("click", () => openConfirm(m.id, "remove"));
}

/* ═══════════════════════════ revoke / remove (shared) ═══════════════════════════ */

const CONFIRM_COPY = {
  revoke: {
    title: (name) => `Revoke ${name}?`,
    desc: "This machine stops reaching the workspace on its very next request. It stays in the list, and pairing it again restores access.",
    ok: "Revoke pairing",
  },
  remove: {
    title: (name) => `Remove ${name}?`,
    desc: "Deletes this machine and its pairing from the workspace. Anything recorded against it goes too. The machine itself keeps its local data — pair it again to reconnect.",
    ok: "Remove machine",
  },
};

function openConfirm(id, kind) {
  confirmTarget = { id, kind };
  const runtime = runtimes.find((r) => r.id === id);
  const copy = CONFIRM_COPY[kind];
  $("#confirm-title").textContent = copy.title(runtime.name);
  $("#confirm-desc").textContent = copy.desc;
  $("#confirm-ok").textContent = copy.ok;
  $("#confirm-overlay").classList.add("open");
}
function closeConfirm() {
  $("#confirm-overlay").classList.remove("open");
  confirmTarget = null;
}
$("#confirm-cancel").addEventListener("click", closeConfirm);
$("#confirm-overlay").addEventListener("click", (e) => { if (e.target.id === "confirm-overlay") closeConfirm(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#confirm-overlay").classList.contains("open")) closeConfirm(); });
$("#confirm-ok").addEventListener("click", () => {
  if (!confirmTarget) return;
  const { id, kind } = confirmTarget;
  const r = runtimes.find((x) => x.id === id);
  if (kind === "revoke") {
    r.status = "offline";
    showToast(`${r.name} revoked — pair again to restore access.`);
  } else {
    runtimes = runtimes.filter((x) => x.id !== id);
    tabs = tabs.filter((t) => !(t.kind === "machine" && t.id === id));
    if (activeTab >= tabs.length) activeTab = tabs.length - 1;
    showToast(`${r.name} removed.`);
  }
  closeConfirm();
  render();
});

let toastTimer;
function showToast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

/* ═══════════════════════════ render + state switcher ═══════════════════════════ */

function render() {
  renderTabstrip();
  const t = tabs[activeTab];
  if (!t || t.kind === "list") renderList();
  else renderProfile(t);
}

const STATES = ["populated", "empty", "loading", "error"];
$$(".devbar [data-state]").forEach((b) => b.addEventListener("click", () => {
  listState = b.dataset.state;
  $$(".devbar [data-state]").forEach((x) => x.classList.toggle("active", x === b));
  if (tabs[activeTab]?.kind === "list") render();
}));
$("#simulate-pair-btn").addEventListener("click", () => {
  const id = "rt_" + Math.random().toString(16).slice(2, 10);
  const name = "new-teammate-laptop";
  runtimes.push({
    id, name, os: "darwin", hostname: "MacBook-Pro.local", isElectron: true,
    capabilities: ["claude-code"], status: "online", coreVersion: "0.14.2",
    lastHeartbeat: new Date().toISOString(), reportedSettings: {},
  });
  justPaired = name;
  listState = "populated";
  $$(".devbar [data-state]").forEach((x) => x.classList.toggle("active", x.dataset.state === "populated"));
  if (tabs[activeTab]?.kind === "list") render();
});
$("#reset-btn").addEventListener("click", () => {
  runtimes = SEED_RUNTIMES.map((r) => ({ ...r, reportedSettings: { ...r.reportedSettings } }));
  tabs = [{ kind: "list" }]; activeTab = 0; justPaired = null; listState = "populated";
  $$(".devbar [data-state]").forEach((x) => x.classList.toggle("active", x.dataset.state === "populated"));
  render();
});

render();
</script>
