<!doctype html>
<html><head><meta charset="utf-8">
<title>Settings Redesign</title>
<meta name="description" content="Settings Redesign — 3-paradigm navigation prototype eliminating nested tabs">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:16px; background:var(--card,#161618); color:var(--foreground,#f4f4f5);
         font-family:var(--font-sans,system-ui); font-size:13px; }
  .preview-wrap { display:grid; grid-template-columns:90px 1fr; gap:12px; border:1px solid var(--border);
                  border-radius:var(--radius-md); padding:10px; background:var(--background); }
  .mini-nav { display:flex; flex-direction:column; gap:4px; border-right:1px solid var(--border); padding-right:8px; }
  .mini-item { font-size:10px; padding:3px 6px; border-radius:4px; color:var(--muted-foreground); }
  .mini-item.active { background:var(--card); color:var(--foreground); font-weight:600; }
  .mini-cards { display:flex; flex-direction:column; gap:6px; }
  .mini-card { background:var(--card); border:1px solid var(--border); border-radius:4px; height:24px; }
</style></head>
<body>
  <div class="preview-wrap">
    <div class="mini-nav">
      <div class="mini-item active">Profile</div>
      <div class="mini-item">Theme</div>
      <div class="mini-item">Git</div>
      <div class="mini-item">Workspace</div>
      <div class="mini-item">Providers</div>
    </div>
    <div class="mini-cards">
      <div class="mini-card" style="width: 80%;"></div>
      <div class="mini-card" style="width: 100%;"></div>
      <div class="mini-card" style="width: 60%;"></div>
    </div>
  </div>
</body></html>
