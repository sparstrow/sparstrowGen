<!doctype html>
<html class="dark" data-surface="paper" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings Redesign — Interactive Prototype</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    * { box-sizing: border-box; }

    /* =========================================================
       SURFACE THEME CONTRACT (DESIGN.md §2.2)
       ========================================================= */
    :root {
      /* Base Typography & Transitions */
      --font-sans: "Inter Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --transition-base: 140ms cubic-bezier(.4, 0, .2, 1);
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;

      /* Status Colors (Fixed & Non-themeable per §2.1) */
      --success: oklch(0.498 0.15 155);
      --success-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.68 0.22 25);
      --destructive-foreground: oklch(0.98 0 0);
      --warning: oklch(0.78 0.16 75);
      --warning-foreground: oklch(0.88 0.14 75);
    }

    /* 1. PAPER SURFACE (Default §2.2: Hue 85, Chroma 0.010 - Warm Linen Cast) */
    html[data-surface="paper"].dark {
      --background: oklch(0.145 0.010 85);       /* #1e1c18 warm charcoal */
      --card: oklch(0.195 0.010 85);             /* #2a2822 warm card */
      --accent: oklch(0.245 0.010 85);           /* #37342b raised surface */
      --foreground: oklch(0.97 0 0);
      --muted-foreground: oklch(0.68 0.010 85);
      --border: oklch(1 0 0 / 11%);
      --ring: oklch(0.78 0.15 70);               /* Warm Amber Brand */
      --primary: oklch(0.78 0.15 70);
      --primary-foreground: oklch(0.18 0.01 85);
      --secondary: oklch(0.245 0.010 85);
      --secondary-foreground: oklch(0.97 0 0);
    }
    html[data-surface="paper"].light {
      --background: oklch(0.965 0.012 85);      /* #f5f3eb warm editorial paper */
      --card: oklch(0.992 0.006 85);            /* #faf9f5 crisp card on warm bg */
      --accent: oklch(0.935 0.014 85);          /* #ece8dc raised element */
      --foreground: oklch(0.19 0.005 85);
      --muted-foreground: oklch(0.48 0.012 85);
      --border: oklch(0.2 0.01 85 / 12%);
      --ring: oklch(0.528 0.15 70);              /* Amber calibrated for light */
      --primary: oklch(0.528 0.15 70);
      --primary-foreground: #ffffff;
      --secondary: oklch(0.935 0.014 85);
      --secondary-foreground: oklch(0.19 0 0);
    }

    /* 2. SLATE SURFACE (§2.2: Hue 250, Chroma 0.011 - Cool Blue-Grey) */
    html[data-surface="slate"].dark {
      --background: oklch(0.145 0.011 250);      /* #151922 cool blue-grey */
      --card: oklch(0.195 0.011 250);            /* #1f2532 */
      --accent: oklch(0.245 0.011 250);
      --foreground: oklch(0.97 0 0);
      --muted-foreground: oklch(0.68 0.011 250);
      --border: oklch(1 0 0 / 11%);
      --ring: oklch(0.78 0.16 250);              /* Blue Brand */
      --primary: oklch(0.78 0.16 250);
      --primary-foreground: oklch(0.15 0.01 250);
      --secondary: oklch(0.245 0.011 250);
      --secondary-foreground: oklch(0.97 0 0);
    }
    html[data-surface="slate"].light {
      --background: oklch(0.965 0.011 250);      /* #edf1f7 clean cool slate */
      --card: oklch(0.995 0.004 250);            /* #ffffff */
      --accent: oklch(0.935 0.012 250);
      --foreground: oklch(0.19 0.005 250);
      --muted-foreground: oklch(0.48 0.011 250);
      --border: oklch(0.2 0.01 250 / 12%);
      --ring: oklch(0.520 0.16 250);
      --primary: oklch(0.520 0.16 250);
      --primary-foreground: #ffffff;
      --secondary: oklch(0.935 0.012 250);
      --secondary-foreground: oklch(0.19 0 0);
    }

    /* 3. SOFT SURFACE (§2.2: Hue 280, Chroma 0.007 - Lifted blacks & low contrast) */
    html[data-surface="soft"].dark {
      --background: oklch(0.190 0.007 280);      /* #232028 lifted dark */
      --card: oklch(0.228 0.007 280);            /* #2b2832 */
      --accent: oklch(0.268 0.007 280);
      --foreground: oklch(0.97 0 0);
      --muted-foreground: oklch(0.68 0.007 280);
      --border: oklch(1 0 0 / 8%);
      --ring: oklch(0.78 0.18 285);              /* Violet Brand */
      --primary: oklch(0.78 0.18 285);
      --primary-foreground: oklch(0.18 0 0);
      --secondary: oklch(0.268 0.007 280);
      --secondary-foreground: oklch(0.97 0 0);
    }
    html[data-surface="soft"].light {
      --background: oklch(0.972 0.008 280);      /* #f6f3f8 gentle tone */
      --card: oklch(0.995 0.003 280);
      --accent: oklch(0.942 0.009 280);
      --foreground: oklch(0.19 0 0);
      --muted-foreground: oklch(0.48 0.008 280);
      --border: oklch(0.2 0 0 / 10%);
      --ring: oklch(0.538 0.18 285);
      --primary: oklch(0.538 0.18 285);
      --primary-foreground: #ffffff;
      --secondary: oklch(0.942 0.009 280);
      --secondary-foreground: oklch(0.19 0 0);
    }

    /* 4. MONO SURFACE (§2.2: Chroma 0 - Pure Monochrome) */
    html[data-surface="mono"].dark {
      --background: #09090b;
      --card: #141416;
      --accent: #222226;
      --foreground: #fafafa;
      --muted-foreground: #a1a1aa;
      --border: rgba(255, 255, 255, 0.11);
      --ring: #fafafa;
      --primary: #fafafa;
      --primary-foreground: #09090b;
      --secondary: #222226;
      --secondary-foreground: #fafafa;
    }
    html[data-surface="mono"].light {
      --background: #f4f4f5;
      --card: #ffffff;
      --accent: #e4e4e7;
      --foreground: #09090b;
      --muted-foreground: #71717a;
      --border: rgba(0, 0, 0, 0.11);
      --ring: #09090b;
      --primary: #09090b;
      --primary-foreground: #ffffff;
      --secondary: #e4e4e7;
      --secondary-foreground: #09090b;
    }

    /* BRAND PRESETS (Doctrine §2.3) */
    html[data-brand="amber"].dark { --primary: oklch(0.78 0.15 70); --ring: oklch(0.78 0.15 70); --primary-foreground: oklch(0.15 0 0); }
    html[data-brand="amber"].light { --primary: oklch(0.528 0.15 70); --ring: oklch(0.528 0.15 70); --primary-foreground: #ffffff; }
    
    html[data-brand="violet"].dark { --primary: oklch(0.78 0.18 285); --ring: oklch(0.78 0.18 285); --primary-foreground: oklch(0.18 0 0); }
    html[data-brand="violet"].light { --primary: oklch(0.538 0.18 285); --ring: oklch(0.538 0.18 285); --primary-foreground: #ffffff; }

    html[data-brand="blue"].dark { --primary: oklch(0.78 0.16 250); --ring: oklch(0.78 0.16 250); --primary-foreground: oklch(0.16 0 0); }
    html[data-brand="blue"].light { --primary: oklch(0.520 0.16 250); --ring: oklch(0.520 0.16 250); --primary-foreground: #ffffff; }

    html[data-brand="teal"].dark { --primary: oklch(0.78 0.12 190); --ring: oklch(0.78 0.12 190); --primary-foreground: oklch(0.12 0 0); }
    html[data-brand="teal"].light { --primary: oklch(0.496 0.12 190); --ring: oklch(0.496 0.12 190); --primary-foreground: #ffffff; }

    html[data-brand="rose"].dark { --primary: oklch(0.78 0.16 15); --ring: oklch(0.78 0.16 15); --primary-foreground: oklch(0.16 0 0); }
    html[data-brand="rose"].light { --primary: oklch(0.542 0.16 15); --ring: oklch(0.542 0.16 15); --primary-foreground: #ffffff; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 140ms ease, color 140ms ease;
    }

    /* Top Reviewer Dev Bar */
    .devbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 20px;
      background: color-mix(in oklab, var(--background) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px dashed var(--border);
    }
    .devbar-group { display: flex; align-items: center; gap: 6px; }
    .devbar .tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-right: 4px;
    }
    .devbar button {
      font: inherit;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer;
      transition: all 140ms ease;
    }
    .devbar button:hover {
      background: var(--accent);
      color: var(--foreground);
    }
    .devbar button.active {
      background: var(--primary);
      color: var(--primary-foreground);
      border-color: transparent;
      font-weight: 600;
    }

    /* Outer Shell */
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 100px;
    }

    /* Page Header */
    .page-header {
      margin-bottom: 24px;
    }
    .page-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-header p {
      margin: 4px 0 0;
      font-size: 13.5px;
      color: var(--muted-foreground);
    }

    /* Fast Filter Search */
    .filter-box {
      margin-bottom: 20px;
      position: relative;
      max-width: 380px;
    }
    .filter-input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border-radius: var(--radius-md);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--foreground);
      font-size: 13px;
      outline: none;
      transition: border-color 140ms ease;
    }
    .filter-input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 25%, transparent);
    }
    .filter-icon {
      position: absolute;
      left: 10px;
      top: 10px;
      color: var(--muted-foreground);
      pointer-events: none;
    }

    /* =========================================================
       LAYOUT 1: MASTER-DETAIL SIDEBAR (RECOMMENDED)
       ========================================================= */
    .layout-sidebar {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 32px;
      align-items: start;
    }
    .settings-nav {
      position: sticky;
      top: 70px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: transparent;
    }
    .nav-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-foreground);
      margin-bottom: 6px;
      padding-left: 12px;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      color: var(--muted-foreground);
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 140ms ease;
      background: transparent;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover {
      background: var(--accent);
      color: var(--foreground);
    }
    .nav-item.active {
      background: var(--card);
      color: var(--foreground);
      font-weight: 600;
      border-color: var(--border);
    }
    .nav-item svg {
      flex-shrink: 0;
      opacity: 0.75;
    }
    .nav-item.active svg {
      opacity: 1;
      color: var(--primary);
    }

    /* =========================================================
       LAYOUT 2: UNIFIED HORIZONTAL TABS
       ========================================================= */
    .layout-tabs-header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .tabs-bar {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--muted-foreground);
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: all 140ms ease;
      white-space: nowrap;
    }
    .tab-btn:hover {
      color: var(--foreground);
      background: color-mix(in oklab, var(--accent) 50%, transparent);
    }
    .tab-btn.active {
      color: var(--foreground);
      font-weight: 600;
      border-bottom-color: var(--primary);
      background: color-mix(in oklab, var(--accent) 35%, transparent);
    }
    .tab-btn.active svg {
      color: var(--primary);
    }

    /* =========================================================
       LAYOUT 3: CONTINUOUS SCROLL WITH STICKY TOC
       ========================================================= */
    .layout-continuous {
      display: grid;
      grid-template-columns: 1fr 210px;
      gap: 36px;
      align-items: start;
    }
    .toc-sticky {
      position: sticky;
      top: 70px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .toc-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted-foreground);
      margin-bottom: 6px;
    }
    .toc-link {
      font-size: 12.5px;
      color: var(--muted-foreground);
      text-decoration: none;
      padding: 5px 8px;
      border-radius: var(--radius-sm);
      transition: all 140ms ease;
    }
    .toc-link:hover, .toc-link.active {
      color: var(--foreground);
      background: var(--accent);
    }

    /* =========================================================
       SETTINGS CARDS & COMPONENTS
       ========================================================= */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-width: 0;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: background-color 140ms ease, border-color 140ms ease;
    }
    .card-header {
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg {
      color: var(--muted-foreground);
    }
    .card-description {
      margin: 4px 0 0;
      font-size: 12.5px;
      color: var(--muted-foreground);
      line-height: 1.5;
    }
    .card-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Form Fields & Rows */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .label {
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground);
    }
    .hint {
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .input, .textarea {
      width: 100%;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--foreground);
      outline: none;
      transition: all 140ms ease;
    }
    .input:focus, .textarea:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 25%, transparent);
    }
    .textarea {
      min-height: 80px;
      resize: vertical;
    }

    /* Avatar Row */
    .avatar-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar-circle {
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--secondary);
      color: var(--secondary-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* Info Table Rows */
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid color-mix(in oklab, var(--border) 50%, transparent);
    }
    .info-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .info-label {
      font-size: 13px;
      color: var(--muted-foreground);
    }
    .info-val {
      font-size: 13px;
      font-weight: 500;
      text-align: right;
    }

    /* Buttons & Badges */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      transition: all 140ms ease;
    }
    .btn-primary {
      background: var(--primary);
      color: var(--primary-foreground);
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline {
      background: var(--background);
      border-color: var(--border);
      color: var(--foreground);
    }
    .btn-outline:hover { background: var(--accent); }
    .btn-destructive {
      background: color-mix(in oklab, var(--destructive) 15%, transparent);
      border-color: color-mix(in oklab, var(--destructive) 40%, transparent);
      color: var(--destructive);
    }
    .btn-destructive:hover {
      background: var(--destructive);
      color: var(--destructive-foreground);
    }
    .btn-sm {
      height: 28px;
      padding: 0 10px;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-success { background: var(--success); color: var(--success-foreground); border: 1px solid transparent; }
    .badge-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
    }
    .badge-destructive {
      background: color-mix(in oklab, var(--destructive) 20%, transparent);
      color: var(--destructive);
      border: 1px solid color-mix(in oklab, var(--destructive) 30%, transparent);
    }

    /* Grid for Surface and Mode Options */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 12px;
    }
    .theme-option {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--background);
      cursor: pointer;
      text-align: left;
      transition: all 140ms ease;
    }
    .theme-option:hover {
      border-color: var(--ring);
    }
    .theme-option.selected {
      border-color: var(--primary);
      background: color-mix(in oklab, var(--primary) 8%, var(--card));
    }
    .theme-swatch {
      height: 36px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .theme-swatch.paper { background: #1e1c18; color: #d6d0c2; }
    .theme-swatch.paper.light-preview { background: #f5f3eb; color: #3a3832; }
    .theme-swatch.slate { background: #151922; color: #cbd5e1; }
    .theme-swatch.soft { background: #232028; color: #ddd6fe; }
    .theme-swatch.mono { background: #09090b; color: #ffffff; }

    .brand-swatch {
      height: 28px;
      border-radius: 50px; /* Pill shape for brands */
      margin: 4px auto 8px auto;
      width: 48px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
    }

    /* Provider Grid */
    .provider-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--background);
    }
    .provider-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .provider-icon {
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    /* Skeleton Loading State */
    @keyframes sgPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    .sk {
      height: 20px;
      background: var(--muted-foreground);
      opacity: 0.2;
      border-radius: var(--radius-sm);
      animation: sgPulse 1.4s ease infinite;
    }
    .sk-h40 { height: 40px; }
    .sk-h80 { height: 80px; }

    /* Error Banner */
    .error-banner {
      padding: 16px;
      border-radius: var(--radius-lg);
      background: color-mix(in oklab, var(--destructive) 12%, var(--card));

      gap: 12px;

    }
    .error-banner svg {

    }

    /* Danger Zone */
    .danger-card {

      .layout-sidebar, .layout-continuous {
        grid-template-columns: 1fr;
      }
      .settings-nav, .toc-sticky {

      }
    }

  <!-- ERROR TEMPLATE -->
  <template id="tpl-error">
    <div class="error-banner">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <div>
        <div style="font-weight: 600; font-size: 14px;">Failed to load workspace settings</div>
        <p style="margin: 4px 0 10px; font-size: 12.5px; color: var(--muted-foreground);">
          Could not establish connection to the settings route handler. The local daemon or cloud API timed out.
        </p>
        <button class="btn btn-outline btn-sm" onclick="switchState('populated')">Retry Connection</button>
      </div>
    </div>
  </template>

  <script>
    let currentLayout = 'sidebar';
    let currentState = 'populated';
    let activeCategory = 'profile';
    let currentSurface = 'paper';
    let currentBrand = 'amber';
    let currentMode = 'dark';

    function init() {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (currentMode === 'system') applyTheme();
      });
      applyTheme();
      renderContent();
    }

    function switchLayout(mode) {
      currentLayout = mode;
      document.querySelectorAll('.devbar button[id^="btn-layout-"]').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-layout-' + mode).classList.add('active');

      document.getElementById('container-sidebar').style.display = mode === 'sidebar' ? 'grid' : 'none';
      document.getElementById('container-tabs').style.display = mode === 'tabs' ? 'block' : 'none';
      document.getElementById('container-continuous').style.display = mode === 'continuous' ? 'grid' : 'none';

      renderContent();
    }

    function switchState(state) {
      currentState = state;
      document.querySelectorAll('.devbar button[id^="btn-state-"]').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-state-' + state).classList.add('active');
      renderContent();
    }

    function setSurface(surface) {
      currentSurface = surface;
      document.querySelectorAll('.devbar button[id^="btn-surf-"]').forEach(b => b.classList.remove('active'));
      const activeDevBtn = document.getElementById('btn-surf-' + surface);
      if (activeDevBtn) activeDevBtn.classList.add('active');

      // Update card UI options
      document.querySelectorAll('.theme-option[id^="opt-surf-"]').forEach(o => o.classList.remove('selected'));
      const activeOpt = document.getElementById('opt-surf-' + surface);
      if (activeOpt) activeOpt.classList.add('selected');

      applyTheme();
    }

    function setBrand(brand) {
      currentBrand = brand;
      document.querySelectorAll('.theme-option[id^="opt-brand-"]').forEach(o => o.classList.remove('selected'));
      const activeOpt = document.getElementById('opt-brand-' + brand);
      if (activeOpt) activeOpt.classList.add('selected');
      applyTheme();
    }

    function setMode(mode) {
      currentMode = mode;
      
      // Update devbar
      document.querySelectorAll('.devbar button[id^="btn-mode-"]').forEach(b => b.classList.remove('active'));
      const activeDevBtn = document.getElementById('btn-mode-' + mode);
      if (activeDevBtn) activeDevBtn.classList.add('active');

      // Update card UI
      document.querySelectorAll('button[id^="card-mode-"]').forEach(b => b.classList.remove('active'));
      const activeCardBtn = document.getElementById('card-mode-' + mode);
      if (activeCardBtn) activeCardBtn.classList.add('active');

      applyTheme();
    }

    function applyTheme() {
      const html = document.documentElement;
      html.setAttribute('data-surface', currentSurface);
      html.setAttribute('data-brand', currentBrand);
      
      let effectiveMode = currentMode;
      if (effectiveMode === 'system') {
        effectiveMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      if (effectiveMode === 'dark') {
        html.classList.add('dark');
        html.classList.remove('light');
      } else {
        html.classList.add('light');
        html.classList.remove('dark');
      }
    }

    function renderContent() {
      const mainSidebar = document.getElementById('main-cards');
      const mainTabs = document.getElementById('tabs-cards');
      const mainContinuous = document.getElementById('continuous-cards');

      [mainSidebar, mainTabs, mainContinuous].forEach(el => el.innerHTML = '');

      if (currentState === 'loading') {
        const skel = document.getElementById('tpl-skeleton').content.cloneNode(true);
        getActiveTarget().appendChild(skel);
        return;
      }

      if (currentState === 'error') {
        const err = document.getElementById('tpl-error').content.cloneNode(true);
        getActiveTarget().appendChild(err);
        return;
      }

      // Populated State
      const tpl = document.getElementById('tpl-cards');
      const cards = Array.from(tpl.content.querySelectorAll('.card'));

      if (currentLayout === 'sidebar') {
        cards.forEach(card => {
          if (card.dataset.category === activeCategory) {
            mainSidebar.appendChild(card.cloneNode(true));
          }
        });
      } else if (currentLayout === 'tabs') {
        cards.forEach(card => {
          if (card.dataset.category === activeCategory) {
            mainTabs.appendChild(card.cloneNode(true));
          }
        });
      } else if (currentLayout === 'continuous') {
        cards.forEach(card => {
          mainContinuous.appendChild(card.cloneNode(true));
        });
      }

      // Re-sync UI state on cards
      const activeOpt = document.getElementById('opt-surf-' + currentSurface);
      if (activeOpt) activeOpt.classList.add('selected');
    }

    function getActiveTarget() {
      if (currentLayout === 'sidebar') return document.getElementById('main-cards');
      if (currentLayout === 'tabs') return document.getElementById('tabs-cards');
      return document.getElementById('continuous-cards');
    }

    function selectCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    }

    function selectTab(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderContent();
    }

    function filterCards(query) {
      const q = query.trim().toLowerCase();
      if (!q) {
        renderContent();
        return;
      }
      const target = getActiveTarget();
      target.innerHTML = '';
      const tpl = document.getElementById('tpl-cards');
      const cards = Array.from(tpl.content.querySelectorAll('.card'));
      let matches = 0;
      cards.forEach(card => {
        const text = (card.dataset.keywords + ' ' + card.innerText).toLowerCase();
        if (text.includes(q)) {
          target.appendChild(card.cloneNode(true));
          matches++;
        }
      });
      if (matches === 0) {
        target.innerHTML = '<div class="card" style="text-align:center; padding: 40px; color: var(--muted-foreground);">No settings matching "' + query + '" found.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
