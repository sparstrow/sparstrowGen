<!doctype html>
<!-- No data-theme on this root: it would imply the chrome follows the card
     theme control, which it deliberately does not. See the palette block. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparstrowgen Design System</title>
<style>
  /* The viewer chrome is deliberately independent of the system's own tokens.
     Cards render inside iframes, so a system whose tokens are mid-edit (or
     broken) still leaves the surrounding page navigable. */
  /* CHROME PALETTE — deliberately neutral, and deliberately NOT bound to the
     theme control.

     Two rules govern this block, and both exist for the same reason: the
     viewer frames work whose colour is the thing being judged.

     1. NEUTRAL, always. Every value below is achromatic — equal R, G, and B.
        A chrome with an accent hue tints the perception of every swatch beside
        it, which is why image editors use grey canvases and galleries use grey
        walls. This viewer previously used a terracotta accent (#c8794a); it
        looked considered and it was quietly biasing every colour review done
        in it.
     2. DECOUPLED from the card theme. `--vw-*` never keys off [data-theme],
        because [data-theme] now means "what the CARDS are showing". The chrome
        follows the operating system once, at load, and then holds still.
        A frame that repaints every time you compare light against dark gives
        the eye nothing fixed to measure against. */
  :root {
    --vw-bg: #171717; --vw-panel: #202020; --vw-rail: #121212;
    --vw-fg: #f2f2f2; --vw-muted: #8c8c8c; --vw-border: #2e2e2e;
    /* The canvas a card sits on. Lifted off --vw-bg so a dark card has an edge
       and a light card is not floating in a void. */
    --vw-canvas: #0e0e0e;
    --vw-radius: 10px;
    --vw-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --vw-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --vw-bg: #f2f2f2; --vw-panel: #fafafa; --vw-rail: #e9e9e9;
      --vw-fg: #1c1c1c; --vw-muted: #6a6a6a; --vw-border: #dcdcdc;
      --vw-canvas: #e4e4e4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--vw-bg); color: var(--vw-fg);
    font-family: var(--vw-font); font-size: 13px; line-height: 1.5;
    display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden;
  }
  /* ── rail ── */
  nav {
    background: var(--vw-rail); border-right: 1px solid var(--vw-border);
    overflow-y: auto; padding: 12px 0 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px 14px;
    font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
  }
  /* A neutral mark. The previous version was a filled accent-coloured square —
     a placeholder logo every system generated by this skill wore identically,
     which is the definition of a template tell. */
  .brand .dot { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--vw-muted); }
  .filter {
    margin: 0 12px 12px; width: calc(100% - 24px); padding: 6px 9px;
    background: transparent; border: 1px solid var(--vw-border); border-radius: 8px;
    color: var(--vw-fg); font: inherit; font-size: 12px;
  }
  .filter:focus-visible { outline: 2px solid var(--vw-fg); outline-offset: 1px; border-color: var(--vw-fg); }
  .nav-group { margin-top: 6px; }
  .nav-group > .nav-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 6px 16px; background: none; border: 0; cursor: pointer;
    color: var(--vw-fg); font: inherit; font-size: 12px; font-weight: 600; text-align: left;
  }
  .nav-head .chev { transition: transform .14s ease; opacity: .6; }
  .nav-group[data-collapsed="true"] .chev { transform: rotate(-90deg); }
  .nav-group[data-collapsed="true"] .nav-items { display: none; }
  .nav-items a {
    display: block; padding: 4px 16px 4px 28px; color: var(--vw-muted);
    text-decoration: none; font-size: 12px; border-left: 2px solid transparent;
  }
  .nav-items a:hover { color: var(--vw-fg); background: color-mix(in oklab, var(--vw-fg) 5%, transparent); }
  .nav-items a.active { color: var(--vw-fg); border-left-color: var(--vw-fg); font-weight: 600; }
  /* ── main ── */
  main { overflow-y: auto; scroll-behavior: smooth; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; padding: 10px 24px;
    background: color-mix(in oklab, var(--vw-bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--vw-border);
  }
  .topbar .meta { color: var(--vw-muted); font-size: 11.5px; font-family: var(--vw-mono); }
  .btn {
    padding: 5px 10px; background: transparent; border: 1px solid var(--vw-border);
    border-radius: 8px; color: var(--vw-fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: color-mix(in oklab, var(--vw-fg) 6%, transparent); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 24px 120px; }
  .section-label {
    margin: 34px 0 12px; color: var(--vw-muted); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .card-block { margin-bottom: 26px; scroll-margin-top: 60px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .card-desc { color: var(--vw-muted); font-size: 12px; margin-top: 1px; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .frame-shell {
    border: 1px solid var(--vw-border); border-radius: var(--vw-radius);
    overflow: hidden; background: var(--vw-canvas);
  }
  iframe { display: block; width: 100%; border: 0; background: transparent; }
  details.notes { margin-top: 8px; }
  details.notes > summary {
    cursor: pointer; color: var(--vw-muted); font-size: 12px; padding: 4px 0;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details.notes > summary::-webkit-details-marker { display: none; }
  details.notes > summary::before { content: "›"; transition: transform .14s ease; display: inline-block; }
  details.notes[open] > summary::before { transform: rotate(90deg); }
  details.notes > summary:hover { color: var(--vw-fg); }
  .notes-body {
    padding: 4px 2px 8px; font-size: 12.5px;
    border-left: 2px solid var(--vw-border); padding-left: 14px; margin-top: 6px;
  }
  .notes-body h1, .notes-body h2, .notes-body h3, .notes-body h4 { margin: 14px 0 6px; font-size: 13px; }
  .notes-body h1 { font-size: 14px; }
  .notes-body p { margin: 6px 0; }
  .notes-body ul, .notes-body ol { margin: 6px 0; padding-left: 20px; }
  .notes-body li { margin: 2px 0; }
  .notes-body code { font-family: var(--vw-mono); font-size: 11.5px;
    background: color-mix(in oklab, var(--vw-fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
  .notes-body pre.code {
    background: var(--vw-rail); border: 1px solid var(--vw-border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .notes-body pre.code code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
  .notes-body table { border-collapse: collapse; margin: 8px 0; font-size: 12px; width: 100%; }
  .notes-body th, .notes-body td { border: 1px solid var(--vw-border); padding: 5px 9px; text-align: left; }
  .notes-body th { background: var(--vw-rail); font-weight: 600; }
  .notes-body blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--vw-border); color: var(--vw-muted); }
  .readme { padding-bottom: 10px; border-bottom: 1px solid var(--vw-border); }
  .readme > h1:first-child { margin-top: 0; font-size: 22px; letter-spacing: -0.02em; }
  .empty { color: var(--vw-muted); padding: 40px 0; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    nav { display: none; }
  }
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="dot"></span><span>Sparstrowgen</span></div>
  <input class="filter" id="filter" type="search" placeholder="Filter…" aria-label="Filter cards">
  <div id="nav-tree"></div>
</nav>
<main>
  <div class="topbar">
    <div class="meta" id="meta"></div>
    <div class="card-actions">
      <button class="btn" id="expand-all">Expand notes</button>
      <button class="btn" id="theme" title="Switches the cards only. The viewer chrome stays neutral so it does not bias what you are reviewing.">Cards: Light</button>
    </div>
  </div>
  <div class="wrap">
    <div class="readme" id="readme"></div>
    <div id="cards"></div>
    <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
  </div>
</main>

<script type="application/json" id="payload">{"name":"Sparstrowgen","mode":"mirror","theme":{"default":"dark","toggleAttr":"data-theme"},"generatedAt":"2026-09-01T03:43:26.805Z","readme":"\u003ch1>Sparstrowgen Design System\u003c/h1>\n\u003cblockquote>⚠️ \u003cstrong>Partly built against a doctrine that has since been deleted.\u003c/strong> The old \u003ccode>DESIGN.md\u003c/code> was generic tool output nobody chose; it was removed 2026-08-17 (see \u003ca href=\"DECISIONS.md\">\u003ccode>DECISIONS.md\u003c/code>\u003c/a> DD-001). The \u003cstrong>colour and radius tokens below are still valid\u003c/strong> — they are mirrored from the app's real stylesheet. The \u003cstrong>type and spacing scales, and the guideline cards' prose, are not\u003c/strong> — they were derived from the retired doctrine. Do not treat this system as settled design guidance until \u003ccode>design-brief\u003c/code> produces the new doctrine and this is rebuilt against it.\u003c/blockquote>\n\u003cp>\u003cstrong>Product:\u003c/strong> Sparstrowgen — an autonomous AI agent platform and developer control plane. Multi-node agent runtimes, task pipelines, GOAP goal planning, and RAG memory.\u003c/p>\n\u003cp>\u003cstrong>Mode: \u003ccode>mirror\u003c/code>.\u003c/strong> The app's real code is the source of truth and this system documents it. Every component card here depicts a component that already exists in \u003ccode>@sparstrow/ui\u003c/code>; nothing is authored here to be built later. When the real code changes, \u003ccode>check\u003c/code> says so.\u003c/p>\n\u003ch2>How to consume this\u003c/h2>\n\u003col>\n\u003cli>Link \u003ccode>styles.css\u003c/code> in your \u003ccode>&lt;head&gt;\u003c/code> — it \u003ccode>@import\u003c/code>s the three token files.\u003c/li>\n\u003cli>Dark mode is a \u003cstrong>\u003ccode>.dark\u003c/code> class on the root element\u003c/strong>, not a media query. \u003ccode>:root\u003c/code> is the light theme. The app runs dark. (Cards here also accept \u003ccode>[data-theme=&quot;dark&quot;]\u003c/code> so the viewer's toggle reaches them.)\u003c/li>\n\u003cli>Use \u003ccode>var(--token)\u003c/code> for every colour, radius, and spacing value. A hex literal in application code is a bug — it will not follow the theme.\u003c/li>\n\u003cli>In the app itself, import components from \u003ccode>@sparstrow/ui\u003c/code>. Never copy a card's HTML into production; the cards are depictions built for this page.\u003c/li>\n\u003c/ol>\n\u003ch2>Sources\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>What\u003c/th>\u003cth>Where\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Colour + radius tokens\u003c/td>\u003ctd>\u003ccode>packages/ui/src/styles/globals.css\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Components\u003c/td>\u003ctd>\u003ccode>packages/ui/src/components/ui/\u003c/code> (26 primitives)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Written design intent\u003c/td>\u003ctd>\u003cstrong>none — the doctrine was deleted, see \u003ccode>DECISIONS.md\u003c/code> DD-001\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Product/stack facts\u003c/td>\u003ctd>\u003ccode>.sparstrowgen/blueprint.yaml\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>Type and spacing tokens are the one exception to &quot;pure mirror&quot;: they were transcribed from the retired doctrine's prose, which had no CSS counterpart in the app (it uses Tailwind size classes instead). \u003cstrong>They therefore carry no authority now\u003c/strong> — they are the old direction expressed as variables. Treat them as placeholders until the new doctrine replaces them.\u003c/p>\n\u003ch2>Product context\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Area\u003c/th>\u003cth>Key surfaces\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Dashboard\u003c/td>\u003ctd>Run activity, machine health\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Agents\u003c/td>\u003ctd>Agent registry, creator, SKILL.md viewer, teams\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Runs\u003c/td>\u003ctd>Run list, run detail, live transcripts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Machines\u003c/td>\u003ctd>Pairing, status, runtime config\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Memory\u003c/td>\u003ctd>Notes, semantic search\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Projects\u003c/td>\u003ctd>Project registry, directives\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Knowledge Center\u003c/td>\u003ctd>User-facing product docs\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>Two databases sit behind these: a Postgres/Supabase cloud control plane (identity, machines, board, runs) and per-machine local SQLite for execution and the memory index. That split shapes the UI more than it looks — anything showing memory search results is reading a \u003cem>local\u003c/em> index over the network boundary, so loading and unreachable states are first-class, not edge cases.\u003c/p>\n\u003ch2>Content fundamentals\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Tone\u003c/strong> — direct, technical, no filler. The reader is an engineer watching agents run.\u003c/li>\n\u003cli>\u003cstrong>Casing\u003c/strong> — sentence case on UI labels (\u003ccode>New agent\u003c/code>, \u003ccode>Open run\u003c/code>), title case on module names (\u003ccode>Machines\u003c/code>, \u003ccode>Memory\u003c/code>), UPPERCASE for section headers in rails and table columns.\u003c/li>\n\u003cli>\u003cstrong>Numbers\u003c/strong> — \u003ccode>tabular-nums\u003c/code> anywhere figures are compared down a column.\u003c/li>\n\u003cli>\u003cstrong>IDs\u003c/strong> — monospace, prefixed: \u003ccode>rt_9f2c1a\u003c/code>, \u003ccode>run_04b8\u003c/code>, \u003ccode>agt_…\u003c/code>. Never reformat or truncate an ID without a copy affordance.\u003c/li>\n\u003cli>\u003cstrong>Durations\u003c/strong> — \u003ccode>2m 14s\u003c/code>, not \u003ccode>134s\u003c/code>. \u003cstrong>Timestamps\u003c/strong> — relative under an hour (\u003ccode>40s ago\u003c/code>), absolute beyond (\u003ccode>2026-08-17 14:02\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>No emoji.\u003c/strong> Status is colour + text, never a pictogram.\u003c/li>\n\u003cli>\u003cstrong>Counts\u003c/strong> — a badge beside the page title (\u003ccode>Machines 12\u003c/code>), not \u003ccode>12 machines found\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Visual foundations\u003c/h2>\n\u003cp>Full detail in the cards below; this is the greppable summary.\u003c/p>\n\u003cp>\u003cstrong>Colour.\u003c/strong> Two themes, \u003ccode>.dark\u003c/code> class-toggled, light is \u003ccode>:root\u003c/code>. Everything is OKLCH at chroma 0 except four semantic statuses and destructive. Primary \u003cstrong>inverts\u003c/strong> between themes — near-black in light, near-white in dark — so a primary button is the lightest thing on a dark screen. Accent covers ≤10% of any screen (the One Accent Rule); status is where that budget goes.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Semantic\u003c/th>\u003cth>Hue\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>success\u003c/code>\u003c/td>\u003ctd>155\u003c/td>\u003ctd>Completed, active, done\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\u003ctd>250\u003c/td>\u003ctd>Running, syncing, dispatched\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>warning\u003c/code>\u003c/td>\u003ctd>70–80\u003c/td>\u003ctd>Queued too long, unreachable, nearing a limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>22–27\u003c/td>\u003ctd>Failed, blocked, expired\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Type.\u003c/strong> Inter Variable for UI, monospace for IDs and figures. Six steps: 18/700 page title · 15/600 section · 14/400 body (capped 65–75ch) · 12/400 meta · 11/600 uppercase labels · mono 12 for codes. Hierarchy is scale and weight only — never colour, never accent stripes.\u003c/p>\n\u003cp>\u003cstrong>Spacing.\u003c/strong> 4px grid. Card padding 20px, section padding 24px.\u003c/p>\n\u003cp>\u003cstrong>Radius.\u003c/strong> All derived from \u003ccode>--radius: 0.625rem\u003c/code>: 6 chips · 8 inputs/buttons · 10 cards/panels · 14 modals · 999 pills.\u003c/p>\n\u003cp>\u003cstrong>Elevation.\u003c/strong> Flat by default. One shadow (\u003ccode>--shadow-popover\u003c/code>), only for genuinely floating layers — dropdowns, popovers, command palettes. A shadowed card is a defect.\u003c/p>\n\u003cp>\u003cstrong>Motion.\u003c/strong> 140ms \u003ccode>ease\u003c/code> for interaction, 150–200ms for entrance. No spring, no bounce. \u003ccode>prefers-reduced-motion\u003c/code> honoured everywhere.\u003c/p>\n\u003cp>\u003cstrong>Never:\u003c/strong> hardcoded Tailwind colours (\u003ccode>bg-slate-950\u003c/code>), gradient text, \u003ccode>backdrop-blur\u003c/code> glassmorphism, coloured left-border stripes, the hero-metric template for ordinary stats, or a custom primitive where \u003ccode>@sparstrow/ui\u003c/code> has one.\u003c/p>\n\u003ch2>Maintaining this\u003c/h2>\n\u003cpre class=\"code\" data-lang=\"bash\">\u003ccode># after changing globals.css or a component\nnode .claude/skills/design-system/scripts/ds.mjs check --root design-system\n\n# after updating the affected cards and usage notes to match\nnode .claude/skills/design-system/scripts/ds.mjs sync  --root design-system\n\n# regenerate index.html\nnode .claude/skills/design-system/scripts/ds.mjs build --root design-system\n\n# view it (open index.html directly, or serve so prototypes can load lib/ data)\nnode .claude/skills/design-system/scripts/ds.mjs serve --root design-system --port 4321\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>check\u003c/code> exits 1 on drift, so it drops straight into CI. Run \u003ccode>sync\u003c/code> only \u003cem>after\u003c/em> the cards are actually updated — running it first converts a real warning into silence.\u003c/p>\n\u003ch2>File index\u003c/h2>\n\u003cpre class=\"code\">\u003ccode>design-system/\n├── index.html                  GENERATED — do not hand-edit\n├── system.json                 manifest: mode, sources, token + component fingerprints\n├── README.md                   this file\n├── CHANGELOG.md                newest first\n├── styles.css                  @import entry point\n├── tokens/\n│   ├── colors.css              mirrored from globals.css, both themes\n│   ├── typography.css          retired doctrine's scale — placeholder, not live\n│   └── spacing.css             radius mirrored; spacing/shadow from retired doctrine\n├── guidelines/\n│   ├── surfaces.card.html      surface stack + text hierarchy\n│   ├── status-colors.card.html four semantic statuses\n│   ├── type-scale.card.html    six type steps\n│   ├── radius.card.html        five derived radius steps\n│   ├── elevation.card.html     flat-by-default, the one shadow\n│   └── motion.card.html        transitions + keyframes, replayable\n├── components/\n│   ├── buttons/                Button — 6 variants, 4 sizes\n│   ├── badges/                 Badge — 7 variants, semantic mapping\n│   ├── forms/                  Input — field assembly and states\n│   └── surfaces/               Card — the flat surface\n├── designs/                    prototypes (.dc.html) + preview cards\n└── lib/                        shared seed data for prototypes\u003c/code>\u003c/pre>\n\u003ch2>Coverage\u003c/h2>\n\u003cp>4 of 26 primitives are carded so far — the four that carry the most design decisions. The rest exist in \u003ccode>@sparstrow/ui\u003c/code> and are not yet documented here; absence from this page means undocumented, \u003cstrong>not\u003c/strong> unavailable. Add one with:\u003c/p>\n\u003cpre class=\"code\" data-lang=\"bash\">\u003ccode>node .claude/skills/design-system/scripts/ds.mjs add --root design-system \\\n  --kind component --name Dialog --group overlays \\\n  --source packages/ui/src/components/ui/dialog.tsx\u003c/code>\u003c/pre>\n\u003cp>Registering with \u003ccode>--source\u003c/code> is what puts it under drift detection; a card added without it is invisible to \u003ccode>check\u003c/code>, and \u003ccode>check\u003c/code> will tell you so.\u003c/p>","sections":[{"section":"Foundations","group":"Foundations","cards":[{"id":"elevation-card-html","name":"Elevation","description":"Flat by default — one shadow, reserved for genuinely floating layers","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Elevation\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Flat by default — one shadow, reserved for genuinely floating layers\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}\r\n  .box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;font-size:13px}\r\n  .note{font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .mono{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Flat\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"box\" style=\"background:var(--card)\">Card &mdash; no shadow\u003c/div>\r\n  \u003cdiv class=\"mono\">cards, panels, tables, drawers: 1px border only\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Floating\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"box\" style=\"background:var(--popover);box-shadow:var(--shadow-popover)\">Dropdown &mdash; --shadow-popover\u003c/div>\r\n  \u003cdiv class=\"mono\">0 1px 2px rgb(0 0 0 / .05)\u003cbr>the only shadow in the system\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Stack\u003c/div>\r\n  \u003cdiv style=\"background:var(--background);padding:var(--space-4);border-radius:var(--radius-lg);width:100%\">\r\n    \u003cdiv class=\"box\" style=\"background:var(--card);max-width:340px\">\r\n      \u003cdiv style=\"font-weight:600;margin-bottom:4px\">Depth without shadow\u003c/div>\r\n      \u003cdiv style=\"color:var(--muted-foreground);font-size:12.5px;line-height:1.5\">\r\n        The card sits one lightness step above the page. That step plus the 1px line is the\r\n        entire elevation vocabulary.\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Rule\u003c/div>\u003cdiv class=\"note\">\r\n  A shadow appears only when an element genuinely floats above the page &mdash; dropdown,\r\n  popover, command palette. If a card, panel, or table has a drop shadow, that is a defect,\r\n  not a style preference. No glow, no glassmorphism blur.\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\elevation.card.html","live":null},{"id":"motion-card-html","name":"Motion","description":"140ms ease throughout — no spring, no bounce, reduced-motion honoured","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Motion\u003c/title>\r\n\u003cmeta name=\"description\" content=\"140ms ease throughout — no spring, no bounce, reduced-motion honoured\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .mono{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n  .demo{padding:10px 14px;border-radius:var(--radius-md);background:var(--secondary);\r\n        color:var(--secondary-foreground);font-size:13px;cursor:pointer;user-select:none;\r\n        transition:background-color var(--transition-base),transform var(--transition-base),\r\n                   box-shadow var(--transition-base)}\r\n  .demo:hover{background:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-popover)}\r\n  @keyframes sgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\r\n  @keyframes sgPop{from{opacity:0;transform:scale(.97) translateY(5px)}to{opacity:1;transform:none}}\r\n  .replay{animation:sgFade 200ms ease}\r\n  .replay.pop{animation:sgPop 150ms ease}\r\n  @media (prefers-reduced-motion:reduce){\r\n    .demo{transition:none} .demo:hover{transform:none} .replay{animation:none}\r\n  }\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Hover\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"demo\">Hover me\u003c/div>\r\n  \u003cdiv class=\"mono\">background + 1px lift\u003cbr>--transition-base &middot; 140ms ease\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Entrance\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"demo replay\" onclick=\"this.classList.remove('replay');void this.offsetWidth;this.classList.add('replay')\">Click to replay &mdash; sgFade\u003c/div>\r\n  \u003cdiv class=\"mono\">opacity 0&rarr;1 + translateY(6px)&rarr;0 &middot; 200ms\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Pop\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"demo replay pop\" onclick=\"this.classList.remove('replay');void this.offsetWidth;this.classList.add('replay')\">Click to replay &mdash; sgPop\u003c/div>\r\n  \u003cdiv class=\"mono\">scale(.97)&rarr;1 + translateY(5px)&rarr;0 &middot; 150ms\u003cbr>dropdowns, popovers\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Rule\u003c/div>\u003cdiv class=\"note\">\r\n  150&ndash;200ms, \u003cstrong>ease\u003c/strong>, throughout. No spring, no bounce &mdash; this is a control\r\n  plane, and motion that draws attention to itself competes with the run telemetry and diffs it\r\n  is supposed to be framing. Every transition honours\r\n  \u003ccode style=\"font-family:var(--font-mono);font-size:11px\">prefers-reduced-motion\u003c/code>;\r\n  that is a correctness requirement, not a nicety.\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\motion.card.html","live":null},{"id":"radius-card-html","name":"Radius","description":"Five steps, all derived from a single --radius base of 10px","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Radius\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Five steps, all derived from a single --radius base of 10px\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-4);align-items:flex-start}\r\n  .item{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:10.5px;\r\n        color:var(--muted-foreground);font-family:var(--font-mono)}\r\n  .bx{width:64px;height:64px;background:var(--muted);border:1px solid var(--border)}\r\n  .note{font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  code{font-family:var(--font-mono);font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Scale\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-sm)\">\u003c/div>\u003cdiv>6px &middot; sm\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-md)\">\u003c/div>\u003cdiv>8px &middot; md\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-lg)\">\u003c/div>\u003cdiv>10px &middot; lg\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-xl)\">\u003c/div>\u003cdiv>14px &middot; xl\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-full)\">\u003c/div>\u003cdiv>999px &middot; full\u003c/div>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Applied\u003c/div>\u003cdiv class=\"note\">\r\n  \u003cstrong>sm\u003c/strong> badges, chips &nbsp;&middot;&nbsp; \u003cstrong>md\u003c/strong> inputs, buttons\r\n  &nbsp;&middot;&nbsp; \u003cstrong>lg\u003c/strong> cards, panels &nbsp;&middot;&nbsp;\r\n  \u003cstrong>xl\u003c/strong> modals &nbsp;&middot;&nbsp; \u003cstrong>full\u003c/strong> pills, avatars\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Derived\u003c/div>\u003cdiv class=\"note\">\r\n  All five come from \u003ccode>--radius: 0.625rem\u003c/code> in globals.css via\r\n  \u003ccode>calc()\u003c/code> &mdash; they are not independently chosen. Changing that one base moves the\r\n  whole scale together, which is the intended behaviour and the reason not to hardcode a\r\n  pixel radius anywhere. Mismatched corners show faster than almost any other inconsistency,\r\n  because the elements sit adjacent.\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\radius.card.html","live":null},{"id":"status-colors-card-html","name":"Status Colors","description":"Four semantic statuses plus destructive — the only chromatic colours in the system","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Status Colors\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Four semantic statuses plus destructive — the only chromatic colours in the system\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .note{font-size:12px;color:var(--muted-foreground);line-height:1.55}\r\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);width:100%}\r\n  .sw{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .chip{padding:14px;font-size:12px;font-weight:600}\r\n  .meta{padding:8px 10px}\r\n  .name{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px}\r\n  .val{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);margin-top:2px}\r\n  code{font-family:var(--font-mono);font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Semantic\u003c/div>\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"sw\">\r\n    \u003cdiv class=\"chip\" style=\"background:var(--success);color:var(--success-foreground)\">Completed\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\" style=\"color:var(--success-foreground)\">OK / success\u003c/div>\r\n      \u003cdiv class=\"val\">--success &middot; hue 155\u003c/div>\u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"sw\">\r\n    \u003cdiv class=\"chip\" style=\"background:var(--info);color:var(--info-foreground)\">Running\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\" style=\"color:var(--info-foreground)\">Info\u003c/div>\r\n      \u003cdiv class=\"val\">--info &middot; hue 250\u003c/div>\u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"sw\">\r\n    \u003cdiv class=\"chip\" style=\"background:var(--warning);color:var(--warning-foreground)\">Queued\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\" style=\"color:var(--warning-foreground)\">Warning\u003c/div>\r\n      \u003cdiv class=\"val\">--warning &middot; hue 70&ndash;80\u003c/div>\u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"sw\">\r\n    \u003cdiv class=\"chip\" style=\"background:var(--destructive);color:var(--destructive-foreground)\">Failed\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\" style=\"color:var(--destructive)\">Danger\u003c/div>\r\n      \u003cdiv class=\"val\">--destructive &middot; hue 22&ndash;27\u003c/div>\u003c/div>\r\n  \u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Rule\u003c/div>\u003cdiv class=\"note\">\r\n  Chroma is held near-constant across the four so no status shouts louder than another by\r\n  accident; only hue varies. Every other colour in the system is chroma 0 &mdash; a consequence\r\n  of the retired doctrine&rsquo;s accent budget, not a rule anyone still defends. The owner has\r\n  asked for status to read more strongly; see DECISIONS.md DD-002.\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Pairing\u003c/div>\u003cdiv class=\"note\">\r\n  Each status is a \u003ccode>--x\u003c/code> / \u003ccode>--x-foreground\u003c/code> pair. Both flip between themes:\r\n  in light the surface is pale and the text saturated; in dark that inverts. Never pair a status\r\n  background with \u003ccode>--foreground\u003c/code> &mdash; contrast fails in one theme or the other.\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\status-colors.card.html","live":null},{"id":"surfaces-card-html","name":"Surfaces","description":"Surface stack — background, card, muted, sidebar, border","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Surfaces\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Surface stack — background, card, muted, sidebar, border\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground)}\r\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-3);width:100%}\r\n  .sw{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .sw .chip{height:56px}\r\n  .sw .meta{padding:8px 10px;font-size:11px;line-height:1.45}\r\n  .sw .name{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px;color:var(--muted-foreground)}\r\n  .sw .val{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Stack\u003c/div>\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--background)\">\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Background\u003c/div>\u003cdiv class=\"val\">--background\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--card)\">\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Card / Popover\u003c/div>\u003cdiv class=\"val\">--card\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--muted)\">\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Muted / Accent\u003c/div>\u003cdiv class=\"val\">--muted\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--sidebar)\">\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Sidebar\u003c/div>\u003cdiv class=\"val\">--sidebar\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--border)\">\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Border\u003c/div>\u003cdiv class=\"val\">--border\u003c/div>\u003c/div>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Text\u003c/div>\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--foreground);font-weight:600\">Primary\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Foreground\u003c/div>\u003cdiv class=\"val\">--foreground\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"sw\">\u003cdiv class=\"chip\" style=\"background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)\">Secondary\u003c/div>\r\n    \u003cdiv class=\"meta\">\u003cdiv class=\"name\">Muted\u003c/div>\u003cdiv class=\"val\">--muted-foreground\u003c/div>\u003c/div>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Note\u003c/div>\u003cdiv class=\"note\">\r\n  In dark, \u003ccode>--sidebar\u003c/code>, \u003ccode>--card\u003c/code> and \u003ccode>--popover\u003c/code> share one value.\r\n  Hierarchy there comes from the 1px border, not a lightness step. Borders in dark are\r\n  translucent white (\u003ccode>oklch(1 0 0 / 10%)\u003c/code>), so they lift with whatever sits behind them.\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\surfaces.card.html","live":null},{"id":"type-scale-card-html","name":"Type Scale","description":"Six steps — Inter Variable for UI, monospace for codes, IDs and figures","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Type Scale\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Six steps — Inter Variable for UI, monospace for codes, IDs and figures\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .t{display:grid;grid-template-columns:150px 1fr;gap:var(--space-4);align-items:baseline;\r\n     padding:11px 0;border-bottom:1px solid var(--border)}\r\n  .t:last-of-type{border-bottom:0}\r\n  .spec{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n  .note{font-size:12px;color:var(--muted-foreground);line-height:1.55;\r\n        padding-top:var(--space-4);border-top:1px solid var(--border);margin-top:var(--space-2)}\r\n  code{font-family:var(--font-mono);font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">18px / 700 / -0.02em\u003c/div>\r\n  \u003cdiv style=\"font-size:18px;font-weight:700;letter-spacing:-.02em\">Machines &mdash; workshop-desktop\u003c/div>\u003c/div>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">15px / 600 / -0.015em\u003c/div>\r\n  \u003cdiv style=\"font-size:15px;font-weight:600;letter-spacing:-.015em\">Runs &middot; Memory &middot; Agents\u003c/div>\u003c/div>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">14px / 400 / 1.5\u003c/div>\r\n  \u003cdiv style=\"font-size:14px;max-width:70ch\">Body text. Capped at 65&ndash;75ch so long run transcripts\r\n  stay readable instead of running the full width of a wide monitor.\u003c/div>\u003c/div>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">12px / 400\u003c/div>\r\n  \u003cdiv style=\"font-size:12px;color:var(--muted-foreground)\">Updated 2026-08-17 &middot; last heartbeat 40s ago\u003c/div>\u003c/div>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">11px / 600 / .05em\u003c/div>\r\n  \u003cdiv style=\"font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)\">Status &middot; Runtime &middot; Started\u003c/div>\u003c/div>\r\n\u003cdiv class=\"t\">\u003cdiv class=\"spec\">mono 12px / tabular\u003c/div>\r\n  \u003cdiv style=\"font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums\">rt_9f2c1a&nbsp;&nbsp; run_04b8&nbsp;&nbsp; 1,204&nbsp;&nbsp; 98.4%\u003c/div>\u003c/div>\r\n\u003cdiv class=\"note\">\r\n  Hierarchy is carried by \u003cstrong>scale and weight\u003c/strong>, not colour or decoration &mdash;\r\n  inherited from the retired doctrine (DECISIONS.md DD-001) and pending re-decision.\r\n  Anything compared down a column (durations, counts, percentages) uses\r\n  \u003ccode>font-variant-numeric: tabular-nums\u003c/code>, without which right-aligned figures sit subtly ragged.\r\n\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\type-scale.card.html","live":null}]},{"section":"Components","group":"Badges","cards":[{"id":"badges-badge-card-html","name":"Badge","description":"Badge — 7 variants including the four semantic statuses","section":"Components","group":"Badges","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/badges/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Badge\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Badge — 7 variants including the four semantic statuses\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground)}\r\n  .bdg{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-md);\r\n       border:1px solid transparent;padding:2px 8px;font-size:12px;font-weight:500;width:fit-content}\r\n  .b-default{background:var(--primary);color:var(--primary-foreground)}\r\n  .b-secondary{background:var(--secondary);color:var(--secondary-foreground)}\r\n  .b-destructive{background:var(--destructive);color:var(--destructive-foreground)}\r\n  .b-outline{color:var(--foreground);border-color:var(--border)}\r\n  .b-success{background:var(--success);color:var(--success-foreground)}\r\n  .b-info{background:var(--info);color:var(--info-foreground)}\r\n  .b-warning{background:var(--warning);color:var(--warning-foreground)}\r\n  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Base\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cspan class=\"bdg b-default\">Default\u003c/span>\r\n  \u003cspan class=\"bdg b-secondary\">Secondary\u003c/span>\r\n  \u003cspan class=\"bdg b-outline\">Outline\u003c/span>\r\n  \u003cspan class=\"bdg b-destructive\">Destructive\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Semantic\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cspan class=\"bdg b-success\">Completed\u003c/span>\r\n  \u003cspan class=\"bdg b-info\">Running\u003c/span>\r\n  \u003cspan class=\"bdg b-warning\">Queued\u003c/span>\r\n  \u003cspan class=\"bdg b-destructive\">Failed\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">With dot\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cspan class=\"bdg b-success\">\u003cspan class=\"dot\">\u003c/span>Machine active\u003c/span>\r\n  \u003cspan class=\"bdg b-warning\">\u003cspan class=\"dot\">\u003c/span>Unreachable\u003c/span>\r\n  \u003cspan class=\"bdg b-info\">\u003cspan class=\"dot\">\u003c/span>Syncing\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Count\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cspan class=\"bdg b-secondary\">12\u003c/span>\r\n  \u003cspan class=\"bdg b-secondary\">3\u003c/span>\r\n  \u003cspan class=\"bdg b-destructive\">2\u003c/span>\r\n  \u003cspan class=\"note\">counts sit next to a page title, not inside table cells\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Badge\u003c/h1>\n\u003cp>Source of truth: \u003ccode>packages/ui/src/components/ui/badge.tsx\u003c/code>\u003c/p>\n\u003cp>Status indicator used in tables, list rows, drawers, and next to page titles. Seven variants; four carry semantic meaning, and choosing between them is a product decision rather than a colour preference.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Badge } from &quot;@sparstrow/ui&quot;;\n\n&lt;Badge variant=&quot;success&quot;&gt;Completed&lt;/Badge&gt;\n&lt;Badge variant=&quot;info&quot;&gt;Running&lt;/Badge&gt;\n&lt;Badge variant=&quot;warning&quot;&gt;Queued&lt;/Badge&gt;\n&lt;Badge variant=&quot;destructive&quot;&gt;Failed&lt;/Badge&gt;\n&lt;Badge variant=&quot;outline&quot;&gt;Draft&lt;/Badge&gt;\u003c/code>\u003c/pre>\n\u003ch2>Variant → meaning\u003c/h2>\n\u003cp>Pick by what the state \u003cem>means\u003c/em>, never by what colour looks right. \u003ccode>variant=&quot;success&quot;\u003c/code> and &quot;make it green&quot; produce identical pixels and completely different maintainability.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Means\u003c/th>\u003cth>Sparstrowgen examples\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>success\u003c/code>\u003c/td>\u003ctd>Terminal good state — finished, nothing left to do\u003c/td>\u003ctd>Run completed, machine active, task done\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\u003ctd>In flight, progressing normally, no action needed\u003c/td>\u003ctd>Run running, syncing, dispatched\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>warning\u003c/code>\u003c/td>\u003ctd>Needs attention but is not yet wrong\u003c/td>\u003ctd>Queued too long, machine unreachable, nearing a limit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Actually wrong — failed or blocked\u003c/td>\u003ctd>Run failed, auth expired, migration blocked\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code>\u003c/td>\u003ctd>Neutral count or muted tag, no signal intended\u003c/td>\u003ctd>Row counts, tag chips\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>outline\u003c/code>\u003c/td>\u003ctd>Lowest emphasis — a label, not a status\u003c/td>\u003ctd>Draft, unset, category label\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>default\u003c/code>\u003c/td>\u003ctd>High-contrast emphasis, rare in this app\u003c/td>\u003ctd>Plan tier, one featured label\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>The \u003ccode>success\u003c/code>/\u003ccode>info\u003c/code>/\u003ccode>warning\u003c/code>/\u003ccode>destructive\u003c/code> set mirrors the run and task status vocabularies in \u003ccode>packages/shared/src/schemas/run.ts\u003c/code> and \u003ccode>.../task.ts\u003c/code>. Map the enum to the variant once in a shared helper rather than branching on status strings at each call site — that is where drift starts.\u003c/p>\n\u003ch2>Notes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>default\u003c/code> is not the default choice.\u003c/strong> It renders high-contrast primary-on-inverse and pulls the eye harder than any status colour; in a twenty-row table it reads as an alert. Use \u003ccode>secondary\u003c/code> or \u003ccode>outline\u003c/code> for anything neutral.\u003c/li>\n\u003cli>\u003cstrong>Never use a status variant decoratively.\u003c/strong> A green badge that does not mean &quot;succeeded&quot; teaches people to ignore green.\u003c/li>\n\u003cli>Colour alone is never the signal — every badge carries text. A dot may be added but never replaces the label. Accessibility requirement, not a style preference.\u003c/li>\n\u003cli>It renders a \u003ccode>&lt;span&gt;\u003c/code> and is not interactive. If it needs a click, wrap it or use a different control.\u003c/li>\n\u003cli>Counts belong beside a page title (\u003ccode>Machines 12\u003c/code>), not inside table cells where they compete with the row's own data.\u003c/li>\n\u003c/ul>","promptPath":"components\\badges\\badge.prompt.md","cardPath":"components\\badges\\badge.card.html","live":null}]},{"section":"Components","group":"Buttons","cards":[{"id":"buttons-button-card-html","name":"Button","description":"Button — 6 variants, 4 sizes, focus and disabled states","section":"Components","group":"Buttons","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/buttons/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Button\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Button — 6 variants, 4 sizes, focus and disabled states\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground)}\r\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;\r\n       border-radius:var(--radius-md);font-size:14px;font-weight:500;border:0;cursor:pointer;\r\n       height:36px;padding:0 16px;transition:background-color var(--transition-base),color var(--transition-base);\r\n       font-family:inherit}\r\n  .v-default{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-popover)}\r\n  .v-destructive{background:var(--destructive);color:var(--destructive-foreground);box-shadow:var(--shadow-popover)}\r\n  .v-outline{background:var(--background);color:var(--foreground);border:1px solid var(--border);box-shadow:var(--shadow-popover)}\r\n  .v-secondary{background:var(--secondary);color:var(--secondary-foreground);box-shadow:var(--shadow-popover)}\r\n  .v-ghost{background:transparent;color:var(--foreground)}\r\n  .v-link{background:transparent;color:var(--primary);text-underline-offset:4px;text-decoration:underline}\r\n  .s-sm{height:32px;padding:0 12px;font-size:12px}\r\n  .s-lg{height:40px;padding:0 32px}\r\n  .s-icon{height:36px;width:36px;padding:0}\r\n  .is-disabled{opacity:.5;pointer-events:none}\r\n  .is-focus{outline:none;box-shadow:0 0 0 2px var(--ring)}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Variants\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cbutton class=\"btn v-default\">Primary\u003c/button>\r\n  \u003cbutton class=\"btn v-secondary\">Secondary\u003c/button>\r\n  \u003cbutton class=\"btn v-outline\">Outline\u003c/button>\r\n  \u003cbutton class=\"btn v-ghost\">Ghost\u003c/button>\r\n  \u003cbutton class=\"btn v-destructive\">Destructive\u003c/button>\r\n  \u003cbutton class=\"btn v-link\">Link\u003c/button>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Sizes\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cbutton class=\"btn v-default s-sm\">Small\u003c/button>\r\n  \u003cbutton class=\"btn v-default\">Default\u003c/button>\r\n  \u003cbutton class=\"btn v-default s-lg\">Large\u003c/button>\r\n  \u003cbutton class=\"btn v-default s-icon\" aria-label=\"Add\">+\u003c/button>\r\n  \u003cspan class=\"note\">32 / 36 / 40 px &middot; icon is square at 36\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">With icon\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cbutton class=\"btn v-default\">\u003cspan>+\u003c/span>New agent\u003c/button>\r\n  \u003cbutton class=\"btn v-outline\">Columns \u003cspan>&#9662;\u003c/span>\u003c/button>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">States\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cbutton class=\"btn v-default is-disabled\">Disabled\u003c/button>\r\n  \u003cbutton class=\"btn v-outline is-focus\">Focused\u003c/button>\r\n  \u003cspan class=\"note\">focus-visible: 2px ring at --ring &middot; disabled: 50% opacity\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Button\u003c/h1>\n\u003cp>Source of truth: \u003ccode>packages/ui/src/components/ui/button.tsx\u003c/code>\u003c/p>\n\u003cp>Six variants, four sizes. Built on Radix \u003ccode>Slot\u003c/code>, so \u003ccode>asChild\u003c/code> lets it render as a link or any other element while keeping button styling.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Button } from &quot;@sparstrow/ui&quot;;\n\n&lt;Button&gt;Save changes&lt;/Button&gt;\n&lt;Button variant=&quot;outline&quot; size=&quot;sm&quot;&gt;Cancel&lt;/Button&gt;\n&lt;Button variant=&quot;destructive&quot;&gt;Delete machine&lt;/Button&gt;\n&lt;Button size=&quot;icon&quot; aria-label=&quot;Add&quot;&gt;&lt;Plus /&gt;&lt;/Button&gt;\n\n// Render as a link without losing button styling\n&lt;Button asChild&gt;&lt;Link to=&quot;/machines&quot;&gt;Machines&lt;/Link&gt;&lt;/Button&gt;\u003c/code>\u003c/pre>\n\u003ch2>Variant → meaning\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Use for\u003c/th>\u003cth>Per screen\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>default\u003c/code>\u003c/td>\u003ctd>The one primary action\u003c/td>\u003ctd>At most one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code>\u003c/td>\u003ctd>A supporting action of similar weight\u003c/td>\u003ctd>A few\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>outline\u003c/code>\u003c/td>\u003ctd>Toolbar actions, filters, secondary controls\u003c/td>\u003ctd>Many\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ghost\u003c/code>\u003c/td>\u003ctd>Icon buttons, row actions, nav items — anything that should recede until hovered\u003c/td>\u003ctd>Many\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Irreversible or data-losing actions only\u003c/td>\u003ctd>Rare\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>link\u003c/code>\u003c/td>\u003ctd>Inline navigation inside prose\u003c/td>\u003ctd>Rare\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Dark mode inverts \u003ccode>default\u003c/code>.\u003c/strong> \u003ccode>--primary\u003c/code> is near-white on near-black in dark, so a primary button is the \u003cem>lightest\u003c/em> element on screen, not a coloured one. This surprises people expecting a brand-coloured CTA — it is correct, and it is why the retired doctrine's accent budget left colour free for status. That rationale died with the doctrine (\u003ccode>DECISIONS.md\u003c/code> DD-001) — the neutral primary is still what the code does, but it is no longer a defended choice.\u003c/p>\n\u003ch2>Sizes\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Size\u003c/th>\u003cth>Height\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>sm\u003c/code>\u003c/td>\u003ctd>32px\u003c/td>\u003ctd>Toolbars, table row actions, dense panels\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>default\u003c/code>\u003c/td>\u003ctd>36px\u003c/td>\u003ctd>Standard forms and page actions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lg\u003c/code>\u003c/td>\u003ctd>40px\u003c/td>\u003ctd>Empty-state primary action, auth screens\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>icon\u003c/code>\u003c/td>\u003ctd>36×36\u003c/td>\u003ctd>Icon-only — \u003cstrong>always pair with \u003ccode>aria-label\u003c/code>\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Notes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>destructive\u003c/code> is about consequence, not tone.\u003c/strong> &quot;Delete machine&quot; is destructive; &quot;Cancel&quot; is \u003ccode>outline\u003c/code>. Styling a merely-negative action as destructive makes the genuinely dangerous ones stop registering.\u003c/li>\n\u003cli>\u003cstrong>Icon-only buttons need \u003ccode>aria-label\u003c/code>.\u003c/strong> The component cannot infer one, and a \u003ccode>size=&quot;icon&quot;\u003c/code> button with no label is unusable on a screen reader.\u003c/li>\n\u003cli>Focus is \u003ccode>focus-visible:ring-2 ring-ring\u003c/code> from the base class — do not override or remove it. Keyboard navigation through a dense control plane depends on it entirely.\u003c/li>\n\u003cli>Disabled applies \u003ccode>opacity-50\u003c/code> plus \u003ccode>pointer-events-none\u003c/code>. Because pointer events are off, a tooltip explaining \u003cem>why\u003c/em> it is disabled will not fire from the button — put it on a wrapping element.\u003c/li>\n\u003cli>Icon spacing is handled by the base \u003ccode>gap-2\u003c/code>; do not add margins to the icon.\u003c/li>\n\u003cli>\u003ccode>asChild\u003c/code> swaps the rendered element via Radix \u003ccode>Slot\u003c/code>, so it must receive exactly one child element. Two children throws at runtime.\u003c/li>\n\u003c/ul>","promptPath":"components\\buttons\\button.prompt.md","cardPath":"components\\buttons\\button.card.html","live":null}]},{"section":"Components","group":"Forms","cards":[{"id":"forms-input-card-html","name":"Input","description":"Input — default, focus, error, and disabled field states","section":"Components","group":"Forms","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/forms/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Input\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Input — default, focus, error, and disabled field states\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground)}\r\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-3);width:100%}\r\n  .sw{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .sw .chip{height:56px}\r\n  .sw .meta{padding:8px 10px;font-size:11px;line-height:1.45}\r\n  .sw .name{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px;color:var(--muted-foreground)}\r\n  .sw .val{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n  .fld{display:flex;flex-direction:column;gap:6px;min-width:210px}\r\n  .fl{font-size:12px;font-weight:500;color:var(--foreground)}\r\n  .inp{height:36px;border-radius:var(--radius-md);border:1px solid var(--input);background:transparent;\r\n       color:var(--foreground);padding:0 12px;font-size:14px;font-family:inherit;width:100%}\r\n  .inp::placeholder{color:var(--muted-foreground)}\r\n  .inp.focus{outline:none;box-shadow:0 0 0 2px var(--ring);border-color:var(--ring)}\r\n  .inp.err{border-color:var(--destructive)}\r\n  .inp.dis{opacity:.5}\r\n  .msg{font-size:11.5px;color:var(--destructive)}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Default\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"fld\">\u003clabel class=\"fl\">Agent name\u003c/label>\u003cinput class=\"inp\" placeholder=\"spec-writer\">\u003c/div>\r\n  \u003cdiv class=\"fld\">\u003clabel class=\"fl\">Working directory\u003c/label>\u003cinput class=\"inp\" value=\"D:\\Sparstrow\\Sparstrowgen\">\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Focus\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"fld\">\u003clabel class=\"fl\">Machine label\u003c/label>\u003cinput class=\"inp focus\" value=\"workshop-desktop\">\u003c/div>\r\n  \u003cspan class=\"note\">focus-visible: 2px ring at --ring\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Error\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"fld\">\u003clabel class=\"fl\">Max turns\u003c/label>\u003cinput class=\"inp err\" value=\"-5\">\r\n    \u003cspan class=\"msg\">Must be greater than 0\u003c/span>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Disabled\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"fld\">\u003clabel class=\"fl\">Runtime id\u003c/label>\u003cinput class=\"inp dis\" value=\"rt_9f2c1a\" disabled>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Input\u003c/h1>\n\u003cp>Source of truth: \u003ccode>packages/ui/src/components/ui/input.tsx\u003c/code>\u003c/p>\n\u003cp>A bare text field. It ships no label, no error text, and no layout — those are composed around it, which is why the card shows a field \u003cem>assembly\u003c/em> rather than the input alone.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Input, Label } from &quot;@sparstrow/ui&quot;;\n\n&lt;div className=&quot;flex flex-col gap-1.5&quot;&gt;\n  &lt;Label htmlFor=&quot;agent-name&quot;&gt;Agent name&lt;/Label&gt;\n  &lt;Input id=&quot;agent-name&quot; placeholder=&quot;spec-writer&quot; /&gt;\n&lt;/div&gt;\u003c/code>\u003c/pre>\n\u003ch2>Notes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>htmlFor\u003c/code> / \u003ccode>id\u003c/code> must match.\u003c/strong> A visually adjacent label that is not programmatically associated does not announce, and clicking it does not focus the field.\u003c/li>\n\u003cli>\u003cstrong>Error state is composed, not a prop.\u003c/strong> There is no \u003ccode>error\u003c/code> variant. Add \u003ccode>aria-invalid\u003c/code> plus a border override and render the message yourself, and point at it with \u003ccode>aria-describedby\u003c/code> so it is announced rather than merely visible.\u003c/li>\n\u003cli>Placeholder is not a label. It disappears on input, uses \u003ccode>--muted-foreground\u003c/code> which is deliberately low-contrast, and is the single most common accessibility regression in forms. Use it for format hints only (\u003ccode>BD-3684-KO\u003c/code>), never for the field name.\u003c/li>\n\u003cli>Border uses \u003ccode>--input\u003c/code>, not \u003ccode>--border\u003c/code> — in dark they differ (15% vs 10% white) so fields read as interactive against static panel edges. Do not substitute one for the other.\u003c/li>\n\u003cli>Height is 36px, matching \u003ccode>Button\u003c/code> at default size, so a field and its adjacent button align without correction.\u003c/li>\n\u003cli>For numeric fields compared down a column, add \u003ccode>tabular-nums\u003c/code>; otherwise the digits shift as the value changes.\u003c/li>\n\u003c/ul>","promptPath":"components\\forms\\input.prompt.md","cardPath":"components\\forms\\input.card.html","live":null}]},{"section":"Components","group":"Surfaces","cards":[{"id":"surfaces-card-card-html","name":"Card","description":"Card — the flat-by-default surface: 1px border, no drop shadow","section":"Components","group":"Surfaces","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/surfaces/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Card\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Card — the flat-by-default surface: 1px border, no drop shadow\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:var(--space-4);align-items:center;\r\n       padding:var(--space-4) 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}\r\n  .sp{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}\r\n  .note{font-size:12px;color:var(--muted-foreground)}\r\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--space-3);width:100%}\r\n  .sw{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .sw .chip{height:56px}\r\n  .sw .meta{padding:8px 10px;font-size:11px;line-height:1.45}\r\n  .sw .name{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px;color:var(--muted-foreground)}\r\n  .sw .val{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground)}\r\n  .c{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);\r\n     border-radius:var(--radius-lg);padding:var(--space-5);min-width:230px}\r\n  .c h4{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.01em}\r\n  .c p{margin:0;font-size:13px;color:var(--muted-foreground);line-height:1.5}\r\n  .onbg{background:var(--background);padding:var(--space-4);border-radius:var(--radius-lg);width:100%}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Default\u003c/div>\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"c\">\u003ch4>Runs\u003c/h4>\u003cp>12 completed in the last hour across 3 machines.\u003c/p>\u003c/div>\r\n  \u003cdiv class=\"c\">\u003ch4>Memory\u003c/h4>\u003cp>1,204 notes indexed locally.\u003c/p>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">On canvas\u003c/div>\u003cdiv class=\"onbg\">\r\n  \u003cdiv class=\"c\" style=\"max-width:320px\">\u003ch4>Elevation comes from the border\u003c/h4>\r\n  \u003cp>The card sits one lightness step above the page background. No drop shadow &mdash;\r\n     depth is the 1px line plus the surface step.\u003c/p>\u003c/div>\r\n\u003c/div>\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Card\u003c/h1>\n\u003cp>Source of truth: \u003ccode>packages/ui/src/components/ui/card.tsx\u003c/code>\u003c/p>\n\u003cp>The standard surface: one lightness step above the page background, a 1px border, and no drop shadow. Composed from \u003ccode>Card\u003c/code>, \u003ccode>CardHeader\u003c/code>, \u003ccode>CardTitle\u003c/code>, \u003ccode>CardDescription\u003c/code>, \u003ccode>CardContent\u003c/code>, \u003ccode>CardFooter\u003c/code>.\u003c/p>\n\u003ch2>Usage\u003c/h2>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Card, CardHeader, CardTitle, CardDescription, CardContent } from &quot;@sparstrow/ui&quot;;\n\n&lt;Card&gt;\n  &lt;CardHeader&gt;\n    &lt;CardTitle&gt;Machines&lt;/CardTitle&gt;\n    &lt;CardDescription&gt;3 active, 1 unreachable&lt;/CardDescription&gt;\n  &lt;/CardHeader&gt;\n  &lt;CardContent&gt;{/* … */}&lt;/CardContent&gt;\n&lt;/Card&gt;\u003c/code>\u003c/pre>\n\u003ch2>Notes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Cards carry no drop shadow today.\u003c/strong> This was the retired doctrine's defining rule (see \u003ccode>DECISIONS.md\u003c/code> DD-001) — depth is the surface step plus the border. It describes what the app currently does; it is no longer a rule anyone stands behind, and the new doctrine may change it.\u003c/li>\n\u003cli>\u003ccode>--card\u003c/code> and \u003ccode>--background\u003c/code> are the \u003cem>same value\u003c/em> in light mode. A card on a light page is distinguished purely by its border, so removing the border makes it vanish. In dark they differ by one step.\u003c/li>\n\u003cli>No coloured left-border stripes as accents — a Don't inherited from the retired doctrine, pending re-decision.\u003c/li>\n\u003cli>Padding is 20px (\u003ccode>--space-5\u003c/code>). Keep it; inconsistent card padding is the fastest way for a layout to look unconsidered.\u003c/li>\n\u003cli>For a card that is entirely a table, drop \u003ccode>CardContent\u003c/code>'s padding so the table meets the border — a table inset inside padding reads as floating.\u003c/li>\n\u003c/ul>","promptPath":"components\\surfaces\\card.prompt.md","cardPath":"components\\surfaces\\card.card.html","live":null}]},{"section":"Designs","group":"Machines","cards":[{"id":"Machines-machines-card-html","name":"Machines","description":"Machines list + per-machine profile — entity tiles, provider logos, tab strip + side sub-nav (DD-003/DD-008)","section":"Designs","group":"Machines","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"designs/Machines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Machines\u003c/title>\n\u003cmeta name=\"description\" content=\"Machines list + per-machine profile — entity tiles, provider logos, tab strip + side sub-nav (DD-003/DD-008)\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:13px}\n  h4{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}\n  .count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;\n         border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);font-size:10px;font-weight:600}\n  .sub{margin:0 0 var(--space-4);font-size:12px;color:var(--muted-foreground)}\n  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}\n  .row:last-child{border-bottom:0}\n  .tile{position:relative;flex:none;display:flex;align-items:center;justify-content:center;\n        width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--muted-foreground)}\n  .tile .dot{position:absolute;left:-2px;bottom:-2px;width:8px;height:8px;border-radius:999px;box-shadow:0 0 0 2px var(--card)}\n  .dot-active{background:var(--success)}\n  .dot-inactive{background:color-mix(in oklab, var(--muted-foreground) 45%, transparent)}\n  .name{font-size:12.5px;font-weight:600}\n  .meta{font-size:11px;color:var(--muted-foreground);margin-top:1px}\n  .caps{margin-left:auto;display:flex;gap:4px}\n  .bdg{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:999px;\n       background:var(--secondary);color:var(--secondary-foreground)}\n  .bdg svg{display:block}\n\u003c/style>\u003c/head>\n\u003cbody>\n\u003ch4>Machines \u003cspan class=\"count\">4\u003c/span>\u003c/h4>\n\u003cp class=\"sub\">Entity tiles, provider-logo icon stack, tab strip + side sub-nav profile.\u003c/p>\n\u003cdiv class=\"row\">\n  \u003cspan class=\"tile\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\">\u003crect x=\"2\" y=\"4\" width=\"20\" height=\"13\" rx=\"2\"/>\u003cpath d=\"M8 21h8\"/>\u003c/svg>\u003cspan class=\"dot dot-active\">\u003c/span>\u003c/span>\n  \u003cdiv>\u003cdiv class=\"name\">workshop-desktop\u003c/div>\u003cdiv class=\"meta\">online · win32\u003c/div>\u003c/div>\n  \u003cdiv class=\"caps\">\n    \u003cspan class=\"bdg\" title=\"Claude Code\">\u003csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003cpath d=\"M21 10.5h3v3h-3v3h-1.5v3H18v-3h-1.5v3H15v-3H9v3H7.5v-3H6v3H4.5v-3H3v-3H0v-3h3v-6h18Zm-15 0h1.5v-3H6Zm10.5 0H18v-3h-1.5z\"/>\u003c/svg>\u003c/span>\n    \u003cspan class=\"bdg\" title=\"Ollama\">\u003csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003cpath d=\"M16.361 10.26a.894.894 0 0 0-.558.47l-.072.148.001.207c0 .193.004.217.059.353.076.193.152.312.291.448.24.238.51.3.872.205a.86.86 0 0 0 .517-.436.752.752 0 0 0 .08-.498c-.064-.453-.33-.782-.724-.897a1.06 1.06 0 0 0-.466 0z\"/>\u003c/svg>\u003c/span>\n    \u003cspan class=\"bdg\" style=\"font-size:9px;color:var(--muted-foreground);background:transparent\">+6\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cspan class=\"tile\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\">\u003crect x=\"2\" y=\"4\" width=\"20\" height=\"13\" rx=\"2\"/>\u003cpath d=\"M8 21h8\"/>\u003c/svg>\u003cspan class=\"dot dot-active\">\u003c/span>\u003c/span>\n  \u003cdiv>\u003cdiv class=\"name\">office-mac-mini\u003c/div>\u003cdiv class=\"meta\">online · darwin\u003c/div>\u003c/div>\n  \u003cdiv class=\"caps\">\n    \u003cspan class=\"bdg\" title=\"Ollama\">\u003csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"currentColor\">\u003cpath d=\"M16.361 10.26a.894.894 0 0 0-.558.47l-.072.148.001.207c0 .193.004.217.059.353.076.193.152.312.291.448.24.238.51.3.872.205a.86.86 0 0 0 .517-.436.752.752 0 0 0 .08-.498c-.064-.453-.33-.782-.724-.897a1.06 1.06 0 0 0-.466 0z\"/>\u003c/svg>\u003c/span>\n  \u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cspan class=\"tile\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\">\u003crect x=\"2\" y=\"4\" width=\"20\" height=\"13\" rx=\"2\"/>\u003cpath d=\"M8 21h8\"/>\u003c/svg>\u003cspan class=\"dot dot-inactive\">\u003c/span>\u003c/span>\n  \u003cdiv>\u003cdiv class=\"name\">build-server\u003c/div>\u003cdiv class=\"meta\">last seen 52m ago · linux\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"designs\\Machines\\machines.card.html","live":"designs\\Machines\\machines.dc.html"}]},{"section":"Designs","group":"Settings","cards":[{"id":"Settings-settings-redesign-card-html","name":"Settings Redesign","description":"Settings Redesign — 3-paradigm navigation prototype eliminating nested tabs","section":"Designs","group":"Settings","html":"\u003c!doctype html>\r\n\u003chtml>\u003chead>\u003cbase href=\"designs/Settings/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Settings Redesign\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Settings Redesign — 3-paradigm navigation prototype eliminating nested tabs\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body { margin:0; padding:var(--space-4,16px); background:var(--card,#161618); color:var(--foreground,#f4f4f5);\r\n         font-family:var(--font-sans,system-ui); font-size:13px; }\r\n  .preview-wrap { display:grid; grid-template-columns:90px 1fr; gap:12px; border:1px solid var(--border);\r\n                  border-radius:var(--radius-md); padding:10px; background:var(--background); }\r\n  .mini-nav { display:flex; flex-direction:column; gap:4px; border-right:1px solid var(--border); padding-right:8px; }\r\n  .mini-item { font-size:10px; padding:3px 6px; border-radius:4px; color:var(--muted-foreground); }\r\n  .mini-item.active { background:var(--card); color:var(--foreground); font-weight:600; }\r\n  .mini-cards { display:flex; flex-direction:column; gap:6px; }\r\n  .mini-card { background:var(--card); border:1px solid var(--border); border-radius:4px; height:24px; }\r\n\u003c/style>\u003c/head>\r\n\u003cbody>\r\n  \u003cdiv class=\"preview-wrap\">\r\n    \u003cdiv class=\"mini-nav\">\r\n      \u003cdiv class=\"mini-item active\">Profile\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Theme\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Git\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Workspace\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Providers\u003c/div>\r\n    \u003c/div>\r\n    \u003cdiv class=\"mini-cards\">\r\n      \u003cdiv class=\"mini-card\" style=\"width: 80%;\">\u003c/div>\r\n      \u003cdiv class=\"mini-card\" style=\"width: 100%;\">\u003c/div>\r\n      \u003cdiv class=\"mini-card\" style=\"width: 60%;\">\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"designs\\Settings\\settings-redesign.card.html","live":"designs\\Settings\\settings-redesign.dc.html"}]}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("payload").textContent);
  const navTree = document.getElementById("nav-tree");
  const cardsEl = document.getElementById("cards");
