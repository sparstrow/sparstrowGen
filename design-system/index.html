<!doctype html>
<!-- No data-theme on this root: it would imply the chrome follows the card
     theme control, which it deliberately does not. See the palette block. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparstrowgen Design System</title>
<style>
  /* The viewer chrome is deliberately independent of the system's own tokens.
     Cards render inside iframes, so a system whose tokens are mid-edit (or
     broken) still leaves the surrounding page navigable. */
  /* CHROME PALETTE — deliberately neutral, and deliberately NOT bound to the
     theme control.

     Two rules govern this block, and both exist for the same reason: the
     viewer frames work whose colour is the thing being judged.

     1. NEUTRAL, always. Every value below is achromatic — equal R, G, and B.
        A chrome with an accent hue tints the perception of every swatch beside
        it, which is why image editors use grey canvases and galleries use grey
        walls. This viewer previously used a terracotta accent (#c8794a); it
        looked considered and it was quietly biasing every colour review done
        in it.
     2. DECOUPLED from the card theme. `--vw-*` never keys off [data-theme],
        because [data-theme] now means "what the CARDS are showing". The chrome
        follows the operating system once, at load, and then holds still.
        A frame that repaints every time you compare light against dark gives
        the eye nothing fixed to measure against. */
  :root {
    --vw-bg: #171717; --vw-panel: #202020; --vw-rail: #121212;
    --vw-fg: #f2f2f2; --vw-muted: #8c8c8c; --vw-border: #2e2e2e;
    /* The canvas a card sits on. Lifted off --vw-bg so a dark card has an edge
       and a light card is not floating in a void. */
    --vw-canvas: #0e0e0e;
    --vw-radius: 10px;
    --vw-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --vw-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --vw-bg: #f2f2f2; --vw-panel: #fafafa; --vw-rail: #e9e9e9;
      --vw-fg: #1c1c1c; --vw-muted: #6a6a6a; --vw-border: #dcdcdc;
      --vw-canvas: #e4e4e4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--vw-bg); color: var(--vw-fg);
    font-family: var(--vw-font); font-size: 13px; line-height: 1.5;
    display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden;
  }
  /* ── rail ── */
  nav {
    background: var(--vw-rail); border-right: 1px solid var(--vw-border);
    overflow-y: auto; padding: 12px 0 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px 14px;
    font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
  }
  /* A neutral mark. The previous version was a filled accent-coloured square —
     a placeholder logo every system generated by this skill wore identically,
     which is the definition of a template tell. */
  .brand .dot { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--vw-muted); }
  .filter {
    margin: 0 12px 12px; width: calc(100% - 24px); padding: 6px 9px;
    background: transparent; border: 1px solid var(--vw-border); border-radius: 8px;
    color: var(--vw-fg); font: inherit; font-size: 12px;
  }
  .filter:focus-visible { outline: 2px solid var(--vw-fg); outline-offset: 1px; border-color: var(--vw-fg); }
  .nav-group { margin-top: 6px; }
  .nav-group > .nav-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 6px 16px; background: none; border: 0; cursor: pointer;
    color: var(--vw-fg); font: inherit; font-size: 12px; font-weight: 600; text-align: left;
  }
  .nav-head .chev { transition: transform .14s ease; opacity: .6; }
  .nav-group[data-collapsed="true"] .chev { transform: rotate(-90deg); }
  .nav-group[data-collapsed="true"] .nav-items { display: none; }
  .nav-items a {
    display: block; padding: 4px 16px 4px 28px; color: var(--vw-muted);
    text-decoration: none; font-size: 12px; border-left: 2px solid transparent;
  }
  .nav-items a:hover { color: var(--vw-fg); background: color-mix(in oklab, var(--vw-fg) 5%, transparent); }
  .nav-items a.active { color: var(--vw-fg); border-left-color: var(--vw-fg); font-weight: 600; }
  /* ── main ── */
  main { overflow-y: auto; scroll-behavior: smooth; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; padding: 10px 24px;
    background: color-mix(in oklab, var(--vw-bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--vw-border);
  }
  .topbar .meta { color: var(--vw-muted); font-size: 11.5px; font-family: var(--vw-mono); }
  .btn {
    padding: 5px 10px; background: transparent; border: 1px solid var(--vw-border);
    border-radius: 8px; color: var(--vw-fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: color-mix(in oklab, var(--vw-fg) 6%, transparent); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 24px 120px; }
  .section-label {
    margin: 34px 0 12px; color: var(--vw-muted); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .card-block { margin-bottom: 26px; scroll-margin-top: 60px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .card-desc { color: var(--vw-muted); font-size: 12px; margin-top: 1px; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .frame-shell {
    border: 1px solid var(--vw-border); border-radius: var(--vw-radius);
    overflow: hidden; background: var(--vw-canvas);
  }
  iframe { display: block; width: 100%; border: 0; background: transparent; }
  details.notes { margin-top: 8px; }
  details.notes > summary {
    cursor: pointer; color: var(--vw-muted); font-size: 12px; padding: 4px 0;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details.notes > summary::-webkit-details-marker { display: none; }
  details.notes > summary::before { content: "›"; transition: transform .14s ease; display: inline-block; }
  details.notes[open] > summary::before { transform: rotate(90deg); }
  details.notes > summary:hover { color: var(--vw-fg); }
  .notes-body {
    padding: 4px 2px 8px; font-size: 12.5px;
    border-left: 2px solid var(--vw-border); padding-left: 14px; margin-top: 6px;
  }
  .notes-body h1, .notes-body h2, .notes-body h3, .notes-body h4 { margin: 14px 0 6px; font-size: 13px; }
  .notes-body h1 { font-size: 14px; }
  .notes-body p { margin: 6px 0; }
  .notes-body ul, .notes-body ol { margin: 6px 0; padding-left: 20px; }
  .notes-body li { margin: 2px 0; }
  .notes-body code { font-family: var(--vw-mono); font-size: 11.5px;
    background: color-mix(in oklab, var(--vw-fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
  .notes-body pre.code {
    background: var(--vw-rail); border: 1px solid var(--vw-border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .notes-body pre.code code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
  .notes-body table { border-collapse: collapse; margin: 8px 0; font-size: 12px; width: 100%; }
  .notes-body th, .notes-body td { border: 1px solid var(--vw-border); padding: 5px 9px; text-align: left; }
  .notes-body th { background: var(--vw-rail); font-weight: 600; }
  .notes-body blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--vw-border); color: var(--vw-muted); }
  .readme { padding-bottom: 10px; border-bottom: 1px solid var(--vw-border); }
  .readme > h1:first-child { margin-top: 0; font-size: 22px; letter-spacing: -0.02em; }
  .empty { color: var(--vw-muted); padding: 40px 0; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    nav { display: none; }
  }
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="dot"></span><span>Sparstrowgen</span></div>
  <input class="filter" id="filter" type="search" placeholder="Filter…" aria-label="Filter cards">
  <div id="nav-tree"></div>
</nav>
<main>
  <div class="topbar">
    <div class="meta" id="meta"></div>
    <div class="card-actions">
      <button class="btn" id="expand-all">Expand notes</button>
      <button class="btn" id="theme" title="Switches the cards only. The viewer chrome stays neutral so it does not bias what you are reviewing.">Cards: Light</button>
    </div>
  </div>
  <div class="wrap">
    <div class="readme" id="readme"></div>
    <div id="cards"></div>
    <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
  </div>
</main>

<script type="application/json" id="payload">{"name":"Sparstrowgen","mode":"mirror","theme":{"default":"dark","toggleAttr":"data-theme"},"generatedAt":"2026-09-01T23:07:47.572Z","readme":"\u003ch1>Sparstrowgen — design system\u003c/h1>\n\u003cp>An autonomous agent platform and developer control plane. The surfaces here are \u003cstrong>monitoring surfaces\u003c/strong>: dense, scanned rather than read, and open for long sittings. That is why the type scale runs denser than shadcn's defaults and why motion stays under 200ms.\u003c/p>\n\u003cblockquote>\u003cstrong>This is the primary design system\u003c/strong>, rebuilt 2026-08-19 against the current \u003ccode>DESIGN.md\u003c/code> doctrine. It replaced the original \u003ccode>design-system/\u003c/code> on 2026-09-01 after a comparison period found this version's tokens accurate to real code with no invented values — see \u003ccode>DECISIONS.md\u003c/code> for the design-decision history carried over from the original, and \u003ccode>designs/\u003c/code> for its prototype handoffs.\u003c/blockquote>\n\u003ch2>How to consume this\u003c/h2>\n\u003col>\n\u003cli>Link \u003ccode>styles.css\u003c/code> in your \u003ccode>&lt;head&gt;\u003c/code> — it is \u003ccode>@import\u003c/code> only, real values live in \u003ccode>tokens/\u003c/code>.\u003c/li>\n\u003cli>Load \u003cstrong>Inter Variable\u003c/strong> (\u003ccode>@fontsource-variable/inter\u003c/code>). It is the only font the system names.\u003c/li>\n\u003cli>\u003cstrong>Dark is a \u003ccode>.dark\u003c/code> class on the root, not a media query and not a data attribute.\u003c/strong> \u003ccode>:root\u003c/code> is light. The app ships dark, so \u003ccode>.dark\u003c/code> is the practical default even though the cascade treats it as the override.\u003c/li>\n\u003cli>Use \u003ccode>var(--foreground)\u003c/code>, \u003ccode>var(--warning)\u003c/code> and so on for every colour. \u003cstrong>Never a hex literal and never a Tailwind palette class\u003c/strong> — \u003ccode>bg-amber-500\u003c/code> is a defect, not a shortcut, and \u003ccode>DESIGN.md\u003c/code> §12 says so directly.\u003c/li>\n\u003c/ol>\n\u003ch2>Sources — mirror mode\u003c/h2>\n\u003cp>This system documents real code. It does not reimplement it.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Documented\u003c/th>\u003cth>Real file\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>All colour tokens, radius, font\u003c/td>\u003ctd>\u003ccode>packages/ui/src/styles/globals.css\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Button, Badge, Input, Card, Empty, Skeleton\u003c/td>\u003ctd>\u003ccode>packages/ui/src/components/ui/*.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Motion keyframes\u003c/td>\u003ctd>\u003ccode>packages/ui/src/styles/globals.css\u003c/code> (lines 140–195)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>node .claude/skills/design-system/scripts/ds.mjs check --root design-system\u003c/code> diffs the recorded values against those files and exits non-zero on drift.\u003c/p>\n\u003ch2>The doctrine is not this file\u003c/h2>\n\u003cp>\u003ccode>DESIGN.md\u003c/code> at the repo root is the design doctrine — written with the owner via the \u003ccode>design-brief\u003c/code> skill. \u003cstrong>This system documents what the code has; the doctrine says what it should be.\u003c/strong> Where they disagree, the doctrine wins and the gap is a task, not a discrepancy to smooth over.\u003c/p>\n\u003cp>Every card that shows such a gap says so explicitly rather than rendering the specified version and letting a reader assume it ships.\u003c/p>\n\u003ch2>What the app actually has, versus what §2–§7 specify\u003c/h2>\n\u003cp>The most useful thing this system can tell you, stated once:\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Foundation\u003c/th>\u003cth>In the code\u003c/th>\u003cth>In \u003ccode>DESIGN.md\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Colour\u003c/strong>\u003c/td>\u003ctd>Derived from \u003ccode>packages/shared/src/theme/tokens.ts\u003c/code>: 4 surfaces × 5 brands × 2 modes, as root classes\u003c/td>\u003ctd>§2 — the theming contract. \u003cstrong>Built\u003c/strong> 2026-08-19; \u003ccode>G-19\u003c/code> closed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Radius\u003c/strong>\u003c/td>\u003ctd>One base, three \u003ccode>calc()\u003c/code> steps. Real\u003c/td>\u003ctd>§5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Status\u003c/strong>\u003c/td>\u003ctd>5 tokens: success, warning, \u003cstrong>approval\u003c/strong>, danger, info — plus 6 \u003cstrong>identity\u003c/strong> roles\u003c/td>\u003ctd>§2.4, §2.5. Both built and measured 2026-08-19\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Code syntax\u003c/strong>\u003c/td>\u003ctd>6 tokens per mode. Real, and never themed\u003c/td>\u003ctd>§2.6 &amp;mdash; the one foundation with \u003cstrong>no gap\u003c/strong>. Written to describe what shipped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Type\u003c/strong>\u003c/td>\u003ctd>\u003ccode>--font-sans\u003c/code>, and nothing else\u003c/td>\u003ctd>§3 — a seven-role scale. \u003cstrong>No CSS counterpart\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Spacing\u003c/strong>\u003c/td>\u003ctd>No tokens. Tailwind defaults at each call site\u003c/td>\u003ctd>§4 specifies a base unit and density\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Shadow\u003c/strong>\u003c/td>\u003ctd>No tokens. Tailwind utilities\u003c/td>\u003ctd>§5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Motion\u003c/strong>\u003c/td>\u003ctd>4 real keyframes, durations written literally\u003c/td>\u003ctd>§7. No tokens, and no \u003ccode>prefers-reduced-motion\u003c/code> anywhere\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Known limitations &amp; boundaries\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>There is no theme picker.\u003c/strong> Surface and brand are class-swappable on \u003ccode>&lt;html&gt;\u003c/code> and nothing in the product changes them — no control, no storage, no per-device or per-account decision. That is \u003ccode>doc/Deferred.md\u003c/code> D-18, parked by the owner, and it needs a \u003ccode>product-requirements\u003c/code> pass before it is built. The light/dark toggle in Settings is a separate, older thing and is unaffected.\u003c/li>\n\u003cli>\u003cstrong>Nothing responds to \u003ccode>prefers-reduced-motion\u003c/code>\u003c/strong> — verified 2026-08-19, no match in \u003ccode>packages/ui/src\u003c/code> or \u003ccode>apps/web/src\u003c/code>. \u003ccode>spg-pulse\u003c/code> is infinite.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>check\u003c/code> cannot catch an invented token.\u003c/strong> It diffs recorded tokens against source; a token declared here that exists in no source passes clean. That is \u003ccode>doc/KnownGaps.md\u003c/code> G-18, and it is why this system defines fewer tokens rather than more.\u003c/li>\n\u003cli>\u003cstrong>No prototypes yet.\u003c/strong> \u003ccode>designs/\u003c/code> is empty. The original system carries the Machines prototype and its handoff.\u003c/li>\n\u003cli>\u003cstrong>Contrast is verified, but not by this system.\u003c/strong> \u003ccode>packages/shared/src/theme/theme.test.ts\u003c/code> sweeps every preset × surface × mode × ramp step in \u003ccode>pnpm test\u003c/code>; these cards only display the result. A card that looks wrong here is a card bug, not a token bug.\u003c/li>\n\u003cli>\u003cstrong>Two exceptions to &quot;no literal colours&quot; ship on purpose.\u003c/strong> The terminal canvas (\u003ccode>terminals.tsx\u003c/code>) is \u003ccode>#0a0a0a\u003c/code> in both modes because xterm takes a colour string rather than a variable, and the Google mark in \u003ccode>provider-icons.tsx\u003c/code> is that provider's own brand — §2.1's Provider role.\u003c/li>\n\u003c/ul>\n\u003ch2>What differs from the original \u003ccode>design-system/\u003c/code>\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003ccode>design-system/\u003c/code>\u003c/th>\u003cth>\u003ccode>design-system-v2/\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Built against\u003c/td>\u003ctd>The retired doctrine, partly\u003c/td>\u003ctd>\u003ccode>DESIGN.md\u003c/code> as of 2026-08-19, including §2.4–2.6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invented tokens\u003c/td>\u003ctd>\u003ccode>--transition-base\u003c/code>, \u003ccode>--space-*\u003c/code>, \u003ccode>--font-mono\u003c/code>, \u003ccode>--radius-full\u003c/code> — none exist in the app\u003c/td>\u003ctd>\u003cstrong>None.\u003c/strong> Gaps are stated, not filled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Colour source\u003c/td>\u003ctd>Whatever \u003ccode>globals.css\u003c/code> happened to hold\u003c/td>\u003ctd>A typed table, with a test that fails on divergence\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cards depend on\u003c/td>\u003ctd>At least one invented token, all 10 of them\u003c/td>\u003ctd>Only tokens the app really has\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Type scale\u003c/td>\u003ctd>§3's prose transcribed into CSS\u003c/td>\u003ctd>Shown as literals, labelled as unbuilt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Motion\u003c/td>\u003ctd>One invented duration token\u003c/td>\u003ctd>The four real keyframes, animating live\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Components\u003c/td>\u003ctd>4\u003c/td>\u003ctd>6 — adds Empty and Skeleton, the two states most often skipped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prototypes\u003c/td>\u003ctd>Machines (\u003ccode>designs/\u003c/code>)\u003c/td>\u003ctd>none yet\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>The original is not wrong so much as \u003cstrong>honest in its comments and misleading in its files\u003c/strong>: it annotates the invented values clearly, and still ships them as CSS that renders. This one leaves the gap visible instead.\u003c/p>","sections":[{"section":"Foundations","group":"Foundations","cards":[{"id":"code-syntax-card-html","name":"Code syntax","description":"The fifth colour role: six tokens per mode, fixed and never themed (DESIGN.md §2.6)","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Code syntax\u003c/title>\r\n\u003cmeta name=\"description\" content=\"The fifth colour role: six tokens per mode, fixed and never themed (DESIGN.md §2.6)\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Literal px for card chrome — the app defines no spacing tokens. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;\r\n     text-transform:uppercase;color:var(--muted-foreground)}\r\n  pre{margin:0;padding:14px 16px;border:1px solid var(--border);\r\n      border-radius:var(--radius-md);background:var(--background);\r\n      font-size:12px;line-height:1.7;overflow-x:auto;\r\n      font-family:ui-monospace,SFMono-Regular,Menlo,monospace}\r\n  .c{color:var(--hl-comment);font-style:italic}\r\n  .k{color:var(--hl-keyword)}\r\n  .s{color:var(--hl-string)}\r\n  .n{color:var(--hl-number)}\r\n  .t{color:var(--hl-title)}\r\n  .a{color:var(--hl-attr)}\r\n  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}\r\n  .key{display:flex;align-items:center;gap:7px;font-size:11.5px;\r\n       color:var(--muted-foreground)}\r\n  .key i{width:14px;height:14px;border-radius:4px;flex:0 0 auto}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  .rule{margin-top:12px;padding:10px 12px;border-left:2px solid var(--border);\r\n        font-size:12px;line-height:1.6;color:var(--muted-foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003ch4>Ships today — six tokens per mode\u003c/h4>\r\n\r\n\u003cpre>\u003cspan class=\"c\">// Contrast is measured against all three ramp steps.\u003c/span>\r\n\u003cspan class=\"k\">const\u003c/span> \u003cspan class=\"t\">PRESETS\u003c/span> = {\r\n  \u003cspan class=\"a\">Amber\u003c/span>:  { h: \u003cspan class=\"n\">70\u003c/span>, c: \u003cspan class=\"n\">0.15\u003c/span>, lightL: \u003cspan class=\"n\">0.528\u003c/span> },\r\n  \u003cspan class=\"a\">Violet\u003c/span>: { h: \u003cspan class=\"n\">285\u003c/span>, c: \u003cspan class=\"n\">0.18\u003c/span>, lightL: \u003cspan class=\"n\">0.538\u003c/span> },\r\n};\r\n\r\n\u003cspan class=\"k\">export function\u003c/span> \u003cspan class=\"t\">check\u003c/span>(\u003cspan class=\"a\">p\u003c/span>: \u003cspan class=\"t\">Preset\u003c/span>) {\r\n  \u003cspan class=\"k\">if\u003c/span> (\u003cspan class=\"t\">worst\u003c/span>(\u003cspan class=\"a\">p\u003c/span>) &lt; \u003cspan class=\"n\">4.5\u003c/span>)\r\n    \u003cspan class=\"k\">throw new\u003c/span> \u003cspan class=\"t\">Error\u003c/span>(\u003cspan class=\"s\">\"below the contrast floor\"\u003c/span>);\r\n}\u003c/pre>\r\n\r\n\u003cdiv class=\"keys\">\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-comment)\">\u003c/i>--hl-comment\u003c/div>\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-keyword)\">\u003c/i>--hl-keyword\u003c/div>\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-string)\">\u003c/i>--hl-string\u003c/div>\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-number)\">\u003c/i>--hl-number\u003c/div>\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-title)\">\u003c/i>--hl-title\u003c/div>\r\n  \u003cdiv class=\"key\">\u003ci style=\"background:var(--hl-attr)\">\u003c/i>--hl-attr\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cp class=\"note\">\u003cstrong>This is the fifth colour role, not a leftover.\u003c/strong>\r\n  Only the classes \u003ccode>highlight.js\u003c/code> actually emits are styled; anything\r\n  else falls through to \u003ccode>--foreground\u003c/code>. The values sit one step\r\n  calmer than a typical editor theme because code here appears inside a\r\n  monitoring surface, not an editor.\u003c/p>\r\n\r\n\u003cdiv class=\"rule\">\u003cstrong>Named rule — Syntax Is Not Themed.\u003c/strong> A user's\r\n  surface or accent choice does not reach these six. Tinting them with the\r\n  surface costs about a third of the perceptual separation between them, and\r\n  mapping them onto the status and brand roles costs about half — and makes a\r\n  green string literal read as \u003cem>online\u003c/em>. \u003ccode>DESIGN.md\u003c/code> §2.6,\r\n  decided 2026-08-19 (\u003ccode>OQ-4\u003c/code> → \u003ccode>DD-011\u003c/code>).\u003c/div>\r\n\r\n\u003cp class=\"note\">Unlike every other guideline card here, this one documents a\r\n  foundation with \u003cstrong>no gap between the doctrine and the code\u003c/strong> —\r\n  §2.6 was written to describe what already shipped rather than to specify\r\n  something to build.\u003c/p>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\code-syntax.card.html","live":null},{"id":"motion-card-html","name":"Motion","description":"The four animations that actually ship, with their real durations and curves — no motion tokens exist","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Motion\u003c/title>\r\n\u003cmeta name=\"description\" content=\"The four animations that actually ship, with their real durations and curves — no motion tokens exist\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Literal px for card chrome. Every duration and curve below is copied from\r\n     globals.css lines 140-195 — this card animates with the real values. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;\r\n       padding:12px 0;border-bottom:1px solid var(--border)}\r\n  .row:last-of-type{border-bottom:0}\r\n  .lbl{font-size:11px;font-weight:600;color:var(--foreground)}\r\n  .lbl em{display:block;font-weight:400;font-style:normal;font-size:10.5px;\r\n          color:var(--muted-foreground);margin-top:2px}\r\n  .stage{height:36px;border:1px solid var(--border);border-radius:var(--radius-md);\r\n         overflow:hidden;position:relative;background:var(--muted)}\r\n  .chip{position:absolute;top:6px;left:8px;padding:4px 10px;border-radius:var(--radius-sm);\r\n        background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:600}\r\n\r\n  @keyframes spg-slide-in-right{from{transform:translateX(100%)}to{transform:translateX(0)}}\r\n  @keyframes spg-fade-in{from{opacity:0}to{opacity:1}}\r\n  @keyframes spg-pulse{0%,100%{opacity:.25}50%{opacity:1}}\r\n  @keyframes spg-turn-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}\r\n\r\n  .a1{animation:spg-slide-in-right .2s cubic-bezier(.3,.7,.4,1) infinite alternate}\r\n  .a2{animation:spg-fade-in .15s ease-out infinite alternate}\r\n  .a3{animation:spg-pulse 1s ease-in-out infinite}\r\n  .a4{animation:spg-turn-in .18s cubic-bezier(.165,.84,.44,1) infinite alternate}\r\n\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"row\">\r\n  \u003cdiv class=\"lbl\">spg-slide-in-right\u003cem>0.2s &middot; cubic-bezier(.3,.7,.4,1)\u003c/em>\u003c/div>\r\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a1\">sheet\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\r\n  \u003cdiv class=\"lbl\">spg-fade-in\u003cem>0.15s &middot; ease-out\u003c/em>\u003c/div>\r\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a2\">overlay\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\r\n  \u003cdiv class=\"lbl\">spg-turn-in\u003cem>0.18s &middot; cubic-bezier(.165,.84,.44,1)\u003c/em>\u003c/div>\r\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a4\">chat turn\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\r\n  \u003cdiv class=\"lbl\">spg-pulse\u003cem>1s &middot; ease-in-out &middot; infinite\u003c/em>\u003c/div>\r\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a3\">thinking\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Four animations, plain CSS keyframes, no framer-motion.\u003c/strong> Everything is\r\n  opacity and transform only. Durations sit between 150ms and 200ms — fast enough to read as\r\n  state feedback rather than choreography, which is the app&rsquo;s whole register.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>There are no motion tokens.\u003c/strong> Durations and curves are written literally at\r\n  each call site. That means §7 of the doctrine cannot be changed in one place today, and\r\n  the four values above are the real vocabulary any new animation should match. The previous\r\n  design system papered over this by inventing \u003ccode>--transition-base: 140ms ease\u003c/code>,\r\n  a token present in no stylesheet and consumed by nothing — \u003ccode>doc/KnownGaps.md\u003c/code>\r\n  G-18. It is deliberately absent here.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Not verified:\u003c/strong> \u003ccode>prefers-reduced-motion\u003c/code>. Nothing in\r\n  globals.css responds to it, so \u003ccode>spg-pulse\u003c/code> in particular — infinite, and the\r\n  one users notice — currently runs regardless of the setting.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\motion.card.html","live":null},{"id":"radius-card-html","name":"Radius","description":"Four steps, all derived by calc() from one --radius base of 0.625rem","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Radius\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Four steps, all derived by calc() from one --radius base of 0.625rem\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Literal px for card chrome — the app defines no spacing tokens. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .sp{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\r\n  .item{display:flex;flex-direction:column;gap:6px;align-items:center;\r\n        font-size:10.5px;color:var(--muted-foreground)}\r\n  .bx{width:64px;height:64px;background:var(--muted);border:1px solid var(--border)}\r\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"sp\">\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-sm)\">\u003c/div>\u003cdiv>sm &middot; base &minus;4px\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-md)\">\u003c/div>\u003cdiv>md &middot; base &minus;2px\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-lg)\">\u003c/div>\u003cdiv>lg &middot; base\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-xl)\">\u003c/div>\u003cdiv>xl &middot; base +4px\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Four steps, one decision.\u003c/strong> All of them come from\r\n  \u003ccode>--radius: 0.625rem\u003c/code> via \u003ccode>calc()\u003c/code> in globals.css — they are not\r\n  independently chosen. Moving that one base moves the whole scale together, which is why a\r\n  literal pixel radius anywhere is a defect rather than a shortcut: it pins one corner while\r\n  every adjacent corner moves.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  The relationship is deliberately kept as \u003ccode>calc()\u003c/code> in\r\n  \u003ccode>tokens/spacing.css\u003c/code> rather than resolved to 6 / 8 / 10 / 14px. Mirroring the\r\n  output would record the numbers and lose the rule that produced them.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>There is no \u003ccode>--radius-full\u003c/code>.\u003c/strong> Pills and avatars use Tailwind's\r\n  \u003ccode>rounded-full\u003c/code> directly. The previous design system defined one in its own\r\n  token file and drew it on this card, which made the scale look like five steps the app\r\n  could reproduce — it has four.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\radius.card.html","live":null},{"id":"status-colors-card-html","name":"Status &amp; identity colour","description":"Five status tokens and six actor-identity roles, every value measured against all four surfaces in both modes","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Status &amp; identity colour\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Five status tokens and six actor-identity roles, every value measured against all four surfaces in both modes\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Literal px for card chrome — the app defines no spacing tokens. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;\r\n     text-transform:uppercase;color:var(--muted-foreground)}\r\n  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\r\n  .tok{padding:10px 12px;border-radius:var(--radius-md);font-size:12px;\r\n       display:flex;align-items:center;gap:8px}\r\n  .tok b{font-weight:650}\r\n  .tok span{margin-left:auto;font-size:10.5px;opacity:.8}\r\n  .ship{border:1px solid var(--border)}\r\n  .todo{border:1px dashed var(--border);background:var(--muted);color:var(--muted-foreground)}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  .rule{margin-top:12px;padding:10px 12px;border-left:2px solid var(--border);\r\n        font-size:12px;line-height:1.6;color:var(--muted-foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n  hr{border:0;border-top:1px solid var(--border);margin:20px 0}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003ch4>Ships today — four tokens, both modes\u003c/h4>\r\n\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"tok ship\" style=\"background:var(--success);color:var(--success-foreground)\">\r\n    \u003cb>success\u003c/b> online, passed \u003cspan>--success\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"tok ship\" style=\"background:var(--warning);color:var(--warning-foreground)\">\r\n    \u003cb>warning\u003c/b> needs attention \u003cspan>--warning\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"tok ship\" style=\"background:var(--info);color:var(--info-foreground)\">\r\n    \u003cb>info\u003c/b> informational \u003cspan>--info\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"tok ship\" style=\"background:var(--destructive);color:var(--destructive-foreground)\">\r\n    \u003cb>destructive\u003c/b> failed \u003cspan>--destructive\u003c/span>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Each token holds the colour itself\u003c/strong>, not a pale tint of it — so\r\n  \u003ccode>text-warning\u003c/code> is the colour, \u003ccode>bg-warning/5\u003c/code> is a faint wash of it,\r\n  and \u003ccode>bg-warning\u003c/code> with \u003ccode>text-warning-foreground\u003c/code> is a solid fill.\r\n  The \u003ccode>-foreground\u003c/code> is the neutral that goes on top, and it flips with the mode\r\n  because the dark values are light and the light values are dark.\r\n  \u003cbr>\u003cbr>\r\n  Both modes are defined, so a \u003ccode>dark:\u003c/code> variant on a status colour is a sign\r\n  someone hand-rolled a palette value instead. Changed 2026-08-19 — see\r\n  \u003ccode>DD-012\u003c/code>, which is also why \u003ccode>bg-warning/5\u003c/code> is visible at all.\r\n\u003c/div>\r\n\r\n\u003chr>\r\n\r\n\u003ch4>Also shipping — added 2026-08-19\u003c/h4>\r\n\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"tok ship\" style=\"background:var(--approval);color:var(--approval-foreground)\">\r\n    \u003cb>approval\u003c/b> awaiting a human yes \u003cspan>--approval\u003c/span>\u003c/div>\r\n  \u003cdiv class=\"tok ship\" style=\"border-color:var(--border)\">\r\n    \u003cb>identity &times;6\u003c/b> which agent is this\r\n    \u003cspan style=\"display:flex;gap:3px;margin-left:auto\">\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-1)\">\u003c/i>\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-2)\">\u003c/i>\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-3)\">\u003c/i>\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-4)\">\u003c/i>\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-5)\">\u003c/i>\r\n      \u003ci style=\"width:9px;height:9px;border-radius:2px;background:var(--identity-6)\">\u003c/i>\r\n    \u003c/span>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"rule\">\r\n  \u003cstrong>Approval is a fifth status, not a shade of warning.\u003c/strong> \u003cem>Blocked\u003c/em> and\r\n  \u003cem>awaiting approval\u003c/em> are triaged differently and must be separable across a room.\r\n  Hue 310 keeps it clear of info (255) and of the Violet brand preset (285).\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"rule\">\r\n  \u003cstrong>Named rule — Identity Is Not Status.\u003c/strong> No actor-identity hue sits within\r\n  20&deg; of a status hue. The six shipping hues are 50 / 135 / 185 / 235 / 285 / 335 — also\r\n  the widest mutual separation available, 50&deg;, because telling two agents apart is the\r\n  one job this palette has. Identity is never themed: if a user accent could recolour it,\r\n  two agents could collapse to one hue.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"rule\">\r\n  \u003cstrong>The avatar is a neutral chip with a coloured mark, not a coloured chip.\u003c/strong>\r\n  §2.5 originally specified an identity tint plus the colour&rsquo;s own foreground. Measured,\r\n  that reaches 3.91:1 in dark mode — a 15% tint lifts the ground by more than the mark\r\n  gains. A neutral fill with the identity colour on the mark and a 40% ring keeps both\r\n  signals at 7.16 dark and 4.72 light. \u003ccode>DD-013\u003c/code>.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Every value on this card is measured\u003c/strong>, against all four surfaces &times;\r\n  three ramp steps &times; both modes, by\r\n  \u003ccode>packages/shared/src/theme/theme.test.ts\u003c/code> in \u003ccode>pnpm test\u003c/code>. Two of the\r\n  four original status colours were under the 4.5:1 floor when that sweep was first run\r\n  properly — success light at 4.14 and danger light at 3.85, both against the raised step\r\n  (\u003ccode>DD-012\u003c/code>). \u003ccode>G-21\u003c/code> closed 2026-08-19.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\status-colors.card.html","live":null},{"id":"surfaces-card-html","name":"Surfaces","description":"The neutral ramp in both modes, derived from the four surface characters of DESIGN.md §2.2 — all of which ship as root classes","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Surfaces\u003c/title>\r\n\u003cmeta name=\"description\" content=\"The neutral ramp in both modes, derived from the four surface characters of DESIGN.md §2.2 — all of which ship as root classes\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Card chrome uses literal px. The app defines no spacing tokens (see\r\n     tokens/spacing.css), so a card that used var(--space-4) would be\r\n     demonstrating something the system does not have. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}\r\n  .pane{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .pane h4{margin:0;padding:8px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;\r\n           text-transform:uppercase;color:var(--muted-foreground);border-bottom:1px solid var(--border)}\r\n  .stack{padding:12px;display:flex;flex-direction:column;gap:8px}\r\n  .swatch{display:flex;align-items:center;gap:10px;padding:10px 12px;\r\n          border:1px solid var(--border);border-radius:var(--radius-md);font-size:12px}\r\n  .name{font-weight:600}\r\n  .val{margin-left:auto;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .gap{margin-top:12px;padding:12px;border:1px dashed var(--border);\r\n       border-radius:var(--radius-md);font-size:12px;line-height:1.6;color:var(--muted-foreground)}\r\n  .gap strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"modes\">\r\n  \u003cdiv class=\"pane\">\u003ch4>Dark — ships\u003c/h4>\r\n    \u003cdiv class=\"stack\" style=\"background:oklch(0.145 0 0);color:oklch(0.985 0 0)\">\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.145 0 0)\">\u003cspan class=\"name\">background\u003c/span>\u003cspan class=\"val\">0.145\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.205 0 0)\">\u003cspan class=\"name\">card\u003c/span>\u003cspan class=\"val\">0.205\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.269 0 0)\">\u003cspan class=\"name\">muted / accent\u003c/span>\u003cspan class=\"val\">0.269\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.205 0 0)\">\u003cspan class=\"name\">popover\u003c/span>\u003cspan class=\"val\">0.205\u003c/span>\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n  \u003cdiv class=\"pane\">\u003ch4>Light\u003c/h4>\r\n    \u003cdiv class=\"stack\" style=\"background:oklch(1 0 0);color:oklch(0.145 0 0)\">\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">background\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">card\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.97 0 0)\">\u003cspan class=\"name\">muted / accent\u003c/span>\u003cspan class=\"val\">0.97\u003c/span>\u003c/div>\r\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">popover\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  Chroma is \u003cstrong>0\u003c/strong> on every neutral above. The ramp is pure greyscale in both\r\n  modes — no warmth, no cast. Dark mode is a \u003ccode>.dark\u003c/code> class, not a media query,\r\n  so \u003ccode>:root\u003c/code> is light and the app overrides to dark.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Light mode used to have no surface ramp.\u003c/strong> \u003ccode>background\u003c/code>,\r\n  \u003ccode>card\u003c/code>, and \u003ccode>popover\u003c/code> were all \u003ccode>oklch(1 0 0)\u003c/code> — the same\r\n  pure white — so a light-mode surface separated only by its borders. \u003cstrong>Fixed\r\n  2026-08-19.\u003c/strong> Light now runs 0.985 / 1.0 / 0.955 and dark runs 0.145 / 0.195 /\r\n  0.245, both derived rather than transcribed, so every mode has three real steps.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"rule\">\r\n  \u003cstrong>Four surface characters, all real.\u003c/strong> \u003ccode>DESIGN.md\u003c/code> §2.2 defines\r\n  Paper (hue 85, chroma 0.010), Slate (250, 0.011), Soft (280, 0.007) and Mono (0, 0), each\r\n  with a light and dark expression. All four ship as root classes — add\r\n  \u003ccode>surface-slate\u003c/code> to \u003ccode>&lt;html&gt;\u003c/code> and every neutral above re-derives.\r\n  The app defaults to Paper.\r\n  \u003cbr>\u003cbr>\r\n  Surface is orthogonal to brand: changing one does not move the other. And surface hue is\r\n  not a tuning lever — at chroma 0.010 a hue shift is below the threshold of visibility, so\r\n  if an accent needs more separation, move the brand hue instead (§2.3).\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"rule\">\r\n  \u003cstrong>These values are generated.\u003c/strong> They come from\r\n  \u003ccode>packages/shared/src/theme/tokens.ts\u003c/code> via the marked block in\r\n  \u003ccode>globals.css\u003c/code>. This card mirrors that block. \u003ccode>G-19\u003c/code> — the gap that\r\n  said §2 described a system the app did not have — closed 2026-08-19.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\surfaces.card.html","live":null},{"id":"type-scale-card-html","name":"Type scale","description":"DESIGN.md §3 specifies seven roles; the app has one font token and 97 arbitrary literal sizes","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Type scale\u003c/title>\r\n\u003cmeta name=\"description\" content=\"DESIGN.md §3 specifies seven roles; the app has one font token and 97 arbitrary literal sizes\">\r\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\r\n\u003c!-- Sizes below are LITERAL px on purpose: they are DESIGN.md §3's specified\r\n     scale, and no CSS token exists for any of them. Rendering them via\r\n     var(--text-body) would imply a token the app does not have. --\u003e\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:baseline;\r\n       padding:9px 0;border-bottom:1px solid var(--border)}\r\n  .row:last-of-type{border-bottom:0}\r\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\r\n       color:var(--muted-foreground)}\r\n  .lbl em{display:block;font-weight:400;letter-spacing:0;text-transform:none;\r\n          font-style:normal;margin-top:2px;opacity:.8}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  .warn{margin-top:12px;padding:12px;border:1px dashed var(--border);\r\n        border-radius:var(--radius-md);font-size:12px;line-height:1.6;color:var(--muted-foreground)}\r\n  .warn strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Display\u003cem>28px / 650\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:28px;font-weight:650;line-height:1.15\">Machines\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Headline\u003cem>17px / 650\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:17px;font-weight:650;line-height:1.3\">Runtime health\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Title\u003cem>15px / 600\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:15px;font-weight:600;line-height:1.35\">workshop-desktop\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Body\u003cem>13px / 400\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:13px;line-height:1.6\">Default. Prose, descriptions, and agent output.\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Meta\u003cem>12px / 400\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:12px;line-height:1.45;color:var(--muted-foreground)\">Last seen 4 minutes ago\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Label\u003cem>11px / 700\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\r\n              color:var(--muted-foreground)\">Column heading\u003c/div>\u003c/div>\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Mono\u003cem>12px / 400\u003c/em>\u003c/div>\r\n  \u003cdiv style=\"font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\">\r\n    refs/sparstrow/wip/a91f\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  Tuned \u003cstrong>denser than shadcn&rsquo;s defaults\u003c/strong> — 13px body rather than 14px —\r\n  because this is a monitoring surface, read in long sittings and scanned rather than read.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"warn\">\r\n  \u003cstrong>Every size above is a literal in this card, not a token.\u003c/strong>\r\n  \u003ccode>DESIGN.md\u003c/code> §3 says so itself: the scale is &ldquo;a new decision, not mirrored\r\n  from the app&rdquo;. The only typography token that exists is \u003ccode>--font-sans\u003c/code>.\r\n  There is no \u003ccode>--font-mono\u003c/code> either — the mono row above uses the raw stack §3\r\n  names.\r\n  \u003cbr>\u003cbr>\r\n  In the codebase, sizes come from Tailwind steps (\u003ccode>text-xs\u003c/code>,\r\n  \u003ccode>text-sm\u003c/code>) or arbitrary literals: the 2026-08-19 slop audit counted\r\n  \u003cstrong>97\u003c/strong> uses of \u003ccode>text-[10px]\u003c/code> / \u003ccode>text-[11px]\u003c/code>, several\r\n  of them below the 11px floor this scale defines. Sweeping them is deliberately\r\n  \u003cem>not\u003c/em> in \u003ccode>doc/tasks/D1/\u003c/code> — there is nothing to sweep them onto until the\r\n  scale ships as CSS. Adding the tokens here first would invent them, which is\r\n  \u003ccode>doc/KnownGaps.md\u003c/code> G-18.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\type-scale.card.html","live":null}]},{"section":"Components","group":"Badges","cards":[{"id":"badges-badge-card-html","name":"Badge","description":"Seven variants — including the three status ones call sites keep hand-rolling instead","section":"Components","group":"Badges","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/badges/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Badge\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Seven variants — including the three status ones call sites keep hand-rolling instead\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;\r\n       padding:12px 0;border-bottom:1px solid var(--border)}\r\n  .row:last-of-type{border-bottom:0}\r\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\r\n       color:var(--muted-foreground)}\r\n  .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\r\n  .b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;\r\n     font-size:11px;font-weight:600;border:1px solid transparent}\r\n  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}\r\n  .default{background:var(--primary);color:var(--primary-foreground)}\r\n  .secondary{background:var(--secondary);color:var(--secondary-foreground)}\r\n  .destructive{background:var(--destructive);color:var(--destructive-foreground)}\r\n  .outline{color:var(--foreground);border-color:var(--border)}\r\n  .success{background:var(--success);color:var(--success-foreground)}\r\n  .info{background:var(--info);color:var(--info-foreground)}\r\n  .warning{background:var(--warning);color:var(--warning-foreground)}\r\n  .rolled{background:transparent;color:#d97706;border-color:rgb(245 158 11 / .4)}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Neutral\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cspan class=\"b default\">default\u003c/span>\r\n  \u003cspan class=\"b secondary\">secondary\u003c/span>\r\n  \u003cspan class=\"b outline\">outline\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Status\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cspan class=\"b success\">\u003ci class=\"dot\">\u003c/i>online\u003c/span>\r\n  \u003cspan class=\"b warning\">\u003ci class=\"dot\">\u003c/i>needs attention\u003c/span>\r\n  \u003cspan class=\"b info\">\u003ci class=\"dot\">\u003c/i>queued\u003c/span>\r\n  \u003cspan class=\"b destructive\">\u003ci class=\"dot\">\u003c/i>failed\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Hand-rolled\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cspan class=\"b rolled\">needs attention\u003c/span>\r\n  \u003cspan class=\"b warning\">needs attention\u003c/span>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Those last two are the same intent, built two ways.\u003c/strong> The left one is the\r\n  pattern found across the app on 2026-08-19 &mdash;\r\n  \u003ccode>border-amber-500/40 text-amber-600 dark:text-amber-400\u003c/code> at the call site,\r\n  three classes and a mode pair maintained by hand. The right one is\r\n  \u003ccode>&lt;Badge variant=\"warning\"&gt;\u003c/code>, which has existed the whole time.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  This is why the palette sweep in \u003ccode>doc/tasks/D1/\u003c/code> is not cosmetic: the component\r\n  already exposes \u003ccode>success\u003c/code>, \u003ccode>info\u003c/code>, and \u003ccode>warning\u003c/code>, so every\r\n  hand-rolled status badge is a call site that bypassed a correct API and now owns its own\r\n  light and dark values forever.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Badge carries state, never brand.\u003c/strong> A badge tinted with the user accent\r\n  says nothing &mdash; brand is identity, status is meaning, and mixing them is the one rule\r\n  \u003ccode>DESIGN.md\u003c/code> §2 calls load-bearing.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Badge — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/badge.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Badge variant=&quot;warning&quot;&gt;needs attention&lt;/Badge&gt;\u003c/code>\u003c/pre>\n\u003cp>Variants: \u003ccode>default\u003c/code> \u003ccode>secondary\u003c/code> \u003ccode>destructive\u003c/code> \u003ccode>outline\u003c/code> \u003ccode>success\u003c/code> \u003ccode>info\u003c/code> \u003ccode>warning\u003c/code>.\u003c/p>\n\u003ch2>The rule that gets broken\u003c/h2>\n\u003cp>\u003cstrong>Use the status variant. Do not hand-roll one.\u003c/strong> \u003ccode>success\u003c/code>, \u003ccode>info\u003c/code>, and \u003ccode>warning\u003c/code> already exist and already carry both modes. A call site writing \u003ccode>border-amber-500/40 text-amber-600 dark:text-amber-400\u003c/code> is re-implementing \u003ccode>variant=&quot;warning&quot;\u003c/code> badly, and then owns those values forever. The 2026-08-19 audit found this pattern across 23 files; the sweep is \u003ccode>doc/tasks/D1/\u003c/code>.\u003c/p>\n\u003ch2>Choosing\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>success\u003c/code>\u003c/td>\u003ctd>Online, passed, connected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>warning\u003c/code>\u003c/td>\u003ctd>Needs a human — blocked or degraded\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\u003ctd>Queued, informational, no action implied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Failed, revoked, errored\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code> / \u003ccode>outline\u003c/code>\u003c/td>\u003ctd>A label, not a state\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Badges carry status, never brand.\u003c/strong> Brand is identity; status is meaning.\u003c/li>\n\u003cli>\u003cstrong>A badge is not a button.\u003c/strong> No click handlers. If it acts, it is a Button.\u003c/li>\n\u003cli>\u003cstrong>Colour is never the only signal.\u003c/strong> Pair with the word, as every example on the card does. A colour-blind user reading a grid of dots learns nothing.\u003c/li>\n\u003cli>\u003cstrong>Approval has no variant yet.\u003c/strong> \u003ccode>DESIGN.md\u003c/code> §2.4 specifies it (hue 310); it is not built. Until it is, do not approximate it with \u003ccode>warning\u003c/code> — that is the exact collapse the doctrine argues against.\u003c/li>\n\u003c/ul>","promptPath":"components\\badges\\badge.prompt.md","cardPath":"components\\badges\\badge.card.html","live":null}]},{"section":"Components","group":"Buttons","cards":[{"id":"buttons-button-card-html","name":"Button","description":"Six variants, four sizes — with the hover, focus-visible, and disabled states a prop table cannot show","section":"Components","group":"Buttons","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/buttons/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Button\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Six variants, four sizes — with the hover, focus-visible, and disabled states a prop table cannot show\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .row{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;\r\n       padding:12px 0;border-bottom:1px solid var(--border)}\r\n  .row:last-of-type{border-bottom:0}\r\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\r\n       color:var(--muted-foreground)}\r\n  .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\r\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;\r\n       height:36px;padding:0 16px;border:0;border-radius:var(--radius-md);\r\n       font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;\r\n       transition:background-color .15s ease-out,color .15s ease-out}\r\n  .btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}\r\n  .btn:disabled{opacity:.5;pointer-events:none}\r\n  .default{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\r\n  .default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}\r\n  .destructive{background:var(--destructive);color:var(--destructive-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\r\n  .outline{background:var(--background);color:var(--foreground);border:1px solid var(--border);box-shadow:0 1px 2px rgb(0 0 0/.05)}\r\n  .outline:hover{background:var(--accent);color:var(--accent-foreground)}\r\n  .secondary{background:var(--secondary);color:var(--secondary-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\r\n  .ghost{background:transparent;color:var(--foreground)}\r\n  .ghost:hover{background:var(--accent);color:var(--accent-foreground)}\r\n  .link{background:transparent;color:var(--primary);text-underline-offset:4px}\r\n  .link:hover{text-decoration:underline}\r\n  .sm{height:32px;padding:0 12px;font-size:12px;border-radius:var(--radius-md)}\r\n  .lg{height:40px;padding:0 32px;border-radius:var(--radius-md)}\r\n  .icon{height:36px;width:36px;padding:0}\r\n  .forced{outline:2px solid var(--ring);outline-offset:2px}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Variants\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cbutton class=\"btn default\">Run agent\u003c/button>\r\n  \u003cbutton class=\"btn secondary\">Secondary\u003c/button>\r\n  \u003cbutton class=\"btn outline\">Outline\u003c/button>\r\n  \u003cbutton class=\"btn ghost\">Ghost\u003c/button>\r\n  \u003cbutton class=\"btn destructive\">Delete\u003c/button>\r\n  \u003cbutton class=\"btn link\">Link\u003c/button>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Sizes\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cbutton class=\"btn default sm\">sm &middot; 32px\u003c/button>\r\n  \u003cbutton class=\"btn default\">default &middot; 36px\u003c/button>\r\n  \u003cbutton class=\"btn default lg\">lg &middot; 40px\u003c/button>\r\n  \u003cbutton class=\"btn default icon\" aria-label=\"Icon\">&#9679;\u003c/button>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">States\u003c/div>\u003cdiv class=\"set\">\r\n  \u003cbutton class=\"btn default\">Rest\u003c/button>\r\n  \u003cbutton class=\"btn default forced\">Focus-visible\u003c/button>\r\n  \u003cbutton class=\"btn default\" disabled>Disabled\u003c/button>\r\n  \u003cbutton class=\"btn outline\" disabled>Disabled outline\u003c/button>\r\n\u003c/div>\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Hover is live\u003c/strong> — put the cursor on any variant above. Focus-visible is\r\n  forced on the third button in the States row so the ring is comparable without tabbing;\r\n  in the real component it appears only on keyboard focus, never on mouse click.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Shadow is per-variant, not global.\u003c/strong> \u003ccode>default\u003c/code>,\r\n  \u003ccode>destructive\u003c/code>, \u003ccode>outline\u003c/code>, and \u003ccode>secondary\u003c/code> carry a small\r\n  shadow; \u003ccode>ghost\u003c/code> and \u003ccode>link\u003c/code> deliberately do not — they are meant to\r\n  sit inside dense rows without stacking depth. There are no shadow tokens, so this is a\r\n  Tailwind \u003ccode>shadow-sm\u003c/code> at each call site.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Button — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/button.tsx\u003c/code>. Mirror mode — this card documents that file, it does not reimplement it.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Button } from &quot;@sparstrow/ui&quot;;\n&lt;Button variant=&quot;destructive&quot; size=&quot;sm&quot;&gt;Delete&lt;/Button&gt;\u003c/code>\u003c/pre>\n\u003ch2>Choosing a variant\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Use for\u003c/th>\u003cth>Not for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>default\u003c/code>\u003c/td>\u003ctd>The one primary action on a surface\u003c/td>\u003ctd>Two of them on the same screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code>\u003c/td>\u003ctd>A real alternative to the primary action\u003c/td>\u003ctd>Anything destructive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>outline\u003c/code>\u003c/td>\u003ctd>Actions in a toolbar or row where none dominates\u003c/td>\u003ctd>The main call to action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ghost\u003c/code>\u003c/td>\u003ctd>Dense rows and icon actions, where a border would add noise\u003c/td>\u003ctd>Anything the user must find quickly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Delete, revoke, stop — irreversible or disruptive\u003c/td>\u003ctd>Merely &quot;cancel&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>link\u003c/code>\u003c/td>\u003ctd>Navigation dressed as text\u003c/td>\u003ctd>Anything that mutates state\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>One \u003ccode>default\u003c/code> per surface.\u003c/strong> More than one and neither reads as primary.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>asChild\u003c/code> for navigation.\u003c/strong> Wrapping a \u003ccode>Link\u003c/code> in a Button breaks keyboard and middle-click behaviour; \u003ccode>asChild\u003c/code> keeps the anchor semantics.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>size=&quot;icon&quot;\u003c/code> needs an accessible name.\u003c/strong> It has no text, so pass \u003ccode>aria-label\u003c/code>. An icon button with no label is invisible to a screen reader.\u003c/li>\n\u003cli>\u003cstrong>Never restyle a variant at the call site.\u003c/strong> A \u003ccode>className\u003c/code> that changes the background is a new variant that only exists on one screen — add it to \u003ccode>button.tsx\u003c/code> or use an existing one.\u003c/li>\n\u003cli>\u003cstrong>Disabled is not an explanation.\u003c/strong> A disabled button with no adjacent reason reads as broken. Say why, or leave it enabled and fail with a message.\u003c/li>\n\u003c/ul>\n\u003ch2>Gaps worth knowing\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>No loading state.\u003c/strong> There is no \u003ccode>loading\u003c/code> prop and no spinner slot. Async actions currently disable the button and change nothing else, so a slow run looks identical to an ignored click. Handle it at the call site until the component grows one.\u003c/li>\n\u003cli>\u003cstrong>Shadows are Tailwind utilities\u003c/strong>, not tokens — see \u003ccode>tokens/spacing.css\u003c/code>.\u003c/li>\n\u003c/ul>","promptPath":"components\\buttons\\button.prompt.md","cardPath":"components\\buttons\\button.card.html","live":null}]},{"section":"Components","group":"Forms","cards":[{"id":"forms-input-card-html","name":"Input","description":"Rest, focus, invalid, and disabled — plus the labelling mistake placeholders invite","section":"Components","group":"Forms","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/forms/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Input\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Rest, focus, invalid, and disabled — plus the labelling mistake placeholders invite\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}\r\n  .f{display:flex;flex-direction:column;gap:5px}\r\n  .lb{font-size:11px;font-weight:600;color:var(--foreground)}\r\n  .in{height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-md);\r\n      background:var(--background);color:var(--foreground);font-family:inherit;font-size:13px;width:100%;\r\n      box-sizing:border-box}\r\n  .in::placeholder{color:var(--muted-foreground)}\r\n  .in:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:var(--ring)}\r\n  .focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:var(--ring)}\r\n  .bad{border-color:var(--destructive)}\r\n  .msg{font-size:11px;color:var(--destructive)}\r\n  .hint{font-size:11px;color:var(--muted-foreground)}\r\n  .in:disabled{opacity:.5;cursor:not-allowed}\r\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"grid\">\r\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"a\">Machine name\u003c/label>\r\n    \u003cinput class=\"in\" id=\"a\" placeholder=\"workshop-desktop\">\u003c/div>\r\n\r\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"b\">Machine name &middot; focus\u003c/label>\r\n    \u003cinput class=\"in focus\" id=\"b\" value=\"workshop-desktop\">\u003c/div>\r\n\r\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"c\">Machine name &middot; invalid\u003c/label>\r\n    \u003cinput class=\"in bad\" id=\"c\" value=\"workshop desktop\" aria-invalid=\"true\" aria-describedby=\"e\">\r\n    \u003cdiv class=\"msg\" id=\"e\">Use a hyphen instead of a space.\u003c/div>\u003c/div>\r\n\r\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"d\">Machine name &middot; disabled\u003c/label>\r\n    \u003cinput class=\"in\" id=\"d\" value=\"workshop-desktop\" disabled>\r\n    \u003cdiv class=\"hint\">Locked while the machine is online.\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Focus is forced on the second field\u003c/strong> so the ring is comparable without\r\n  tabbing. Click into the first to see the real behaviour &mdash; the ring is inset\r\n  (\u003ccode>outline-offset:-1px\u003c/code>) so it does not push adjacent rows in a dense form.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>The invalid field is the one worth studying.\u003c/strong> Red border, plus\r\n  \u003ccode>aria-invalid\u003c/code>, plus a message that says what to do &mdash; and\r\n  \u003ccode>aria-describedby\u003c/code> tying them together, which is what makes a screen reader\r\n  read the message when focus lands. A red border on its own passes a glance and fails a\r\n  user.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Every field above has a real \u003ccode>Label\u003c/code>.\u003c/strong> The placeholder in the\r\n  first is example content, not the label &mdash; it vanishes the moment someone types, which\r\n  is exactly when they most need to know what the field was.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Disabled says why.\u003c/strong> A greyed field with no adjacent reason reads as broken\r\n  rather than intentional.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Input — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/input.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Input placeholder=&quot;workshop-desktop&quot; aria-invalid={!!error} /&gt;\u003c/code>\u003c/pre>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Always label it.\u003c/strong> Use \u003ccode>Label\u003c/code> with \u003ccode>htmlFor\u003c/code>, or \u003ccode>aria-label\u003c/code> when the design genuinely has no room. A placeholder is not a label: it disappears exactly when the user needs it, and fails every accessibility check.\u003c/li>\n\u003cli>\u003cstrong>Error state is \u003ccode>aria-invalid\u003c/code>,\u003c/strong> not a red border added at the call site. The component styles the invalid state; a hand-added border is not announced to a screen reader.\u003c/li>\n\u003cli>\u003cstrong>Say what is wrong, below the field, in words.\u003c/strong> A red outline alone tells the user something is wrong, not what.\u003c/li>\n\u003cli>\u003cstrong>Derive validation from the Zod schema\u003c/strong> that already defines the contract, rather than hand-rolling a parallel check that can drift from it. See the \u003ccode>frontend-wiring\u003c/code> skill.\u003c/li>\n\u003c/ul>\n\u003ch2>Gap\u003c/h2>\n\u003cp>There is no \u003ccode>InputGroup\u003c/code>, no prefix/suffix slot, and no built-in error text element. Forms that need those compose them at the call site today, which is why field spacing varies between screens.\u003c/p>","promptPath":"components\\forms\\input.prompt.md","cardPath":"components\\forms\\input.card.html","live":null}]},{"section":"Components","group":"States","cards":[{"id":"states-empty-card-html","name":"Empty","description":"The screen a new user sees first — a good empty state next to the bare one it replaces","section":"Components","group":"States","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/states/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Empty\u003c/title>\r\n\u003cmeta name=\"description\" content=\"The screen a new user sees first — a good empty state next to the bare one it replaces\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}\r\n  .frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .cap{padding:7px 12px;font-size:10.5px;font-weight:600;letter-spacing:.05em;\r\n       text-transform:uppercase;border-bottom:1px solid var(--border)}\r\n  .bad .cap{color:var(--destructive)}\r\n  .good .cap{color:var(--success-foreground);background:var(--success)}\r\n  .body{padding:32px 20px;text-align:center;background:var(--background);min-height:150px;\r\n        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}\r\n  .media{width:40px;height:40px;border-radius:var(--radius-md);background:var(--muted);\r\n         display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}\r\n  .title{font-size:15px;font-weight:600}\r\n  .desc{font-size:13px;line-height:1.6;color:var(--muted-foreground);max-width:34ch}\r\n  .cta{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--radius-md);\r\n       background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500}\r\n  .flat{font-size:13px;color:var(--muted-foreground)}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"pair\">\r\n  \u003cdiv class=\"frame bad\">\u003cdiv class=\"cap\">Not this\u003c/div>\r\n    \u003cdiv class=\"body\">\u003cdiv class=\"flat\">No items.\u003c/div>\u003c/div>\u003c/div>\r\n  \u003cdiv class=\"frame good\">\u003cdiv class=\"cap\">This\u003c/div>\r\n    \u003cdiv class=\"body\">\r\n      \u003cdiv class=\"media\">&#9633;\u003c/div>\r\n      \u003cdiv class=\"title\">No machines paired yet\u003c/div>\r\n      \u003cdiv class=\"desc\">Pair a machine to give your agents somewhere to run. It takes about a minute.\u003c/div>\r\n      \u003cdiv class=\"cta\">Pair a machine\u003c/div>\r\n    \u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>The empty state is the first screen a new user sees\u003c/strong>, and the most often\r\n  skipped of the four. The left frame is what a surface ships with when nobody wrote one:\r\n  technically correct, and it tells a new user nothing about what this page is for or how to\r\n  make it do something.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  The parts are \u003ccode>Empty\u003c/code> &rsaquo; \u003ccode>EmptyHeader\u003c/code> &rsaquo;\r\n  \u003ccode>EmptyMedia\u003c/code> &middot; \u003ccode>EmptyTitle\u003c/code> &middot;\r\n  \u003ccode>EmptyDescription\u003c/code> &rsaquo; \u003ccode>EmptyContent\u003c/code>. The rule that matters is\r\n  in the last slot: \u003cstrong>the copy explains what to do next, and the action that does it\r\n  is right there.\u003c/strong> A description ending in advice the user cannot act on from this\r\n  screen is half a state.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Empty — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/empty.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Empty, EmptyHeader, EmptyMedia, EmptyTitle, EmptyDescription, EmptyContent } from &quot;@sparstrow/ui&quot;;\u003c/code>\u003c/pre>\n\u003cp>Parts: \u003ccode>Empty\u003c/code> &gt; \u003ccode>EmptyHeader\u003c/code> &gt; \u003ccode>EmptyMedia\u003c/code> / \u003ccode>EmptyTitle\u003c/code> / \u003ccode>EmptyDescription\u003c/code>\u003c/p>\n\u003cblockquote>\u003ccode>EmptyContent\u003c/code>. \u003ccode>emptyMediaVariants\u003c/code> controls the icon frame.\u003c/blockquote>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Never ship a bare &quot;No items.&quot;\u003c/strong> Copy says what this surface is for, and what to do to fill it.\u003c/li>\n\u003cli>\u003cstrong>The action goes in \u003ccode>EmptyContent\u003c/code>, on this screen.\u003c/strong> A description telling the user to go elsewhere is half a state.\u003c/li>\n\u003cli>\u003cstrong>Empty is not error.\u003c/strong> Nothing here yet, versus we could not load it. An empty state shown after a failed fetch is a lie the user acts on.\u003c/li>\n\u003cli>\u003cstrong>Empty is not loading.\u003c/strong> Use \u003ccode>Skeleton\u003c/code> while data is in flight; an empty state that flashes before data arrives reads as data loss.\u003c/li>\n\u003c/ul>\n\u003ch2>Where it belongs\u003c/h2>\n\u003cp>Every list, table, and panel — no exceptions. A surface with only its populated state is not finished. This is enforced by the four-states requirement in the \u003ccode>frontend-wiring\u003c/code> skill and graded in every task's definition of done.\u003c/p>","promptPath":"components\\states\\empty.prompt.md","cardPath":"components\\states\\empty.card.html","live":null},{"id":"states-skeleton-card-html","name":"Skeleton","description":"Shaped like the content it stands in for — beside the generic block that is not","section":"Components","group":"States","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/states/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Skeleton\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Shaped like the content it stands in for — beside the generic block that is not\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n
