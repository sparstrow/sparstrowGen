 .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}\r\n  .frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\r\n  .cap{padding:7px 12px;font-size:10.5px;font-weight:600;letter-spacing:.05em;\r\n       text-transform:uppercase;border-bottom:1px solid var(--border);color:var(--muted-foreground)}\r\n  .body{padding:14px;background:var(--background);min-height:132px}\r\n  @keyframes spg-pulse{0%,100%{opacity:.25}50%{opacity:1}}\r\n  .sk{background:var(--muted);border-radius:var(--radius-md);animation:spg-pulse 1s ease-in-out infinite}\r\n  .rowi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}\r\n  .rowi:last-child{border-bottom:0}\r\n  .real{font-size:13px}\r\n  .sub{font-size:11px;color:var(--muted-foreground);margin-top:2px}\r\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"pair\">\r\n  \u003cdiv class=\"frame\">\u003cdiv class=\"cap\">Generic block &mdash; promises nothing\u003c/div>\r\n    \u003cdiv class=\"body\">\u003cdiv class=\"sk\" style=\"height:104px\">\u003c/div>\u003c/div>\u003c/div>\r\n\r\n  \u003cdiv class=\"frame\">\u003cdiv class=\"cap\">Shaped like the row it replaces\u003c/div>\r\n    \u003cdiv class=\"body\">\r\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\r\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:44%\">\u003c/div>\r\n          \u003cdiv class=\"sk\" style=\"height:9px;width:26%;margin-top:6px\">\u003c/div>\u003c/div>\r\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\r\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:56%\">\u003c/div>\r\n          \u003cdiv class=\"sk\" style=\"height:9px;width:22%;margin-top:6px\">\u003c/div>\u003c/div>\r\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\r\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:38%\">\u003c/div>\r\n          \u003cdiv class=\"sk\" style=\"height:9px;width:30%;margin-top:6px\">\u003c/div>\u003c/div>\r\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\r\n    \u003c/div>\u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>The right frame is the whole component in one idea.\u003c/strong> Same three-line\r\n  primitive, sized per element — avatar, name, subtitle, status chip — so the layout does not\r\n  move when the real rows arrive. The left frame loads for the same duration and tells the\r\n  user nothing about what is coming.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Skeleton, not a spinner\u003c/strong>, wherever the shape is knowable. A spinner says\r\n  something is happening; a skeleton says what. Both frames animate with the real\r\n  \u003ccode>spg-pulse\u003c/code> keyframe from globals.css &mdash; 1s ease-in-out, infinite.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Nothing here respects \u003ccode>prefers-reduced-motion\u003c/code>\u003c/strong>, because\r\n  nothing in the app does &mdash; verified 2026-08-19. On a page of skeletons that is a lot of\r\n  motion for a user who asked for none.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Skeleton — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/skeleton.tsx\u003c/code>. Mirror mode. The whole component is three lines: \u003ccode>animate-pulse rounded-md bg-muted\u003c/code> plus whatever \u003ccode>className\u003c/code> you pass.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Skeleton className=&quot;h-4 w-[220px]&quot; /&gt;\u003c/code>\u003c/pre>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Shape it like the content it stands in for.\u003c/strong> A skeleton is a promise about what is arriving; a generic grey block promises nothing and the layout jumps when the real content lands.\u003c/li>\n\u003cli>\u003cstrong>Skeleton, not a spinner,\u003c/strong> wherever the shape is knowable. A spinner says something is happening; a skeleton says what.\u003c/li>\n\u003cli>\u003cstrong>Match the row count you expect\u003c/strong>, roughly. Three skeleton rows resolving into eleven is its own small jolt.\u003c/li>\n\u003c/ul>\n\u003ch2>Known limitation\u003c/h2>\n\u003cp>\u003ccode>animate-pulse\u003c/code> is infinite and nothing in the app responds to \u003ccode>prefers-reduced-motion\u003c/code> — verified 2026-08-19, no match anywhere in \u003ccode>packages/ui/src\u003c/code> or \u003ccode>apps/web/src\u003c/code>. On a page full of skeletons that is a lot of unstoppable motion for a user who asked for none.\u003c/p>\n\u003cp>Note this is also why a \u003ccode>pulsing-dot\u003c/code> slop finding on this file is a false positive: the pulse here is a loading affordance, not an ambient decoration.\u003c/p>","promptPath":"components\\states\\skeleton.prompt.md","cardPath":"components\\states\\skeleton.card.html","live":null}]},{"section":"Components","group":"Surfaces","cards":[{"id":"surfaces-card-card-html","name":"Card","description":"The app","section":"Components","group":"Surfaces","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/surfaces/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Card\u003c/title>\r\n\u003cmeta name=\"description\" content=\"The app's one container — and the nesting that DESIGN.md and the slop catalogue both refuse\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:20px;background:var(--background);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:14px}\r\n  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}\r\n  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}\r\n  .hd{padding:14px 16px 0}\r\n  .ti{font-size:15px;font-weight:600}\r\n  .de{font-size:12px;color:var(--muted-foreground);margin-top:3px;line-height:1.5}\r\n  .ct{padding:12px 16px}\r\n  .ft{padding:0 16px 14px;display:flex;gap:8px}\r\n  .btn{height:30px;padding:0 12px;border-radius:var(--radius-md);border:0;font-size:12px;\r\n       font-weight:500;font-family:inherit;background:var(--primary);color:var(--primary-foreground)}\r\n  .btn.g{background:transparent;color:var(--foreground);border:1px solid var(--border)}\r\n  .rowi{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;\r\n        border-bottom:1px solid var(--border)}\r\n  .rowi:last-child{border-bottom:0}\r\n  .rowi span:last-child{color:var(--muted-foreground)}\r\n  .cap{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\r\n       margin-bottom:8px;color:var(--muted-foreground)}\r\n  .bad .cap{color:var(--destructive)}\r\n  .inner{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);\r\n         padding:10px 12px;margin-top:8px;font-size:12px}\r\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\r\n  .note strong{color:var(--foreground)}\r\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\r\n\u003c/style>\u003c/head>\u003cbody>\r\n\r\n\u003cdiv class=\"pair\">\r\n  \u003cdiv>\r\n    \u003cdiv class=\"cap\">Card\u003c/div>\r\n    \u003cdiv class=\"card\">\r\n      \u003cdiv class=\"hd\">\u003cdiv class=\"ti\">workshop-desktop\u003c/div>\r\n        \u003cdiv class=\"de\">Windows 11 &middot; last seen 4 minutes ago\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"ct\">\r\n        \u003cdiv class=\"rowi\">\u003cspan>Agents\u003c/span>\u003cspan>3 idle\u003c/span>\u003c/div>\r\n        \u003cdiv class=\"rowi\">\u003cspan>Runs today\u003c/span>\u003cspan>17\u003c/span>\u003c/div>\r\n        \u003cdiv class=\"rowi\">\u003cspan>Snapshots\u003c/span>\u003cspan>On\u003c/span>\u003c/div>\r\n      \u003c/div>\r\n      \u003cdiv class=\"ft\">\u003cbutton class=\"btn\">Open\u003c/button>\u003cbutton class=\"btn g\">Revoke\u003c/button>\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\r\n  \u003cdiv class=\"bad\">\r\n    \u003cdiv class=\"cap\">Not this &mdash; nested cards\u003c/div>\r\n    \u003cdiv class=\"card\">\r\n      \u003cdiv class=\"hd\">\u003cdiv class=\"ti\">workshop-desktop\u003c/div>\u003c/div>\r\n      \u003cdiv class=\"ct\">\r\n        \u003cdiv class=\"inner\">Agents &middot; 3 idle\u003c/div>\r\n        \u003cdiv class=\"inner\">Runs today &middot; 17\u003c/div>\r\n        \u003cdiv class=\"inner\">Snapshots &middot; On\u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003cstrong>Same information, twice.\u003c/strong> The left card separates rows with a 1px divider\r\n  and nothing else. The right one wraps each row in its own bordered surface, which adds\r\n  three more edges, two more radii, and a second elevation level that means nothing &mdash;\r\n  and makes every row look independently clickable when none of them is.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  \u003ccode>nested-cards\u003c/code> is a \u003cstrong>certain\u003c/strong>-tier rule in\r\n  \u003ccode>ai-design-slop\u003c/code>: depth used as a substitute for hierarchy. Spacing, weight, and\r\n  dividers do this job without adding a surface. If rows need to be distinguishable, change\r\n  the type or the spacing &mdash; not the container.\r\n\u003c/div>\r\n\r\n\u003cdiv class=\"note\">\r\n  Parts are \u003ccode>Card\u003c/code> &rsaquo; \u003ccode>CardHeader\u003c/code> &rsaquo;\r\n  \u003ccode>CardTitle\u003c/code> &middot; \u003ccode>CardDescription\u003c/code> &rsaquo;\r\n  \u003ccode>CardContent\u003c/code> &rsaquo; \u003ccode>CardFooter\u003c/code>. Cards sit on\r\n  \u003ccode>--background\u003c/code> and are \u003ccode>--card\u003c/code> themselves &mdash; which in light mode\r\n  are currently the same white, so the border is doing all the separating. See the Surfaces\r\n  guideline.\r\n\u003c/div>\r\n\r\n\u003c/body>\u003c/html>\r\n","prompt":"\u003ch1>Card — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/card.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cp>Parts: \u003ccode>Card\u003c/code> &gt; \u003ccode>CardHeader\u003c/code> &gt; \u003ccode>CardTitle\u003c/code> / \u003ccode>CardDescription\u003c/code> &gt; \u003ccode>CardContent\u003c/code>\u003c/p>\n\u003cblockquote>\u003ccode>CardFooter\u003c/code>.\u003c/blockquote>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Never nest a Card in a Card.\u003c/strong> \u003ccode>nested-cards\u003c/code> is a certain-tier rule in the \u003ccode>ai-design-slop\u003c/code> catalogue: it is depth standing in for hierarchy. Use spacing, weight, and dividers instead. The card shows both versions side by side.\u003c/li>\n\u003cli>\u003cstrong>A card is a grouping, not a decoration.\u003c/strong> If the content inside has no relationship, the border is drawing a box around a coincidence.\u003c/li>\n\u003cli>\u003cstrong>Do not use a grid of identical cards as the page structure.\u003c/strong> That is \u003ccode>card-grid-as-structure\u003c/code> — the container that fits any content, and therefore says nothing about this content.\u003c/li>\n\u003cli>\u003cstrong>Cards do not stack elevation.\u003c/strong> There are no shadow tokens, and the app separates surfaces with \u003ccode>--border\u003c/code> plus a lightness step. In light mode there is no lightness step at all, so the border is load-bearing.\u003c/li>\n\u003c/ul>\n\u003ch2>Where it belongs\u003c/h2>\n\u003cp>Entity summaries, settings groups, and dialogs. Lists of rows are better as a table or a divided list than as a column of cards.\u003c/p>","promptPath":"components\\surfaces\\card.prompt.md","cardPath":"components\\surfaces\\card.card.html","live":null}]},{"section":"Designs","group":"Machines","cards":[{"id":"Machines-machines-card-html","name":"Machines","description":"Machines — US1: a first-class destination, all four states, from doc/specs/2026-08-16-setup-and-machines.md","section":"Designs","group":"Machines","html":"\u003c!doctype html>\r\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"designs/Machines/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Machines\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Machines — US1: a first-class destination, all four states, from doc/specs/2026-08-16-setup-and-machines.md\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body{margin:0;padding:var(--space-5);background:var(--card);color:var(--foreground);\r\n       font-family:var(--font-sans);font-size:13px}\r\n  h4{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}\r\n  .count{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;\r\n         border-radius:999px;background:var(--secondary);color:var(--secondary-foreground);font-size:10px;font-weight:600}\r\n  .sub{margin:0 0 var(--space-4);font-size:12px;color:var(--muted-foreground)}\r\n  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}\r\n  .row:last-child{border-bottom:0}\r\n  .dot{width:7px;height:7px;border-radius:999px;flex-shrink:0}\r\n  .dot.active{background:var(--success-foreground)}\r\n  .dot.inactive{background:color-mix(in oklab, var(--muted-foreground) 40%, transparent)}\r\n  /* entity tile — DESIGN.md §6 / DD-016: platform mark in place of plain-text OS */\r\n  .tile{position:relative;width:26px;height:26px;border-radius:var(--radius-md);background:var(--accent);\r\n        display:flex;align-items:center;justify-content:center;flex-shrink:0}\r\n  .tile .dot{position:absolute;left:-2px;bottom:-2px;box-shadow:0 0 0 2px var(--card)}\r\n  .name{font-size:12.5px;font-weight:500}\r\n  .meta{font-size:11px;color:var(--muted-foreground);margin-top:1px}\r\n  .bdg{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:var(--radius-sm);\r\n       background:var(--secondary);color:var(--secondary-foreground)}\r\n\u003c/style>\u003c/head>\r\n\u003cbody>\r\n\u003ch4>Machines \u003cspan class=\"count\">4\u003c/span>\u003c/h4>\r\n\u003cp class=\"sub\">First-class sidebar destination — pair, rename, revoke, remove.\u003c/p>\r\n\u003cdiv class=\"row\">\r\n  \u003cspan class=\"tile\" role=\"img\" aria-label=\"Windows\" title=\"Windows\">\r\n    \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\r\n      \u003crect x=\"2\" y=\"2\" width=\"9\" height=\"9\" fill=\"#0078D4\"/>\u003crect x=\"13\" y=\"2\" width=\"9\" height=\"9\" fill=\"#0078D4\"/>\r\n      \u003crect x=\"2\" y=\"13\" width=\"9\" height=\"9\" fill=\"#0078D4\"/>\u003crect x=\"13\" y=\"13\" width=\"9\" height=\"9\" fill=\"#0078D4\"/>\r\n    \u003c/svg>\r\n    \u003cspan class=\"dot active\">\u003c/span>\r\n  \u003c/span>\r\n  \u003cdiv>\u003cdiv class=\"name\">workshop-desktop\u003c/div>\u003cdiv class=\"meta\">online\u003c/div>\u003c/div>\r\n  \u003cspan class=\"bdg\">claude-code\u003c/span>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\r\n  \u003cspan class=\"tile\" role=\"img\" aria-label=\"macOS\" title=\"macOS\">\r\n    \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\" aria-hidden=\"true\">\r\n      \u003cpath d=\"M15.6 12.2c0-2.6 2.1-3.9 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.3 1.9 2.7 3.3 2.7 1.3-.1 1.8-.9 3.4-.9s2 .9 3.4.8c1.4 0 2.3-1.3 3.2-2.6.7-1 1.2-2 1.5-3.1-1.7-.6-2.1-2.9-2.1-3.8z\"/>\r\n      \u003cpath d=\"M13.2 4.6c.7-.9 1.2-2.1 1-3.3-1.1.1-2.4.8-3.1 1.7-.6.8-1.2 2-1 3.2 1.2.1 2.4-.7 3.1-1.6z\"/>\r\n    \u003c/svg>\r\n    \u003cspan class=\"dot active\">\u003c/span>\r\n  \u003c/span>\r\n  \u003cdiv>\u003cdiv class=\"name\">office-mac-mini\u003c/div>\u003cdiv class=\"meta\">online\u003c/div>\u003c/div>\r\n  \u003cspan class=\"bdg\">ollama\u003c/span>\r\n\u003c/div>\r\n\u003cdiv class=\"row\">\r\n  \u003cspan class=\"tile\" role=\"img\" aria-label=\"Linux\" title=\"Linux\">\r\n    \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\r\n      \u003cellipse cx=\"12\" cy=\"14.5\" rx=\"6\" ry=\"7.5\" fill=\"currentColor\"/>\r\n      \u003cellipse cx=\"9.3\" cy=\"14\" rx=\"2\" ry=\"3.2\" fill=\"var(--accent)\"/>\u003cellipse cx=\"14.7\" cy=\"14\" rx=\"2\" ry=\"3.2\" fill=\"var(--accent)\"/>\r\n      \u003ccircle cx=\"12\" cy=\"6.5\" r=\"3.3\" fill=\"currentColor\"/>\u003cpath d=\"M12 8.3 10.6 10.4h2.8z\" fill=\"#F5A623\"/>\r\n    \u003c/svg>\r\n    \u003cspan class=\"dot inactive\">\u003c/span>\r\n  \u003c/span>\r\n  \u003cdiv>\u003cdiv class=\"name\">build-server\u003c/div>\u003cdiv class=\"meta\">last seen 52m ago\u003c/div>\u003c/div>\r\n\u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"designs\\Machines\\machines.card.html","live":"designs\\Machines\\machines.dc.html"}]},{"section":"Designs","group":"Settings","cards":[{"id":"Settings-settings-redesign-card-html","name":"Settings Redesign","description":"Settings Redesign — 3-paradigm navigation prototype eliminating nested tabs","section":"Designs","group":"Settings","html":"\u003c!doctype html>\r\n\u003chtml>\u003chead>\u003cbase href=\"designs/Settings/\">\u003cmeta charset=\"utf-8\">\r\n\u003ctitle>Settings Redesign\u003c/title>\r\n\u003cmeta name=\"description\" content=\"Settings Redesign — 3-paradigm navigation prototype eliminating nested tabs\">\r\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\r\n\u003cstyle>\r\n  body { margin:0; padding:var(--space-4,16px); background:var(--card,#161618); color:var(--foreground,#f4f4f5);\r\n         font-family:var(--font-sans,system-ui); font-size:13px; }\r\n  .preview-wrap { display:grid; grid-template-columns:90px 1fr; gap:12px; border:1px solid var(--border);\r\n                  border-radius:var(--radius-md); padding:10px; background:var(--background); }\r\n  .mini-nav { display:flex; flex-direction:column; gap:4px; border-right:1px solid var(--border); padding-right:8px; }\r\n  .mini-item { font-size:10px; padding:3px 6px; border-radius:4px; color:var(--muted-foreground); }\r\n  .mini-item.active { background:var(--card); color:var(--foreground); font-weight:600; }\r\n  .mini-cards { display:flex; flex-direction:column; gap:6px; }\r\n  .mini-card { background:var(--card); border:1px solid var(--border); border-radius:4px; height:24px; }\r\n\u003c/style>\u003c/head>\r\n\u003cbody>\r\n  \u003cdiv class=\"preview-wrap\">\r\n    \u003cdiv class=\"mini-nav\">\r\n      \u003cdiv class=\"mini-item active\">Profile\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Theme\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Git\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Workspace\u003c/div>\r\n      \u003cdiv class=\"mini-item\">Providers\u003c/div>\r\n    \u003c/div>\r\n    \u003cdiv class=\"mini-cards\">\r\n      \u003cdiv class=\"mini-card\" style=\"width: 80%;\">\u003c/div>\r\n      \u003cdiv class=\"mini-card\" style=\"width: 100%;\">\u003c/div>\r\n      \u003cdiv class=\"mini-card\" style=\"width: 60%;\">\u003c/div>\r\n    \u003c/div>\r\n  \u003c/div>\r\n\u003c/body>\u003c/html>\r\n","prompt":null,"promptPath":null,"cardPath":"designs\\Settings\\settings-redesign.card.html","live":"designs\\Settings\\settings-redesign.dc.html"}]}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("payload").textContent);
  const navTree = document.getElementById("nav-tree");
  const cardsEl = document.getElementById("cards");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  document.getElementById("readme").innerHTML = data.readme || "";
  const total = data.sections.reduce((n, s) => n + s.cards.length, 0);
  document.getElementById("meta").textContent =
    `${total} cards · ${data.mode} mode` + (data.generatedAt ? ` · built ${data.generatedAt.slice(0,10)}` : "");

  // Group the flat section list by its section label so the rail reads
  // Foundations → Components → Designs, each with its own subgroups.
  const bySection = new Map();
  for (const g of data.sections) {
    if (!bySection.has(g.section)) bySection.set(g.section, []);
    bySection.get(g.section).push(g);
  }

  let navHtml = "", cardsHtml = "";
  for (const [section, groups] of bySection) {
    cardsHtml += `<div class="section-label">${esc(section)}</div>`;
    for (const g of groups) {
      navHtml += `<div class="nav-group" data-group="${esc(g.group)}">
        <button class="nav-head"><span class="chev">▾</span>${esc(g.group)}</button>
        <div class="nav-items">${g.cards.map((c) =>
          `<a href="#${esc(c.id)}" data-target="${esc(c.id)}">${esc(c.name)}</a>`).join("")}</div>
      </div>`;

      for (const c of g.cards) {
        const live = c.live
          ? `<a class="btn" href="${esc(c.live)}" target="_blank" rel="noopener">Open live ↗</a>` : "";
        const notes = c.prompt
          ? `<details class="notes"><summary>Usage notes for Claude</summary>
               <div class="notes-body">${c.prompt}</div></details>` : "";
        cardsHtml += `<section class="card-block" id="${esc(c.id)}" data-name="${esc(c.name.toLowerCase())}">
          <div class="card-head">
            <div>
              <div class="card-title">${esc(c.name)}</div>
              ${c.description ? `<div class="card-desc">${esc(c.description)}</div>` : ""}
            </div>
            <div class="card-actions">${live}</div>
          </div>
          <div class="frame-shell"><iframe data-card="${esc(c.id)}" loading="lazy" title="${esc(c.name)}"></iframe></div>
          ${notes}
        </section>`;
      }
    }
  }
  navTree.innerHTML = navHtml;
  cardsEl.innerHTML = cardsHtml;

  // Cards are injected via srcdoc after render so their own <style> stays
  // scoped to the frame — a card that ships a global reset cannot break the shell.
  const byId = new Map();
  for (const g of data.sections) for (const c of g.cards) byId.set(c.id, c);
  for (const frame of cardsEl.querySelectorAll("iframe")) {
    const card = byId.get(frame.dataset.card);
    if (!card) continue;
    frame.srcdoc = card.html;
    frame.addEventListener("load", () => {
      const fit = () => {
        try {
          const h = frame.contentDocument.documentElement.scrollHeight;
          frame.style.height = Math.min(Math.max(h, 90), 720) + "px";
        } catch { frame.style.height = "320px"; }
      };
      fit();
      // Cards with async content (fonts, images) settle after load.
      setTimeout(fit, 120);
      setTimeout(fit, 500);
    });
  }

  navTree.addEventListener("click", (e) => {
    const head = e.target.closest(".nav-head");
    if (head) {
      const grp = head.parentElement;
      grp.dataset.collapsed = grp.dataset.collapsed === "true" ? "false" : "true";
    }
  });

  // Highlight the rail entry for whatever is on screen.
  const links = [...navTree.querySelectorAll("a")];
  const obs = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      links.forEach((a) => a.classList.toggle("active", a.dataset.target === en.target.id));
    }
  }, { rootMargin: "-70px 0px -70% 0px" });
  cardsEl.querySelectorAll(".card-block").forEach((s) => obs.observe(s));

  document.getElementById("filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    for (const block of cardsEl.querySelectorAll(".card-block")) {
      const hit = !q || block.dataset.name.includes(q);
      block.hidden = !hit;
      if (hit) shown++;
    }
    for (const label of cardsEl.querySelectorAll(".section-label")) {
      let n = label.nextElementSibling, any = false;
      while (n && !n.classList.contains("section-label")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
      label.hidden = !any;
    }
    for (const a of links) {
      const t = document.getElementById(a.dataset.target);
      a.hidden = t ? t.hidden : false;
    }
    document.getElementById("empty").hidden = shown > 0;
  });

  let allOpen = false;
  document.getElementById("expand-all").addEventListener("click", (e) => {
    allOpen = !allOpen;
    cardsEl.querySelectorAll("details.notes").forEach((d) => (d.open = allOpen));
    e.target.textContent = allOpen ? "Collapse notes" : "Expand notes";
  });

  const themeBtn = document.getElementById("theme");
  let theme = data.theme?.default || "dark";

  // THE CONTROL SWITCHES THE CARDS, NOT THE PAGE.
  //
  // This used to call applyTheme(document) as well, which repainted the entire
  // viewer — rail, topbar, README and all — every time someone compared light
  // against dark. Two things were wrong with that. The obvious one is that the
  // whole page flashing is a lot of motion to buy one specimen change. The
  // subtler and worse one: it left nothing on screen holding still, so there
  // was no fixed reference to judge either theme against, and a light card was
  // always seen on light chrome and a dark card on dark chrome — the two
  // comparisons that flatter a palette most and test it least.
  //
  // The chrome is now neutral and fixed (see the palette block at the top).
  // Only card documents get the attribute.
  //
  // Projects disagree on how dark mode is expressed: some use
  // [data-theme="dark"], Tailwind's convention is a .dark class. Applying both
  // means a card written for either convention responds to this toggle, so the
  // system does not have to be rewritten to match the host app's choice.
  const applyTheme = (doc) => {
    const el = doc.documentElement;
    el.dataset.theme = theme;
    el.classList.toggle("dark", theme === "dark");
  };
  const applyAll = () => {
    for (const f of cardsEl.querySelectorAll("iframe")) {
      try { applyTheme(f.contentDocument); } catch {}
    }
    // Label names what changes, so the control cannot be mistaken for a
    // page-level appearance setting.
    themeBtn.textContent = theme === "dark" ? "Cards: Light" : "Cards: Dark";
  };
  applyAll();
  // Frames finish loading after this runs, so re-apply as each one arrives.
  cardsEl.addEventListener("load", (e) => {
    if (e.target.tagName === "IFRAME") { try { applyTheme(e.target.contentDocument); } catch {} }
  }, true);
  themeBtn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyAll();
  });
})();
</script>
</body>
</html>
