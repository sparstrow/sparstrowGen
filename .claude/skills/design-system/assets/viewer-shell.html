<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SYSTEM_NAME__ Design System</title>
<style>
  /* The viewer chrome is deliberately independent of the system's own tokens.
     Cards render inside iframes, so a system whose tokens are mid-edit (or
     broken) still leaves the surrounding page navigable. */
  :root {
    --vw-bg: #0c0c0e; --vw-panel: #161618; --vw-rail: #08080a;
    --vw-fg: #f4f4f5; --vw-muted: #8a8a93; --vw-border: #26262b;
    --vw-accent: #c8794a; --vw-radius: 10px;
    --vw-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --vw-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root[data-theme="light"] {
    --vw-bg: #ffffff; --vw-panel: #fafafa; --vw-rail: #f4f4f5;
    --vw-fg: #18181b; --vw-muted: #6b6b74; --vw-border: #e4e4e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--vw-bg); color: var(--vw-fg);
    font-family: var(--vw-font); font-size: 13px; line-height: 1.5;
    display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden;
  }
  /* ── rail ── */
  nav {
    background: var(--vw-rail); border-right: 1px solid var(--vw-border);
    overflow-y: auto; padding: 12px 0 40px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px 14px;
    font-weight: 700; font-size: 14px; letter-spacing: -0.01em;
  }
  .brand .dot { width: 18px; height: 18px; border-radius: 5px; background: var(--vw-accent); }
  .filter {
    margin: 0 12px 12px; width: calc(100% - 24px); padding: 6px 9px;
    background: transparent; border: 1px solid var(--vw-border); border-radius: 8px;
    color: var(--vw-fg); font: inherit; font-size: 12px;
  }
  .filter:focus-visible { outline: none; border-color: var(--vw-accent); }
  .nav-group { margin-top: 6px; }
  .nav-group > .nav-head {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 6px 16px; background: none; border: 0; cursor: pointer;
    color: var(--vw-fg); font: inherit; font-size: 12px; font-weight: 600; text-align: left;
  }
  .nav-head .chev { transition: transform .14s ease; opacity: .6; }
  .nav-group[data-collapsed="true"] .chev { transform: rotate(-90deg); }
  .nav-group[data-collapsed="true"] .nav-items { display: none; }
  .nav-items a {
    display: block; padding: 4px 16px 4px 28px; color: var(--vw-muted);
    text-decoration: none; font-size: 12px; border-left: 2px solid transparent;
  }
  .nav-items a:hover { color: var(--vw-fg); background: color-mix(in oklab, var(--vw-fg) 5%, transparent); }
  .nav-items a.active { color: var(--vw-accent); border-left-color: var(--vw-accent); font-weight: 500; }
  /* ── main ── */
  main { overflow-y: auto; scroll-behavior: smooth; }
  .topbar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; padding: 10px 24px;
    background: color-mix(in oklab, var(--vw-bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--vw-border);
  }
  .topbar .meta { color: var(--vw-muted); font-size: 11.5px; font-family: var(--vw-mono); }
  .btn {
    padding: 5px 10px; background: transparent; border: 1px solid var(--vw-border);
    border-radius: 8px; color: var(--vw-fg); font: inherit; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: color-mix(in oklab, var(--vw-fg) 6%, transparent); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 24px 120px; }
  .section-label {
    margin: 34px 0 12px; color: var(--vw-muted); font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .card-block { margin-bottom: 26px; scroll-margin-top: 60px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .card-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .card-desc { color: var(--vw-muted); font-size: 12px; margin-top: 1px; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .frame-shell {
    border: 1px solid var(--vw-border); border-radius: var(--vw-radius);
    overflow: hidden; background: var(--vw-panel);
  }
  iframe { display: block; width: 100%; border: 0; background: transparent; }
  details.notes { margin-top: 8px; }
  details.notes > summary {
    cursor: pointer; color: var(--vw-muted); font-size: 12px; padding: 4px 0;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  details.notes > summary::-webkit-details-marker { display: none; }
  details.notes > summary::before { content: "›"; transition: transform .14s ease; display: inline-block; }
  details.notes[open] > summary::before { transform: rotate(90deg); }
  details.notes > summary:hover { color: var(--vw-fg); }
  .notes-body {
    padding: 4px 2px 8px; font-size: 12.5px;
    border-left: 2px solid var(--vw-border); padding-left: 14px; margin-top: 6px;
  }
  .notes-body h1, .notes-body h2, .notes-body h3, .notes-body h4 { margin: 14px 0 6px; font-size: 13px; }
  .notes-body h1 { font-size: 14px; }
  .notes-body p { margin: 6px 0; }
  .notes-body ul, .notes-body ol { margin: 6px 0; padding-left: 20px; }
  .notes-body li { margin: 2px 0; }
  .notes-body code { font-family: var(--vw-mono); font-size: 11.5px;
    background: color-mix(in oklab, var(--vw-fg) 8%, transparent); padding: 1px 4px; border-radius: 4px; }
  .notes-body pre.code {
    background: var(--vw-rail); border: 1px solid var(--vw-border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0;
  }
  .notes-body pre.code code { background: none; padding: 0; font-size: 11.5px; line-height: 1.55; }
  .notes-body table { border-collapse: collapse; margin: 8px 0; font-size: 12px; width: 100%; }
  .notes-body th, .notes-body td { border: 1px solid var(--vw-border); padding: 5px 9px; text-align: left; }
  .notes-body th { background: var(--vw-rail); font-weight: 600; }
  .notes-body blockquote { margin: 8px 0; padding-left: 12px; border-left: 2px solid var(--vw-accent); color: var(--vw-muted); }
  .readme { padding-bottom: 10px; border-bottom: 1px solid var(--vw-border); }
  .readme > h1:first-child { margin-top: 0; font-size: 22px; letter-spacing: -0.02em; }
  .empty { color: var(--vw-muted); padding: 40px 0; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; }
    nav { display: none; }
  }
</style>
</head>
<body>
<nav>
  <div class="brand"><span class="dot"></span><span>__SYSTEM_NAME__</span></div>
  <input class="filter" id="filter" type="search" placeholder="Filter…" aria-label="Filter cards">
  <div id="nav-tree"></div>
</nav>
<main>
  <div class="topbar">
    <div class="meta" id="meta"></div>
    <div class="card-actions">
      <button class="btn" id="expand-all">Expand notes</button>
      <button class="btn" id="theme">Light</button>
    </div>
  </div>
  <div class="wrap">
    <div class="readme" id="readme"></div>
    <div id="cards"></div>
    <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
  </div>
</main>

<script type="application/json" id="payload">__PAYLOAD__</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("payload").textContent);
  const navTree = document.getElementById("nav-tree");
  const cardsEl = document.getElementById("cards");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  document.getElementById("readme").innerHTML = data.readme || "";
  const total = data.sections.reduce((n, s) => n + s.cards.length, 0);
  document.getElementById("meta").textContent =
    `${total} cards · ${data.mode} mode` + (data.generatedAt ? ` · built ${data.generatedAt.slice(0,10)}` : "");

  // Group the flat section list by its section label so the rail reads
  // Foundations → Components → Designs, each with its own subgroups.
  const bySection = new Map();
  for (const g of data.sections) {
    if (!bySection.has(g.section)) bySection.set(g.section, []);
    bySection.get(g.section).push(g);
  }

  let navHtml = "", cardsHtml = "";
  for (const [section, groups] of bySection) {
    cardsHtml += `<div class="section-label">${esc(section)}</div>`;
    for (const g of groups) {
      navHtml += `<div class="nav-group" data-group="${esc(g.group)}">
        <button class="nav-head"><span class="chev">▾</span>${esc(g.group)}</button>
        <div class="nav-items">${g.cards.map((c) =>
          `<a href="#${esc(c.id)}" data-target="${esc(c.id)}">${esc(c.name)}</a>`).join("")}</div>
      </div>`;

      for (const c of g.cards) {
        const live = c.live
          ? `<a class="btn" href="${esc(c.live)}" target="_blank" rel="noopener">Open live ↗</a>` : "";
        const notes = c.prompt
          ? `<details class="notes"><summary>Usage notes for Claude</summary>
               <div class="notes-body">${c.prompt}</div></details>` : "";
        cardsHtml += `<section class="card-block" id="${esc(c.id)}" data-name="${esc(c.name.toLowerCase())}">
          <div class="card-head">
            <div>
              <div class="card-title">${esc(c.name)}</div>
              ${c.description ? `<div class="card-desc">${esc(c.description)}</div>` : ""}
            </div>
            <div class="card-actions">${live}</div>
          </div>
          <div class="frame-shell"><iframe data-card="${esc(c.id)}" loading="lazy" title="${esc(c.name)}"></iframe></div>
          ${notes}
        </section>`;
      }
    }
  }
  navTree.innerHTML = navHtml;
  cardsEl.innerHTML = cardsHtml;

  // Cards are injected via srcdoc after render so their own <style> stays
  // scoped to the frame — a card that ships a global reset cannot break the shell.
  const byId = new Map();
  for (const g of data.sections) for (const c of g.cards) byId.set(c.id, c);
  for (const frame of cardsEl.querySelectorAll("iframe")) {
    const card = byId.get(frame.dataset.card);
    if (!card) continue;
    frame.srcdoc = card.html;
    frame.addEventListener("load", () => {
      const fit = () => {
        try {
          const h = frame.contentDocument.documentElement.scrollHeight;
          frame.style.height = Math.min(Math.max(h, 90), 720) + "px";
        } catch { frame.style.height = "320px"; }
      };
      fit();
      // Cards with async content (fonts, images) settle after load.
      setTimeout(fit, 120);
      setTimeout(fit, 500);
    });
  }

  navTree.addEventListener("click", (e) => {
    const head = e.target.closest(".nav-head");
    if (head) {
      const grp = head.parentElement;
      grp.dataset.collapsed = grp.dataset.collapsed === "true" ? "false" : "true";
    }
  });

  // Highlight the rail entry for whatever is on screen.
  const links = [...navTree.querySelectorAll("a")];
  const obs = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      links.forEach((a) => a.classList.toggle("active", a.dataset.target === en.target.id));
    }
  }, { rootMargin: "-70px 0px -70% 0px" });
  cardsEl.querySelectorAll(".card-block").forEach((s) => obs.observe(s));

  document.getElementById("filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    for (const block of cardsEl.querySelectorAll(".card-block")) {
      const hit = !q || block.dataset.name.includes(q);
      block.hidden = !hit;
      if (hit) shown++;
    }
    for (const label of cardsEl.querySelectorAll(".section-label")) {
      let n = label.nextElementSibling, any = false;
      while (n && !n.classList.contains("section-label")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
      label.hidden = !any;
    }
    for (const a of links) {
      const t = document.getElementById(a.dataset.target);
      a.hidden = t ? t.hidden : false;
    }
    document.getElementById("empty").hidden = shown > 0;
  });

  let allOpen = false;
  document.getElementById("expand-all").addEventListener("click", (e) => {
    allOpen = !allOpen;
    cardsEl.querySelectorAll("details.notes").forEach((d) => (d.open = allOpen));
    e.target.textContent = allOpen ? "Collapse notes" : "Expand notes";
  });

  const root = document.documentElement;
  const themeBtn = document.getElementById("theme");
  let theme = data.theme?.default || "dark";

  // Projects disagree on how dark mode is expressed: some use
  // [data-theme="dark"], Tailwind's convention is a .dark class. Applying both
  // means a card written for either convention responds to this toggle, so the
  // system does not have to be rewritten to match the host app's choice.
  const applyTheme = (doc) => {
    const el = doc.documentElement;
    el.dataset.theme = theme;
    el.classList.toggle("dark", theme === "dark");
  };
  const applyAll = () => {
    applyTheme(document);
    for (const f of cardsEl.querySelectorAll("iframe")) {
      try { applyTheme(f.contentDocument); } catch {}
    }
    themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
  };
  applyAll();
  // Frames finish loading after this runs, so re-apply as each one arrives.
  cardsEl.addEventListener("load", (e) => {
    if (e.target.tagName === "IFRAME") { try { applyTheme(e.target.contentDocument); } catch {} }
  }, true);
  themeBtn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyAll();
  });
})();
</script>
</body>
</html>
