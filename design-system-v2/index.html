    <div class="readme" id="readme"></div>
    <div id="cards"></div>
    <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
  </div>
</main>

<script type="application/json" id="payload">{"name":"Sparstrowgen","mode":"mirror","theme":{"default":"dark","toggleAttr":"data-theme"},"generatedAt":"2026-08-19T11:22:21.844Z","readme":"\u003ch1>Sparstrowgen — design system\u003c/h1>\n\u003cp>An autonomous agent platform and developer control plane. The surfaces here are \u003cstrong>monitoring surfaces\u003c/strong>: dense, scanned rather than read, and open for long sittings. That is why the type scale runs denser than shadcn's defaults and why motion stays under 200ms.\u003c/p>\n\u003cblockquote>\u003cstrong>This is \u003ccode>design-system-v2\u003c/code>, built 2026-08-19 to be compared against the original \u003ccode>design-system/\u003c/code> before either is kept.\u003c/strong> Both are in the repo on purpose. The differences are listed at the bottom of this file.\u003c/blockquote>\n\u003ch2>How to consume this\u003c/h2>\n\u003col>\n\u003cli>Link \u003ccode>styles.css\u003c/code> in your \u003ccode>&lt;head&gt;\u003c/code> — it is \u003ccode>@import\u003c/code> only, real values live in \u003ccode>tokens/\u003c/code>.\u003c/li>\n\u003cli>Load \u003cstrong>Inter Variable\u003c/strong> (\u003ccode>@fontsource-variable/inter\u003c/code>). It is the only font the system names.\u003c/li>\n\u003cli>\u003cstrong>Dark is a \u003ccode>.dark\u003c/code> class on the root, not a media query and not a data attribute.\u003c/strong> \u003ccode>:root\u003c/code> is light. The app ships dark, so \u003ccode>.dark\u003c/code> is the practical default even though the cascade treats it as the override.\u003c/li>\n\u003cli>Use \u003ccode>var(--foreground)\u003c/code>, \u003ccode>var(--warning)\u003c/code> and so on for every colour. \u003cstrong>Never a hex literal and never a Tailwind palette class\u003c/strong> — \u003ccode>bg-amber-500\u003c/code> is a defect, not a shortcut, and \u003ccode>DESIGN.md\u003c/code> §12 says so directly.\u003c/li>\n\u003c/ol>\n\u003ch2>Sources — mirror mode\u003c/h2>\n\u003cp>This system documents real code. It does not reimplement it.\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Documented\u003c/th>\u003cth>Real file\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>All colour tokens, radius, font\u003c/td>\u003ctd>\u003ccode>packages/ui/src/styles/globals.css\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Button, Badge, Input, Card, Empty, Skeleton\u003c/td>\u003ctd>\u003ccode>packages/ui/src/components/ui/*.tsx\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Motion keyframes\u003c/td>\u003ctd>\u003ccode>packages/ui/src/styles/globals.css\u003c/code> (lines 140–195)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>\u003ccode>node .claude/skills/design-system/scripts/ds.mjs check --root design-system-v2\u003c/code> diffs the recorded values against those files and exits non-zero on drift.\u003c/p>\n\u003ch2>The doctrine is not this file\u003c/h2>\n\u003cp>\u003ccode>DESIGN.md\u003c/code> at the repo root is the design doctrine — written with the owner via the \u003ccode>design-brief\u003c/code> skill. \u003cstrong>This system documents what the code has; the doctrine says what it should be.\u003c/strong> Where they disagree, the doctrine wins and the gap is a task, not a discrepancy to smooth over.\u003c/p>\n\u003cp>Every card that shows such a gap says so explicitly rather than rendering the specified version and letting a reader assume it ships.\u003c/p>\n\u003ch2>What the app actually has, versus what §2–§7 specify\u003c/h2>\n\u003cp>The most useful thing this system can tell you, stated once:\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Foundation\u003c/th>\u003cth>In the code\u003c/th>\u003cth>In \u003ccode>DESIGN.md\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Colour\u003c/strong>\u003c/td>\u003ctd>60 literal values (30 per mode), hand-maintained\u003c/td>\u003ctd>§2 — a theming contract: user-picked accent and surface, all derived from five roots. \u003cstrong>Not built\u003c/strong> (G-19)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Radius\u003c/strong>\u003c/td>\u003ctd>One base, three \u003ccode>calc()\u003c/code> steps. Real\u003c/td>\u003ctd>§5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Status\u003c/strong>\u003c/td>\u003ctd>4 tokens: success, warning, info, destructive\u003c/td>\u003ctd>§2.4 adds \u003cstrong>approval\u003c/strong>; §2.5 adds \u003cstrong>actor identity\u003c/strong>. Neither built\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Type\u003c/strong>\u003c/td>\u003ctd>\u003ccode>--font-sans\u003c/code>, and nothing else\u003c/td>\u003ctd>§3 — a seven-role scale. \u003cstrong>No CSS counterpart\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Spacing\u003c/strong>\u003c/td>\u003ctd>No tokens. Tailwind defaults at each call site\u003c/td>\u003ctd>§4 specifies a base unit and density\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Shadow\u003c/strong>\u003c/td>\u003ctd>No tokens. Tailwind utilities\u003c/td>\u003ctd>§5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Motion\u003c/strong>\u003c/td>\u003ctd>4 real keyframes, durations written literally\u003c/td>\u003ctd>§7. No tokens, and no \u003ccode>prefers-reduced-motion\u003c/code> anywhere\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Known limitations &amp; boundaries\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Light mode has no surface ramp.\u003c/strong> \u003ccode>background\u003c/code>, \u003ccode>card\u003c/code>, and \u003ccode>popover\u003c/code> are all \u003ccode>oklch(1 0 0)\u003c/code>. Borders do all the separating. Dark mode has three real steps.\u003c/li>\n\u003cli>\u003cstrong>Nothing responds to \u003ccode>prefers-reduced-motion\u003c/code>\u003c/strong> — verified 2026-08-19, no match in \u003ccode>packages/ui/src\u003c/code> or \u003ccode>apps/web/src\u003c/code>. \u003ccode>spg-pulse\u003c/code> is infinite.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>check\u003c/code> cannot catch an invented token.\u003c/strong> It diffs recorded tokens against source; a token declared here that exists in no source passes clean. That is \u003ccode>doc/KnownGaps.md\u003c/code> G-18, and it is why this system defines fewer tokens rather than more.\u003c/li>\n\u003cli>\u003cstrong>No prototypes yet.\u003c/strong> \u003ccode>designs/\u003c/code> is empty. The original system carries the Machines prototype and its handoff.\u003c/li>\n\u003cli>\u003cstrong>Contrast is not re-verified here.\u003c/strong> \u003ccode>DESIGN.md\u003c/code> §2.3's published figures could not be reproduced from the document — G-21.\u003c/li>\n\u003c/ul>\n\u003ch2>What differs from the original \u003ccode>design-system/\u003c/code>\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003ccode>design-system/\u003c/code>\u003c/th>\u003cth>\u003ccode>design-system-v2/\u003c/code>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Built against\u003c/td>\u003ctd>The retired doctrine, partly\u003c/td>\u003ctd>\u003ccode>DESIGN.md\u003c/code> as of 2026-08-19, including §2.4–2.5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Invented tokens\u003c/td>\u003ctd>\u003ccode>--transition-base\u003c/code>, \u003ccode>--space-*\u003c/code>, \u003ccode>--font-mono\u003c/code>, \u003ccode>--radius-full\u003c/code> — none exist in the app\u003c/td>\u003ctd>\u003cstrong>None.\u003c/strong> Gaps are stated, not filled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cards depend on\u003c/td>\u003ctd>At least one invented token, all 10 of them\u003c/td>\u003ctd>Only tokens the app really has\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Type scale\u003c/td>\u003ctd>§3's prose transcribed into CSS\u003c/td>\u003ctd>Shown as literals, labelled as unbuilt\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Motion\u003c/td>\u003ctd>One invented duration token\u003c/td>\u003ctd>The four real keyframes, animating live\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Components\u003c/td>\u003ctd>4\u003c/td>\u003ctd>6 — adds Empty and Skeleton, the two states most often skipped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Prototypes\u003c/td>\u003ctd>Machines (\u003ccode>designs/\u003c/code>)\u003c/td>\u003ctd>none yet\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>The original is not wrong so much as \u003cstrong>honest in its comments and misleading in its files\u003c/strong>: it annotates the invented values clearly, and still ships them as CSS that renders. This one leaves the gap visible instead.\u003c/p>","sections":[{"section":"Foundations","group":"Foundations","cards":[{"id":"motion-card-html","name":"Motion","description":"The four animations that actually ship, with their real durations and curves — no motion tokens exist","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Motion\u003c/title>\n\u003cmeta name=\"description\" content=\"The four animations that actually ship, with their real durations and curves — no motion tokens exist\">\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\n\u003c!-- Literal px for card chrome. Every duration and curve below is copied from\n     globals.css lines 140-195 — this card animates with the real values. --\u003e\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;\n       padding:12px 0;border-bottom:1px solid var(--border)}\n  .row:last-of-type{border-bottom:0}\n  .lbl{font-size:11px;font-weight:600;color:var(--foreground)}\n  .lbl em{display:block;font-weight:400;font-style:normal;font-size:10.5px;\n          color:var(--muted-foreground);margin-top:2px}\n  .stage{height:36px;border:1px solid var(--border);border-radius:var(--radius-md);\n         overflow:hidden;position:relative;background:var(--muted)}\n  .chip{position:absolute;top:6px;left:8px;padding:4px 10px;border-radius:var(--radius-sm);\n        background:var(--primary);color:var(--primary-foreground);font-size:11px;font-weight:600}\n\n  @keyframes spg-slide-in-right{from{transform:translateX(100%)}to{transform:translateX(0)}}\n  @keyframes spg-fade-in{from{opacity:0}to{opacity:1}}\n  @keyframes spg-pulse{0%,100%{opacity:.25}50%{opacity:1}}\n  @keyframes spg-turn-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}\n\n  .a1{animation:spg-slide-in-right .2s cubic-bezier(.3,.7,.4,1) infinite alternate}\n  .a2{animation:spg-fade-in .15s ease-out infinite alternate}\n  .a3{animation:spg-pulse 1s ease-in-out infinite}\n  .a4{animation:spg-turn-in .18s cubic-bezier(.165,.84,.44,1) infinite alternate}\n\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"row\">\n  \u003cdiv class=\"lbl\">spg-slide-in-right\u003cem>0.2s &middot; cubic-bezier(.3,.7,.4,1)\u003c/em>\u003c/div>\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a1\">sheet\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cdiv class=\"lbl\">spg-fade-in\u003cem>0.15s &middot; ease-out\u003c/em>\u003c/div>\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a2\">overlay\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cdiv class=\"lbl\">spg-turn-in\u003cem>0.18s &middot; cubic-bezier(.165,.84,.44,1)\u003c/em>\u003c/div>\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a4\">chat turn\u003c/div>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\">\n  \u003cdiv class=\"lbl\">spg-pulse\u003cem>1s &middot; ease-in-out &middot; infinite\u003c/em>\u003c/div>\n  \u003cdiv class=\"stage\">\u003cdiv class=\"chip a3\">thinking\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Four animations, plain CSS keyframes, no framer-motion.\u003c/strong> Everything is\n  opacity and transform only. Durations sit between 150ms and 200ms — fast enough to read as\n  state feedback rather than choreography, which is the app&rsquo;s whole register.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>There are no motion tokens.\u003c/strong> Durations and curves are written literally at\n  each call site. That means §7 of the doctrine cannot be changed in one place today, and\n  the four values above are the real vocabulary any new animation should match. The previous\n  design system papered over this by inventing \u003ccode>--transition-base: 140ms ease\u003c/code>,\n  a token present in no stylesheet and consumed by nothing — \u003ccode>doc/KnownGaps.md\u003c/code>\n  G-18. It is deliberately absent here.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Not verified:\u003c/strong> \u003ccode>prefers-reduced-motion\u003c/code>. Nothing in\n  globals.css responds to it, so \u003ccode>spg-pulse\u003c/code> in particular — infinite, and the\n  one users notice — currently runs regardless of the setting.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\motion.card.html","live":null},{"id":"radius-card-html","name":"Radius","description":"Four steps, all derived by calc() from one --radius base of 0.625rem","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Radius\u003c/title>\n\u003cmeta name=\"description\" content=\"Four steps, all derived by calc() from one --radius base of 0.625rem\">\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\n\u003c!-- Literal px for card chrome — the app defines no spacing tokens. --\u003e\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .sp{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n  .item{display:flex;flex-direction:column;gap:6px;align-items:center;\n        font-size:10.5px;color:var(--muted-foreground)}\n  .bx{width:64px;height:64px;background:var(--muted);border:1px solid var(--border)}\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"sp\">\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-sm)\">\u003c/div>\u003cdiv>sm &middot; base &minus;4px\u003c/div>\u003c/div>\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-md)\">\u003c/div>\u003cdiv>md &middot; base &minus;2px\u003c/div>\u003c/div>\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-lg)\">\u003c/div>\u003cdiv>lg &middot; base\u003c/div>\u003c/div>\n  \u003cdiv class=\"item\">\u003cdiv class=\"bx\" style=\"border-radius:var(--radius-xl)\">\u003c/div>\u003cdiv>xl &middot; base +4px\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Four steps, one decision.\u003c/strong> All of them come from\n  \u003ccode>--radius: 0.625rem\u003c/code> via \u003ccode>calc()\u003c/code> in globals.css — they are not\n  independently chosen. Moving that one base moves the whole scale together, which is why a\n  literal pixel radius anywhere is a defect rather than a shortcut: it pins one corner while\n  every adjacent corner moves.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  The relationship is deliberately kept as \u003ccode>calc()\u003c/code> in\n  \u003ccode>tokens/spacing.css\u003c/code> rather than resolved to 6 / 8 / 10 / 14px. Mirroring the\n  output would record the numbers and lose the rule that produced them.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>There is no \u003ccode>--radius-full\u003c/code>.\u003c/strong> Pills and avatars use Tailwind's\n  \u003ccode>rounded-full\u003c/code> directly. The previous design system defined one in its own\n  token file and drew it on this card, which made the scale look like five steps the app\n  could reproduce — it has four.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\radius.card.html","live":null},{"id":"status-colors-card-html","name":"Status &amp; identity colour","description":"Four status tokens ship; approval and actor identity are specified in DESIGN.md §2.4–2.5 and not yet built","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Status &amp; identity colour\u003c/title>\n\u003cmeta name=\"description\" content=\"Four status tokens ship; approval and actor identity are specified in DESIGN.md §2.4–2.5 and not yet built\">\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\n\u003c!-- Literal px for card chrome — the app defines no spacing tokens. --\u003e\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  h4{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;\n     text-transform:uppercase;color:var(--muted-foreground)}\n  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\n  .tok{padding:10px 12px;border-radius:var(--radius-md);font-size:12px;\n       display:flex;align-items:center;gap:8px}\n  .tok b{font-weight:650}\n  .tok span{margin-left:auto;font-size:10.5px;opacity:.8}\n  .ship{border:1px solid var(--border)}\n  .todo{border:1px dashed var(--border);background:var(--muted);color:var(--muted-foreground)}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  .rule{margin-top:12px;padding:10px 12px;border-left:2px solid var(--border);\n        font-size:12px;line-height:1.6;color:var(--muted-foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n  hr{border:0;border-top:1px solid var(--border);margin:20px 0}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003ch4>Ships today — four tokens, both modes\u003c/h4>\n\u003cdiv class=\"grid\">\n  \u003cdiv class=\"tok ship\" style=\"background:var(--success);color:var(--success-foreground)\">\n    \u003cb>success\u003c/b> online, passed \u003cspan>--success\u003c/span>\u003c/div>\n  \u003cdiv class=\"tok ship\" style=\"background:var(--warning);color:var(--warning-foreground)\">\n    \u003cb>warning\u003c/b> needs attention \u003cspan>--warning\u003c/span>\u003c/div>\n  \u003cdiv class=\"tok ship\" style=\"background:var(--info);color:var(--info-foreground)\">\n    \u003cb>info\u003c/b> informational \u003cspan>--info\u003c/span>\u003c/div>\n  \u003cdiv class=\"tok ship\" style=\"background:var(--destructive);color:var(--destructive-foreground)\">\n    \u003cb>destructive\u003c/b> failed \u003cspan>--destructive\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  Each token is a \u003cstrong>tinted surface\u003c/strong>; its \u003ccode>-foreground\u003c/code> pair is the\n  text that sits on it. That is the shape to copy — \u003ccode>bg-warning\u003c/code> with\n  \u003ccode>text-warning-foreground\u003c/code>, opacity modifiers welcome\n  (\u003ccode>bg-warning/5\u003c/code>, \u003ccode>border-warning/30\u003c/code>). Both modes are already\n  defined, so a \u003ccode>dark:\u003c/code> variant on a status colour is a sign someone hand-rolled\n  a palette value instead.\n\u003c/div>\n\n\u003chr>\n\n\u003ch4>Specified 2026-08-19, not yet built\u003c/h4>\n\u003cdiv class=\"grid\">\n  \u003cdiv class=\"tok todo\">\u003cb>approval\u003c/b> awaiting a human yes \u003cspan>hue 310\u003c/span>\u003c/div>\n  \u003cdiv class=\"tok todo\">\u003cb>identity &times;6\u003c/b> which agent is this \u003cspan>§2.5\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"rule\">\n  \u003cstrong>Approval is a fifth status, not a shade of warning.\u003c/strong> \u003cem>Blocked\u003c/em> and\n  \u003cem>awaiting approval\u003c/em> are triaged differently and must be separable across a room.\n  Hue 310 keeps it clear of info (255) and of the Violet brand preset (285).\n\u003c/div>\n\n\u003cdiv class=\"rule\">\n  \u003cstrong>Named rule — Identity Is Not Status.\u003c/strong> No actor-identity hue sits within\n  20&deg; of a status hue. The palette shipping today breaks this: \u003ccode>actor-avatar.tsx\u003c/code>\n  hashes names onto emerald, amber, and rose — which are \u003cem>success\u003c/em>, \u003cem>warning\u003c/em>,\n  and \u003cem>danger\u003c/em> — so an avatar can currently read as a state it has nothing to do with.\n  Identity is also never themed: if a user accent could recolour it, two agents could\n  collapse to one hue and the palette would stop doing its only job.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  Neither has been contrast-measured. \u003ccode>DESIGN.md\u003c/code> §2 requires measurement before\n  a colour ships, and the model used to check it could not reproduce §2.3&rsquo;s own\n  published figures — see \u003ccode>doc/KnownGaps.md\u003c/code> G-21. Specified by hue and\n  constraint is where these honestly stand.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\status-colors.card.html","live":null},{"id":"surfaces-card-html","name":"Surfaces","description":"The real neutral ramp, both modes — and the four surface characters DESIGN.md §2.2 specifies but the app does not have","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Surfaces\u003c/title>\n\u003cmeta name=\"description\" content=\"The real neutral ramp, both modes — and the four surface characters DESIGN.md §2.2 specifies but the app does not have\">\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\n\u003c!-- Card chrome uses literal px. The app defines no spacing tokens (see\n     tokens/spacing.css), so a card that used var(--space-4) would be\n     demonstrating something the system does not have. --\u003e\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n  .pane{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\n  .pane h4{margin:0;padding:8px 12px;font-size:11px;font-weight:600;letter-spacing:.06em;\n           text-transform:uppercase;color:var(--muted-foreground);border-bottom:1px solid var(--border)}\n  .stack{padding:12px;display:flex;flex-direction:column;gap:8px}\n  .swatch{display:flex;align-items:center;gap:10px;padding:10px 12px;\n          border:1px solid var(--border);border-radius:var(--radius-md);font-size:12px}\n  .name{font-weight:600}\n  .val{margin-left:auto;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .gap{margin-top:12px;padding:12px;border:1px dashed var(--border);\n       border-radius:var(--radius-md);font-size:12px;line-height:1.6;color:var(--muted-foreground)}\n  .gap strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"modes\">\n  \u003cdiv class=\"pane\">\u003ch4>Dark — ships\u003c/h4>\n    \u003cdiv class=\"stack\" style=\"background:oklch(0.145 0 0);color:oklch(0.985 0 0)\">\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.145 0 0)\">\u003cspan class=\"name\">background\u003c/span>\u003cspan class=\"val\">0.145\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.205 0 0)\">\u003cspan class=\"name\">card\u003c/span>\u003cspan class=\"val\">0.205\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.269 0 0)\">\u003cspan class=\"name\">muted / accent\u003c/span>\u003cspan class=\"val\">0.269\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.205 0 0)\">\u003cspan class=\"name\">popover\u003c/span>\u003cspan class=\"val\">0.205\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"pane\">\u003ch4>Light\u003c/h4>\n    \u003cdiv class=\"stack\" style=\"background:oklch(1 0 0);color:oklch(0.145 0 0)\">\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">background\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">card\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(0.97 0 0)\">\u003cspan class=\"name\">muted / accent\u003c/span>\u003cspan class=\"val\">0.97\u003c/span>\u003c/div>\n      \u003cdiv class=\"swatch\" style=\"background:oklch(1 0 0)\">\u003cspan class=\"name\">popover\u003c/span>\u003cspan class=\"val\">1.0\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  Chroma is \u003cstrong>0\u003c/strong> on every neutral above. The ramp is pure greyscale in both\n  modes — no warmth, no cast. Dark mode is a \u003ccode>.dark\u003c/code> class, not a media query,\n  so \u003ccode>:root\u003c/code> is light and the app overrides to dark.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Light mode has no surface ramp at all.\u003c/strong> \u003ccode>background\u003c/code>,\n  \u003ccode>card\u003c/code>, and \u003ccode>popover\u003c/code> are all \u003ccode>oklch(1 0 0)\u003c/code> — the same\n  pure white — so the right pane above separates only by its borders. Dark mode does have\n  three real steps (0.145 / 0.205 / 0.269). \u003ccode>DESIGN.md\u003c/code> §2.2 specifies a\n  differentiated light ramp (\u003ccode>--background\u003c/code> at 0.985 against \u003ccode>--card\u003c/code>\n  at 1.0); the app does not implement it. This is not a rendering artefact of the card —\n  it is what ships.\n\u003c/div>\n\n\u003cdiv class=\"gap\">\n  \u003cstrong>Specified but not built.\u003c/strong> \u003ccode>DESIGN.md\u003c/code> §2.2 defines four surface\n  \u003cem>characters\u003c/em> — Paper (hue 85, chroma 0.010), Slate (250, 0.011), Soft (280, 0.007),\n  Mono (0, 0) — each with a light and dark expression derived from five root variables.\n  None of that exists here. Every value above is a hand-maintained literal with no\n  relationship the code enforces between its light and dark form, which is why\n  \u003cem>Paper\u003c/em> and \u003cem>Mono\u003c/em> cannot be shown side by side: today the app only has Mono,\n  and it has it by accident rather than by choice. Tracked as\n  \u003ccode>doc/KnownGaps.md\u003c/code> G-19.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\surfaces.card.html","live":null},{"id":"type-scale-card-html","name":"Type scale","description":"DESIGN.md §3 specifies seven roles; the app has one font token and 97 arbitrary literal sizes","section":"Foundations","group":"Foundations","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"guidelines/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Type scale\u003c/title>\n\u003cmeta name=\"description\" content=\"DESIGN.md §3 specifies seven roles; the app has one font token and 97 arbitrary literal sizes\">\n\u003clink rel=\"stylesheet\" href=\"../styles.css\">\n\u003c!-- Sizes below are LITERAL px on purpose: they are DESIGN.md §3's specified\n     scale, and no CSS token exists for any of them. Rendering them via\n     var(--text-body) would imply a token the app does not have. --\u003e\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .row{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:baseline;\n       padding:9px 0;border-bottom:1px solid var(--border)}\n  .row:last-of-type{border-bottom:0}\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\n       color:var(--muted-foreground)}\n  .lbl em{display:block;font-weight:400;letter-spacing:0;text-transform:none;\n          font-style:normal;margin-top:2px;opacity:.8}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  .warn{margin-top:12px;padding:12px;border:1px dashed var(--border);\n        border-radius:var(--radius-md);font-size:12px;line-height:1.6;color:var(--muted-foreground)}\n  .warn strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Display\u003cem>28px / 650\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:28px;font-weight:650;line-height:1.15\">Machines\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Headline\u003cem>17px / 650\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:17px;font-weight:650;line-height:1.3\">Runtime health\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Title\u003cem>15px / 600\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:15px;font-weight:600;line-height:1.35\">workshop-desktop\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Body\u003cem>13px / 400\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:13px;line-height:1.6\">Default. Prose, descriptions, and agent output.\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Meta\u003cem>12px / 400\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:12px;line-height:1.45;color:var(--muted-foreground)\">Last seen 4 minutes ago\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Label\u003cem>11px / 700\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n              color:var(--muted-foreground)\">Column heading\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Mono\u003cem>12px / 400\u003c/em>\u003c/div>\n  \u003cdiv style=\"font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\">\n    refs/sparstrow/wip/a91f\u003c/div>\u003c/div>\n\n\u003cdiv class=\"note\">\n  Tuned \u003cstrong>denser than shadcn&rsquo;s defaults\u003c/strong> — 13px body rather than 14px —\n  because this is a monitoring surface, read in long sittings and scanned rather than read.\n\u003c/div>\n\n\u003cdiv class=\"warn\">\n  \u003cstrong>Every size above is a literal in this card, not a token.\u003c/strong>\n  \u003ccode>DESIGN.md\u003c/code> §3 says so itself: the scale is &ldquo;a new decision, not mirrored\n  from the app&rdquo;. The only typography token that exists is \u003ccode>--font-sans\u003c/code>.\n  There is no \u003ccode>--font-mono\u003c/code> either — the mono row above uses the raw stack §3\n  names.\n  \u003cbr>\u003cbr>\n  In the codebase, sizes come from Tailwind steps (\u003ccode>text-xs\u003c/code>,\n  \u003ccode>text-sm\u003c/code>) or arbitrary literals: the 2026-08-19 slop audit counted\n  \u003cstrong>97\u003c/strong> uses of \u003ccode>text-[10px]\u003c/code> / \u003ccode>text-[11px]\u003c/code>, several\n  of them below the 11px floor this scale defines. Sweeping them is deliberately\n  \u003cem>not\u003c/em> in \u003ccode>doc/tasks/D1/\u003c/code> — there is nothing to sweep them onto until the\n  scale ships as CSS. Adding the tokens here first would invent them, which is\n  \u003ccode>doc/KnownGaps.md\u003c/code> G-18.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":null,"promptPath":null,"cardPath":"guidelines\\type-scale.card.html","live":null}]},{"section":"Components","group":"Badges","cards":[{"id":"badges-badge-card-html","name":"Badge","description":"Seven variants — including the three status ones call sites keep hand-rolling instead","section":"Components","group":"Badges","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/badges/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Badge\u003c/title>\n\u003cmeta name=\"description\" content=\"Seven variants — including the three status ones call sites keep hand-rolling instead\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;\n       padding:12px 0;border-bottom:1px solid var(--border)}\n  .row:last-of-type{border-bottom:0}\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\n       color:var(--muted-foreground)}\n  .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n  .b{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;\n     font-size:11px;font-weight:600;border:1px solid transparent}\n  .dot{width:6px;height:6px;border-radius:999px;background:currentColor}\n  .default{background:var(--primary);color:var(--primary-foreground)}\n  .secondary{background:var(--secondary);color:var(--secondary-foreground)}\n  .destructive{background:var(--destructive);color:var(--destructive-foreground)}\n  .outline{color:var(--foreground);border-color:var(--border)}\n  .success{background:var(--success);color:var(--success-foreground)}\n  .info{background:var(--info);color:var(--info-foreground)}\n  .warning{background:var(--warning);color:var(--warning-foreground)}\n  .rolled{background:transparent;color:#d97706;border-color:rgb(245 158 11 / .4)}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Neutral\u003c/div>\u003cdiv class=\"set\">\n  \u003cspan class=\"b default\">default\u003c/span>\n  \u003cspan class=\"b secondary\">secondary\u003c/span>\n  \u003cspan class=\"b outline\">outline\u003c/span>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Status\u003c/div>\u003cdiv class=\"set\">\n  \u003cspan class=\"b success\">\u003ci class=\"dot\">\u003c/i>online\u003c/span>\n  \u003cspan class=\"b warning\">\u003ci class=\"dot\">\u003c/i>needs attention\u003c/span>\n  \u003cspan class=\"b info\">\u003ci class=\"dot\">\u003c/i>queued\u003c/span>\n  \u003cspan class=\"b destructive\">\u003ci class=\"dot\">\u003c/i>failed\u003c/span>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Hand-rolled\u003c/div>\u003cdiv class=\"set\">\n  \u003cspan class=\"b rolled\">needs attention\u003c/span>\n  \u003cspan class=\"b warning\">needs attention\u003c/span>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Those last two are the same intent, built two ways.\u003c/strong> The left one is the\n  pattern found across the app on 2026-08-19 &mdash;\n  \u003ccode>border-amber-500/40 text-amber-600 dark:text-amber-400\u003c/code> at the call site,\n  three classes and a mode pair maintained by hand. The right one is\n  \u003ccode>&lt;Badge variant=\"warning\"&gt;\u003c/code>, which has existed the whole time.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  This is why the palette sweep in \u003ccode>doc/tasks/D1/\u003c/code> is not cosmetic: the component\n  already exposes \u003ccode>success\u003c/code>, \u003ccode>info\u003c/code>, and \u003ccode>warning\u003c/code>, so every\n  hand-rolled status badge is a call site that bypassed a correct API and now owns its own\n  light and dark values forever.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Badge carries state, never brand.\u003c/strong> A badge tinted with the user accent\n  says nothing &mdash; brand is identity, status is meaning, and mixing them is the one rule\n  \u003ccode>DESIGN.md\u003c/code> §2 calls load-bearing.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Badge — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/badge.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Badge variant=&quot;warning&quot;&gt;needs attention&lt;/Badge&gt;\u003c/code>\u003c/pre>\n\u003cp>Variants: \u003ccode>default\u003c/code> \u003ccode>secondary\u003c/code> \u003ccode>destructive\u003c/code> \u003ccode>outline\u003c/code> \u003ccode>success\u003c/code> \u003ccode>info\u003c/code> \u003ccode>warning\u003c/code>.\u003c/p>\n\u003ch2>The rule that gets broken\u003c/h2>\n\u003cp>\u003cstrong>Use the status variant. Do not hand-roll one.\u003c/strong> \u003ccode>success\u003c/code>, \u003ccode>info\u003c/code>, and \u003ccode>warning\u003c/code> already exist and already carry both modes. A call site writing \u003ccode>border-amber-500/40 text-amber-600 dark:text-amber-400\u003c/code> is re-implementing \u003ccode>variant=&quot;warning&quot;\u003c/code> badly, and then owns those values forever. The 2026-08-19 audit found this pattern across 23 files; the sweep is \u003ccode>doc/tasks/D1/\u003c/code>.\u003c/p>\n\u003ch2>Choosing\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Means\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>success\u003c/code>\u003c/td>\u003ctd>Online, passed, connected\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>warning\u003c/code>\u003c/td>\u003ctd>Needs a human — blocked or degraded\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>info\u003c/code>\u003c/td>\u003ctd>Queued, informational, no action implied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Failed, revoked, errored\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code> / \u003ccode>outline\u003c/code>\u003c/td>\u003ctd>A label, not a state\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Badges carry status, never brand.\u003c/strong> Brand is identity; status is meaning.\u003c/li>\n\u003cli>\u003cstrong>A badge is not a button.\u003c/strong> No click handlers. If it acts, it is a Button.\u003c/li>\n\u003cli>\u003cstrong>Colour is never the only signal.\u003c/strong> Pair with the word, as every example on the card does. A colour-blind user reading a grid of dots learns nothing.\u003c/li>\n\u003cli>\u003cstrong>Approval has no variant yet.\u003c/strong> \u003ccode>DESIGN.md\u003c/code> §2.4 specifies it (hue 310); it is not built. Until it is, do not approximate it with \u003ccode>warning\u003c/code> — that is the exact collapse the doctrine argues against.\u003c/li>\n\u003c/ul>","promptPath":"components\\badges\\badge.prompt.md","cardPath":"components\\badges\\badge.card.html","live":null}]},{"section":"Components","group":"Buttons","cards":[{"id":"buttons-button-card-html","name":"Button","description":"Six variants, four sizes — with the hover, focus-visible, and disabled states a prop table cannot show","section":"Components","group":"Buttons","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/buttons/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Button\u003c/title>\n\u003cmeta name=\"description\" content=\"Six variants, four sizes — with the hover, focus-visible, and disabled states a prop table cannot show\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .row{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;\n       padding:12px 0;border-bottom:1px solid var(--border)}\n  .row:last-of-type{border-bottom:0}\n  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\n       color:var(--muted-foreground)}\n  .set{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;\n       height:36px;padding:0 16px;border:0;border-radius:var(--radius-md);\n       font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;\n       transition:background-color .15s ease-out,color .15s ease-out}\n  .btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}\n  .btn:disabled{opacity:.5;pointer-events:none}\n  .default{background:var(--primary);color:var(--primary-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\n  .default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}\n  .destructive{background:var(--destructive);color:var(--destructive-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\n  .outline{background:var(--background);color:var(--foreground);border:1px solid var(--border);box-shadow:0 1px 2px rgb(0 0 0/.05)}\n  .outline:hover{background:var(--accent);color:var(--accent-foreground)}\n  .secondary{background:var(--secondary);color:var(--secondary-foreground);box-shadow:0 1px 2px rgb(0 0 0/.05)}\n  .ghost{background:transparent;color:var(--foreground)}\n  .ghost:hover{background:var(--accent);color:var(--accent-foreground)}\n  .link{background:transparent;color:var(--primary);text-underline-offset:4px}\n  .link:hover{text-decoration:underline}\n  .sm{height:32px;padding:0 12px;font-size:12px;border-radius:var(--radius-md)}\n  .lg{height:40px;padding:0 32px;border-radius:var(--radius-md)}\n  .icon{height:36px;width:36px;padding:0}\n  .forced{outline:2px solid var(--ring);outline-offset:2px}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Variants\u003c/div>\u003cdiv class=\"set\">\n  \u003cbutton class=\"btn default\">Run agent\u003c/button>\n  \u003cbutton class=\"btn secondary\">Secondary\u003c/button>\n  \u003cbutton class=\"btn outline\">Outline\u003c/button>\n  \u003cbutton class=\"btn ghost\">Ghost\u003c/button>\n  \u003cbutton class=\"btn destructive\">Delete\u003c/button>\n  \u003cbutton class=\"btn link\">Link\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">Sizes\u003c/div>\u003cdiv class=\"set\">\n  \u003cbutton class=\"btn default sm\">sm &middot; 32px\u003c/button>\n  \u003cbutton class=\"btn default\">default &middot; 36px\u003c/button>\n  \u003cbutton class=\"btn default lg\">lg &middot; 40px\u003c/button>\n  \u003cbutton class=\"btn default icon\" aria-label=\"Icon\">&#9679;\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"row\">\u003cdiv class=\"lbl\">States\u003c/div>\u003cdiv class=\"set\">\n  \u003cbutton class=\"btn default\">Rest\u003c/button>\n  \u003cbutton class=\"btn default forced\">Focus-visible\u003c/button>\n  \u003cbutton class=\"btn default\" disabled>Disabled\u003c/button>\n  \u003cbutton class=\"btn outline\" disabled>Disabled outline\u003c/button>\n\u003c/div>\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Hover is live\u003c/strong> — put the cursor on any variant above. Focus-visible is\n  forced on the third button in the States row so the ring is comparable without tabbing;\n  in the real component it appears only on keyboard focus, never on mouse click.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Shadow is per-variant, not global.\u003c/strong> \u003ccode>default\u003c/code>,\n  \u003ccode>destructive\u003c/code>, \u003ccode>outline\u003c/code>, and \u003ccode>secondary\u003c/code> carry a small\n  shadow; \u003ccode>ghost\u003c/code> and \u003ccode>link\u003c/code> deliberately do not — they are meant to\n  sit inside dense rows without stacking depth. There are no shadow tokens, so this is a\n  Tailwind \u003ccode>shadow-sm\u003c/code> at each call site.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Button — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/button.tsx\u003c/code>. Mirror mode — this card documents that file, it does not reimplement it.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Button } from &quot;@sparstrow/ui&quot;;\n&lt;Button variant=&quot;destructive&quot; size=&quot;sm&quot;&gt;Delete&lt;/Button&gt;\u003c/code>\u003c/pre>\n\u003ch2>Choosing a variant\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>Variant\u003c/th>\u003cth>Use for\u003c/th>\u003cth>Not for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>default\u003c/code>\u003c/td>\u003ctd>The one primary action on a surface\u003c/td>\u003ctd>Two of them on the same screen\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>secondary\u003c/code>\u003c/td>\u003ctd>A real alternative to the primary action\u003c/td>\u003ctd>Anything destructive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>outline\u003c/code>\u003c/td>\u003ctd>Actions in a toolbar or row where none dominates\u003c/td>\u003ctd>The main call to action\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>ghost\u003c/code>\u003c/td>\u003ctd>Dense rows and icon actions, where a border would add noise\u003c/td>\u003ctd>Anything the user must find quickly\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>destructive\u003c/code>\u003c/td>\u003ctd>Delete, revoke, stop — irreversible or disruptive\u003c/td>\u003ctd>Merely &quot;cancel&quot;\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>link\u003c/code>\u003c/td>\u003ctd>Navigation dressed as text\u003c/td>\u003ctd>Anything that mutates state\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>One \u003ccode>default\u003c/code> per surface.\u003c/strong> More than one and neither reads as primary.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>asChild\u003c/code> for navigation.\u003c/strong> Wrapping a \u003ccode>Link\u003c/code> in a Button breaks keyboard and middle-click behaviour; \u003ccode>asChild\u003c/code> keeps the anchor semantics.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>size=&quot;icon&quot;\u003c/code> needs an accessible name.\u003c/strong> It has no text, so pass \u003ccode>aria-label\u003c/code>. An icon button with no label is invisible to a screen reader.\u003c/li>\n\u003cli>\u003cstrong>Never restyle a variant at the call site.\u003c/strong> A \u003ccode>className\u003c/code> that changes the background is a new variant that only exists on one screen — add it to \u003ccode>button.tsx\u003c/code> or use an existing one.\u003c/li>\n\u003cli>\u003cstrong>Disabled is not an explanation.\u003c/strong> A disabled button with no adjacent reason reads as broken. Say why, or leave it enabled and fail with a message.\u003c/li>\n\u003c/ul>\n\u003ch2>Gaps worth knowing\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>No loading state.\u003c/strong> There is no \u003ccode>loading\u003c/code> prop and no spinner slot. Async actions currently disable the button and change nothing else, so a slow run looks identical to an ignored click. Handle it at the call site until the component grows one.\u003c/li>\n\u003cli>\u003cstrong>Shadows are Tailwind utilities\u003c/strong>, not tokens — see \u003ccode>tokens/spacing.css\u003c/code>.\u003c/li>\n\u003c/ul>","promptPath":"components\\buttons\\button.prompt.md","cardPath":"components\\buttons\\button.card.html","live":null}]},{"section":"Components","group":"Forms","cards":[{"id":"forms-input-card-html","name":"Input","description":"Rest, focus, invalid, and disabled — plus the labelling mistake placeholders invite","section":"Components","group":"Forms","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/forms/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Input\u003c/title>\n\u003cmeta name=\"description\" content=\"Rest, focus, invalid, and disabled — plus the labelling mistake placeholders invite\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}\n  .f{display:flex;flex-direction:column;gap:5px}\n  .lb{font-size:11px;font-weight:600;color:var(--foreground)}\n  .in{height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-md);\n      background:var(--background);color:var(--foreground);font-family:inherit;font-size:13px;width:100%;\n      box-sizing:border-box}\n  .in::placeholder{color:var(--muted-foreground)}\n  .in:focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:var(--ring)}\n  .focus{outline:2px solid var(--ring);outline-offset:-1px;border-color:var(--ring)}\n  .bad{border-color:var(--destructive)}\n  .msg{font-size:11px;color:var(--destructive)}\n  .hint{font-size:11px;color:var(--muted-foreground)}\n  .in:disabled{opacity:.5;cursor:not-allowed}\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"grid\">\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"a\">Machine name\u003c/label>\n    \u003cinput class=\"in\" id=\"a\" placeholder=\"workshop-desktop\">\u003c/div>\n\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"b\">Machine name &middot; focus\u003c/label>\n    \u003cinput class=\"in focus\" id=\"b\" value=\"workshop-desktop\">\u003c/div>\n\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"c\">Machine name &middot; invalid\u003c/label>\n    \u003cinput class=\"in bad\" id=\"c\" value=\"workshop desktop\" aria-invalid=\"true\" aria-describedby=\"e\">\n    \u003cdiv class=\"msg\" id=\"e\">Use a hyphen instead of a space.\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"f\">\u003clabel class=\"lb\" for=\"d\">Machine name &middot; disabled\u003c/label>\n    \u003cinput class=\"in\" id=\"d\" value=\"workshop-desktop\" disabled>\n    \u003cdiv class=\"hint\">Locked while the machine is online.\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Focus is forced on the second field\u003c/strong> so the ring is comparable without\n  tabbing. Click into the first to see the real behaviour &mdash; the ring is inset\n  (\u003ccode>outline-offset:-1px\u003c/code>) so it does not push adjacent rows in a dense form.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>The invalid field is the one worth studying.\u003c/strong> Red border, plus\n  \u003ccode>aria-invalid\u003c/code>, plus a message that says what to do &mdash; and\n  \u003ccode>aria-describedby\u003c/code> tying them together, which is what makes a screen reader\n  read the message when focus lands. A red border on its own passes a glance and fails a\n  user.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Every field above has a real \u003ccode>Label\u003c/code>.\u003c/strong> The placeholder in the\n  first is example content, not the label &mdash; it vanishes the moment someone types, which\n  is exactly when they most need to know what the field was.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Disabled says why.\u003c/strong> A greyed field with no adjacent reason reads as broken\n  rather than intentional.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Input — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/input.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Input placeholder=&quot;workshop-desktop&quot; aria-invalid={!!error} /&gt;\u003c/code>\u003c/pre>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Always label it.\u003c/strong> Use \u003ccode>Label\u003c/code> with \u003ccode>htmlFor\u003c/code>, or \u003ccode>aria-label\u003c/code> when the design genuinely has no room. A placeholder is not a label: it disappears exactly when the user needs it, and fails every accessibility check.\u003c/li>\n\u003cli>\u003cstrong>Error state is \u003ccode>aria-invalid\u003c/code>,\u003c/strong> not a red border added at the call site. The component styles the invalid state; a hand-added border is not announced to a screen reader.\u003c/li>\n\u003cli>\u003cstrong>Say what is wrong, below the field, in words.\u003c/strong> A red outline alone tells the user something is wrong, not what.\u003c/li>\n\u003cli>\u003cstrong>Derive validation from the Zod schema\u003c/strong> that already defines the contract, rather than hand-rolling a parallel check that can drift from it. See the \u003ccode>frontend-wiring\u003c/code> skill.\u003c/li>\n\u003c/ul>\n\u003ch2>Gap\u003c/h2>\n\u003cp>There is no \u003ccode>InputGroup\u003c/code>, no prefix/suffix slot, and no built-in error text element. Forms that need those compose them at the call site today, which is why field spacing varies between screens.\u003c/p>","promptPath":"components\\forms\\input.prompt.md","cardPath":"components\\forms\\input.card.html","live":null}]},{"section":"Components","group":"States","cards":[{"id":"states-empty-card-html","name":"Empty","description":"The screen a new user sees first — a good empty state next to the bare one it replaces","section":"Components","group":"States","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/states/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Empty\u003c/title>\n\u003cmeta name=\"description\" content=\"The screen a new user sees first — a good empty state next to the bare one it replaces\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n  .frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\n  .cap{padding:7px 12px;font-size:10.5px;font-weight:600;letter-spacing:.05em;\n       text-transform:uppercase;border-bottom:1px solid var(--border)}\n  .bad .cap{color:var(--destructive)}\n  .good .cap{color:var(--success-foreground);background:var(--success)}\n  .body{padding:32px 20px;text-align:center;background:var(--background);min-height:150px;\n        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}\n  .media{width:40px;height:40px;border-radius:var(--radius-md);background:var(--muted);\n         display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}\n  .title{font-size:15px;font-weight:600}\n  .desc{font-size:13px;line-height:1.6;color:var(--muted-foreground);max-width:34ch}\n  .cta{display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--radius-md);\n       background:var(--primary);color:var(--primary-foreground);font-size:12px;font-weight:500}\n  .flat{font-size:13px;color:var(--muted-foreground)}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"pair\">\n  \u003cdiv class=\"frame bad\">\u003cdiv class=\"cap\">Not this\u003c/div>\n    \u003cdiv class=\"body\">\u003cdiv class=\"flat\">No items.\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"frame good\">\u003cdiv class=\"cap\">This\u003c/div>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"media\">&#9633;\u003c/div>\n      \u003cdiv class=\"title\">No machines paired yet\u003c/div>\n      \u003cdiv class=\"desc\">Pair a machine to give your agents somewhere to run. It takes about a minute.\u003c/div>\n      \u003cdiv class=\"cta\">Pair a machine\u003c/div>\n    \u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>The empty state is the first screen a new user sees\u003c/strong>, and the most often\n  skipped of the four. The left frame is what a surface ships with when nobody wrote one:\n  technically correct, and it tells a new user nothing about what this page is for or how to\n  make it do something.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  The parts are \u003ccode>Empty\u003c/code> &rsaquo; \u003ccode>EmptyHeader\u003c/code> &rsaquo;\n  \u003ccode>EmptyMedia\u003c/code> &middot; \u003ccode>EmptyTitle\u003c/code> &middot;\n  \u003ccode>EmptyDescription\u003c/code> &rsaquo; \u003ccode>EmptyContent\u003c/code>. The rule that matters is\n  in the last slot: \u003cstrong>the copy explains what to do next, and the action that does it\n  is right there.\u003c/strong> A description ending in advice the user cannot act on from this\n  screen is half a state.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Empty — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/empty.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>import { Empty, EmptyHeader, EmptyMedia, EmptyTitle, EmptyDescription, EmptyContent } from &quot;@sparstrow/ui&quot;;\u003c/code>\u003c/pre>\n\u003cp>Parts: \u003ccode>Empty\u003c/code> &gt; \u003ccode>EmptyHeader\u003c/code> &gt; \u003ccode>EmptyMedia\u003c/code> / \u003ccode>EmptyTitle\u003c/code> / \u003ccode>EmptyDescription\u003c/code>\u003c/p>\n\u003cblockquote>\u003ccode>EmptyContent\u003c/code>. \u003ccode>emptyMediaVariants\u003c/code> controls the icon frame.\u003c/blockquote>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Never ship a bare &quot;No items.&quot;\u003c/strong> Copy says what this surface is for, and what to do to fill it.\u003c/li>\n\u003cli>\u003cstrong>The action goes in \u003ccode>EmptyContent\u003c/code>, on this screen.\u003c/strong> A description telling the user to go elsewhere is half a state.\u003c/li>\n\u003cli>\u003cstrong>Empty is not error.\u003c/strong> Nothing here yet, versus we could not load it. An empty state shown after a failed fetch is a lie the user acts on.\u003c/li>\n\u003cli>\u003cstrong>Empty is not loading.\u003c/strong> Use \u003ccode>Skeleton\u003c/code> while data is in flight; an empty state that flashes before data arrives reads as data loss.\u003c/li>\n\u003c/ul>\n\u003ch2>Where it belongs\u003c/h2>\n\u003cp>Every list, table, and panel — no exceptions. A surface with only its populated state is not finished. This is enforced by the four-states requirement in the \u003ccode>frontend-wiring\u003c/code> skill and graded in every task's definition of done.\u003c/p>","promptPath":"components\\states\\empty.prompt.md","cardPath":"components\\states\\empty.card.html","live":null},{"id":"states-skeleton-card-html","name":"Skeleton","description":"Shaped like the content it stands in for — beside the generic block that is not","section":"Components","group":"States","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/states/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Skeleton\u003c/title>\n\u003cmeta name=\"description\" content=\"Shaped like the content it stands in for — beside the generic block that is not\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--card);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n  .frame{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}\n  .cap{padding:7px 12px;font-size:10.5px;font-weight:600;letter-spacing:.05em;\n       text-transform:uppercase;border-bottom:1px solid var(--border);color:var(--muted-foreground)}\n  .body{padding:14px;background:var(--background);min-height:132px}\n  @keyframes spg-pulse{0%,100%{opacity:.25}50%{opacity:1}}\n  .sk{background:var(--muted);border-radius:var(--radius-md);animation:spg-pulse 1s ease-in-out infinite}\n  .rowi{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}\n  .rowi:last-child{border-bottom:0}\n  .real{font-size:13px}\n  .sub{font-size:11px;color:var(--muted-foreground);margin-top:2px}\n  .note{margin-top:16px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"pair\">\n  \u003cdiv class=\"frame\">\u003cdiv class=\"cap\">Generic block &mdash; promises nothing\u003c/div>\n    \u003cdiv class=\"body\">\u003cdiv class=\"sk\" style=\"height:104px\">\u003c/div>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"frame\">\u003cdiv class=\"cap\">Shaped like the row it replaces\u003c/div>\n    \u003cdiv class=\"body\">\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:44%\">\u003c/div>\n          \u003cdiv class=\"sk\" style=\"height:9px;width:26%;margin-top:6px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:56%\">\u003c/div>\n          \u003cdiv class=\"sk\" style=\"height:9px;width:22%;margin-top:6px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"rowi\">\u003cdiv class=\"sk\" style=\"width:28px;height:28px;border-radius:999px\">\u003c/div>\n        \u003cdiv style=\"flex:1\">\u003cdiv class=\"sk\" style=\"height:11px;width:38%\">\u003c/div>\n          \u003cdiv class=\"sk\" style=\"height:9px;width:30%;margin-top:6px\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"sk\" style=\"width:52px;height:20px\">\u003c/div>\u003c/div>\n    \u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>The right frame is the whole component in one idea.\u003c/strong> Same three-line\n  primitive, sized per element — avatar, name, subtitle, status chip — so the layout does not\n  move when the real rows arrive. The left frame loads for the same duration and tells the\n  user nothing about what is coming.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Skeleton, not a spinner\u003c/strong>, wherever the shape is knowable. A spinner says\n  something is happening; a skeleton says what. Both frames animate with the real\n  \u003ccode>spg-pulse\u003c/code> keyframe from globals.css &mdash; 1s ease-in-out, infinite.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Nothing here respects \u003ccode>prefers-reduced-motion\u003c/code>\u003c/strong>, because\n  nothing in the app does &mdash; verified 2026-08-19. On a page of skeletons that is a lot of\n  motion for a user who asked for none.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Skeleton — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/skeleton.tsx\u003c/code>. Mirror mode. The whole component is three lines: \u003ccode>animate-pulse rounded-md bg-muted\u003c/code> plus whatever \u003ccode>className\u003c/code> you pass.\u003c/p>\n\u003cpre class=\"code\" data-lang=\"tsx\">\u003ccode>&lt;Skeleton className=&quot;h-4 w-[220px]&quot; /&gt;\u003c/code>\u003c/pre>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Shape it like the content it stands in for.\u003c/strong> A skeleton is a promise about what is arriving; a generic grey block promises nothing and the layout jumps when the real content lands.\u003c/li>\n\u003cli>\u003cstrong>Skeleton, not a spinner,\u003c/strong> wherever the shape is knowable. A spinner says something is happening; a skeleton says what.\u003c/li>\n\u003cli>\u003cstrong>Match the row count you expect\u003c/strong>, roughly. Three skeleton rows resolving into eleven is its own small jolt.\u003c/li>\n\u003c/ul>\n\u003ch2>Known limitation\u003c/h2>\n\u003cp>\u003ccode>animate-pulse\u003c/code> is infinite and nothing in the app responds to \u003ccode>prefers-reduced-motion\u003c/code> — verified 2026-08-19, no match anywhere in \u003ccode>packages/ui/src\u003c/code> or \u003ccode>apps/web/src\u003c/code>. On a page full of skeletons that is a lot of unstoppable motion for a user who asked for none.\u003c/p>\n\u003cp>Note this is also why a \u003ccode>pulsing-dot\u003c/code> slop finding on this file is a false positive: the pulse here is a loading affordance, not an ambient decoration.\u003c/p>","promptPath":"components\\states\\skeleton.prompt.md","cardPath":"components\\states\\skeleton.card.html","live":null}]},{"section":"Components","group":"Surfaces","cards":[{"id":"surfaces-card-card-html","name":"Card","description":"The app","section":"Components","group":"Surfaces","html":"\u003c!doctype html>\n\u003chtml class=\"dark\">\u003chead>\u003cbase href=\"components/surfaces/\">\u003cmeta charset=\"utf-8\">\n\u003ctitle>Card\u003c/title>\n\u003cmeta name=\"description\" content=\"The app's one container — and the nesting that DESIGN.md and the slop catalogue both refuse\">\n\u003clink rel=\"stylesheet\" href=\"../../styles.css\">\n\u003cstyle>\n  body{margin:0;padding:20px;background:var(--background);color:var(--foreground);\n       font-family:var(--font-sans);font-size:14px}\n  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}\n  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg)}\n  .hd{padding:14px 16px 0}\n  .ti{font-size:15px;font-weight:600}\n  .de{font-size:12px;color:var(--muted-foreground);margin-top:3px;line-height:1.5}\n  .ct{padding:12px 16px}\n  .ft{padding:0 16px 14px;display:flex;gap:8px}\n  .btn{height:30px;padding:0 12px;border-radius:var(--radius-md);border:0;font-size:12px;\n       font-weight:500;font-family:inherit;background:var(--primary);color:var(--primary-foreground)}\n  .btn.g{background:transparent;color:var(--foreground);border:1px solid var(--border)}\n  .rowi{display:flex;justify-content:space-between;padding:7px 0;font-size:12px;\n        border-bottom:1px solid var(--border)}\n  .rowi:last-child{border-bottom:0}\n  .rowi span:last-child{color:var(--muted-foreground)}\n  .cap{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;\n       margin-bottom:8px;color:var(--muted-foreground)}\n  .bad .cap{color:var(--destructive)}\n  .inner{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);\n         padding:10px 12px;margin-top:8px;font-size:12px}\n  .note{margin-top:18px;font-size:12px;color:var(--muted-foreground);line-height:1.6}\n  .note strong{color:var(--foreground)}\n  code{font-size:11px;background:var(--muted);padding:1px 4px;border-radius:4px}\n\u003c/style>\u003c/head>\u003cbody>\n\n\u003cdiv class=\"pair\">\n  \u003cdiv>\n    \u003cdiv class=\"cap\">Card\u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"hd\">\u003cdiv class=\"ti\">workshop-desktop\u003c/div>\n        \u003cdiv class=\"de\">Windows 11 &middot; last seen 4 minutes ago\u003c/div>\u003c/div>\n      \u003cdiv class=\"ct\">\n        \u003cdiv class=\"rowi\">\u003cspan>Agents\u003c/span>\u003cspan>3 idle\u003c/span>\u003c/div>\n        \u003cdiv class=\"rowi\">\u003cspan>Runs today\u003c/span>\u003cspan>17\u003c/span>\u003c/div>\n        \u003cdiv class=\"rowi\">\u003cspan>Snapshots\u003c/span>\u003cspan>On\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"ft\">\u003cbutton class=\"btn\">Open\u003c/button>\u003cbutton class=\"btn g\">Revoke\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"bad\">\n    \u003cdiv class=\"cap\">Not this &mdash; nested cards\u003c/div>\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"hd\">\u003cdiv class=\"ti\">workshop-desktop\u003c/div>\u003c/div>\n      \u003cdiv class=\"ct\">\n        \u003cdiv class=\"inner\">Agents &middot; 3 idle\u003c/div>\n        \u003cdiv class=\"inner\">Runs today &middot; 17\u003c/div>\n        \u003cdiv class=\"inner\">Snapshots &middot; On\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003cstrong>Same information, twice.\u003c/strong> The left card separates rows with a 1px divider\n  and nothing else. The right one wraps each row in its own bordered surface, which adds\n  three more edges, two more radii, and a second elevation level that means nothing &mdash;\n  and makes every row look independently clickable when none of them is.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  \u003ccode>nested-cards\u003c/code> is a \u003cstrong>certain\u003c/strong>-tier rule in\n  \u003ccode>ai-design-slop\u003c/code>: depth used as a substitute for hierarchy. Spacing, weight, and\n  dividers do this job without adding a surface. If rows need to be distinguishable, change\n  the type or the spacing &mdash; not the container.\n\u003c/div>\n\n\u003cdiv class=\"note\">\n  Parts are \u003ccode>Card\u003c/code> &rsaquo; \u003ccode>CardHeader\u003c/code> &rsaquo;\n  \u003ccode>CardTitle\u003c/code> &middot; \u003ccode>CardDescription\u003c/code> &rsaquo;\n  \u003ccode>CardContent\u003c/code> &rsaquo; \u003ccode>CardFooter\u003c/code>. Cards sit on\n  \u003ccode>--background\u003c/code> and are \u003ccode>--card\u003c/code> themselves &mdash; which in light mode\n  are currently the same white, so the border is doing all the separating. See the Surfaces\n  guideline.\n\u003c/div>\n\n\u003c/body>\u003c/html>\n","prompt":"\u003ch1>Card — usage notes\u003c/h1>\n\u003cp>\u003cstrong>Source:\u003c/strong> \u003ccode>packages/ui/src/components/ui/card.tsx\u003c/code>. Mirror mode.\u003c/p>\n\u003cp>Parts: \u003ccode>Card\u003c/code> &gt; \u003ccode>CardHeader\u003c/code> &gt; \u003ccode>CardTitle\u003c/code> / \u003ccode>CardDescription\u003c/code> &gt; \u003ccode>CardContent\u003c/code>\u003c/p>\n\u003cblockquote>\u003ccode>CardFooter\u003c/code>.\u003c/blockquote>\n\u003ch2>Rules\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Never nest a Card in a Card.\u003c/strong> \u003ccode>nested-cards\u003c/code> is a certain-tier rule in the \u003ccode>ai-design-slop\u003c/code> catalogue: it is depth standing in for hierarchy. Use spacing, weight, and dividers instead. The card shows both versions side by side.\u003c/li>\n\u003cli>\u003cstrong>A card is a grouping, not a decoration.\u003c/strong> If the content inside has no relationship, the border is drawing a box around a coincidence.\u003c/li>\n\u003cli>\u003cstrong>Do not use a grid of identical cards as the page structure.\u003c/strong> That is \u003ccode>card-grid-as-structure\u003c/code> — the container that fits any content, and therefore says nothing about this content.\u003c/li>\n\u003cli>\u003cstrong>Cards do not stack elevation.\u003c/strong> There are no shadow tokens, and the app separates surfaces with \u003ccode>--border\u003c/code> plus a lightness step. In light mode there is no lightness step at all, so the border is load-bearing.\u003c/li>\n\u003c/ul>\n\u003ch2>Where it belongs\u003c/h2>\n\u003cp>Entity summaries, settings groups, and dialogs. Lists of rows are better as a table or a divided list than as a column of cards.\u003c/p>","promptPath":"components\\surfaces\\card.prompt.md","cardPath":"components\\surfaces\\card.card.html","live":null}]}]}</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById("payload").textContent);
  const navTree = document.getElementById("nav-tree");
  const cardsEl = document.getElementById("cards");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  document.getElementById("readme").innerHTML = data.readme || "";
  const total = data.sections.reduce((n, s) => n + s.cards.length, 0);
  document.getElementById("meta").textContent =
    `${total} cards · ${data.mode} mode` + (data.generatedAt ? ` · built ${data.generatedAt.slice(0,10)}` : "");

  // Group the flat section list by its section label so the rail reads
  // Foundations → Components → Designs, each with its own subgroups.
  const bySection = new Map();
  for (const g of data.sections) {
    if (!bySection.has(g.section)) bySection.set(g.section, []);
    bySection.get(g.section).push(g);
  }

  let navHtml = "", cardsHtml = "";
  for (const [section, groups] of bySection) {
    cardsHtml += `<div class="section-label">${esc(section)}</div>`;
    for (const g of groups) {
      navHtml += `<div class="nav-group" data-group="${esc(g.group)}">
        <button class="nav-head"><span class="chev">▾</span>${esc(g.group)}</button>
        <div class="nav-items">${g.cards.map((c) =>
          `<a href="#${esc(c.id)}" data-target="${esc(c.id)}">${esc(c.name)}</a>`).join("")}</div>
      </div>`;

      for (const c of g.cards) {
        const live = c.live
          ? `<a class="btn" href="${esc(c.live)}" target="_blank" rel="noopener">Open live ↗</a>` : "";
        const notes = c.prompt
          ? `<details class="notes"><summary>Usage notes for Claude</summary>
               <div class="notes-body">${c.prompt}</div></details>` : "";
        cardsHtml += `<section class="card-block" id="${esc(c.id)}" data-name="${esc(c.name.toLowerCase())}">
          <div class="card-head">
            <div>
              <div class="card-title">${esc(c.name)}</div>
              ${c.description ? `<div class="card-desc">${esc(c.description)}</div>` : ""}
            </div>
            <div class="card-actions">${live}</div>
          </div>
          <div class="frame-shell"><iframe data-card="${esc(c.id)}" loading="lazy" title="${esc(c.name)}"></iframe></div>
          ${notes}
        </section>`;
      }
    }
  }
  navTree.innerHTML = navHtml;
  cardsEl.innerHTML = cardsHtml;

  // Cards are injected via srcdoc after render so their own <style> stays
  // scoped to the frame — a card that ships a global reset cannot break the shell.
  const byId = new Map();
  for (const g of data.sections) for (const c of g.cards) byId.set(c.id, c);
  for (const frame of cardsEl.querySelectorAll("iframe")) {
    const card = byId.get(frame.dataset.card);
    if (!card) continue;
    frame.srcdoc = card.html;
    frame.addEventListener("load", () => {
      const fit = () => {
        try {
          const h = frame.contentDocument.documentElement.scrollHeight;
          frame.style.height = Math.min(Math.max(h, 90), 720) + "px";
        } catch { frame.style.height = "320px"; }
      };
      fit();
      // Cards with async content (fonts, images) settle after load.
      setTimeout(fit, 120);
      setTimeout(fit, 500);
    });
  }

  navTree.addEventListener("click", (e) => {
    const head = e.target.closest(".nav-head");
    if (head) {
      const grp = head.parentElement;
      grp.dataset.collapsed = grp.dataset.collapsed === "true" ? "false" : "true";
    }
  });

  // Highlight the rail entry for whatever is on screen.
  const links = [...navTree.querySelectorAll("a")];
  const obs = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      links.forEach((a) => a.classList.toggle("active", a.dataset.target === en.target.id));
    }
  }, { rootMargin: "-70px 0px -70% 0px" });
  cardsEl.querySelectorAll(".card-block").forEach((s) => obs.observe(s));

  document.getElementById("filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    for (const block of cardsEl.querySelectorAll(".card-block")) {
      const hit = !q || block.dataset.name.includes(q);
      block.hidden = !hit;
      if (hit) shown++;
    }
    for (const label of cardsEl.querySelectorAll(".section-label")) {
      let n = label.nextElementSibling, any = false;
      while (n && !n.classList.contains("section-label")) { if (!n.hidden) any = true; n = n.nextElementSibling; }
      label.hidden = !any;
    }
    for (const a of links) {
      const t = document.getElementById(a.dataset.target);
      a.hidden = t ? t.hidden : false;
    }
    document.getElementById("empty").hidden = shown > 0;
  });

  let allOpen = false;
  document.getElementById("expand-all").addEventListener("click", (e) => {
    allOpen = !allOpen;
    cardsEl.querySelectorAll("details.notes").forEach((d) => (d.open = allOpen));
    e.target.textContent = allOpen ? "Collapse notes" : "Expand notes";
  });

  const root = document.documentElement;
  const themeBtn = document.getElementById("theme");
  let theme = data.theme?.default || "dark";

  // Projects disagree on how dark mode is expressed: some use
  // [data-theme="dark"], Tailwind's convention is a .dark class. Applying both
  // means a card written for either convention responds to this toggle, so the
  // system does not have to be rewritten to match the host app's choice.
  const applyTheme = (doc) => {
    const el = doc.documentElement;
    el.dataset.theme = theme;
    el.classList.toggle("dark", theme === "dark");
  };
  const applyAll = () => {
    applyTheme(document);
    for (const f of cardsEl.querySelectorAll("iframe")) {
      try { applyTheme(f.contentDocument); } catch {}
    }
    themeBtn.textContent = theme === "dark" ? "Light" : "Dark";
  };
  applyAll();
  // Frames finish loading after this runs, so re-apply as each one arrives.
  cardsEl.addEventListener("load", (e) => {
    if (e.target.tagName === "IFRAME") { try { applyTheme(e.target.contentDocument); } catch {} }
  }, true);
  themeBtn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    applyAll();
  });
})();
</script>
</body>
</html>
